<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Radon Explorer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        /* --- Reset (box-sizing, margins, form font inheritance, media display) --- */
        *, ::before, ::after { box-sizing: border-box; border-width: 0; border-style: solid; border-color: #e5e7eb; }
        html { line-height: 1.5; -webkit-text-size-adjust: 100%; tab-size: 4; }
        body { margin: 0; line-height: inherit; }
        h1, h2, h3, p { margin: 0; }
        h1, h2, h3 { font-size: inherit; font-weight: inherit; }
        button, input, select { font-family: inherit; font-size: 100%; font-weight: inherit; line-height: inherit; color: inherit; margin: 0; padding: 0; }
        button, select { text-transform: none; }
        button { background-color: transparent; background-image: none; cursor: pointer; -webkit-appearance: button; appearance: button; }
        select { -webkit-appearance: menulist; }
        canvas, video { display: block; vertical-align: middle; }
        video { max-width: 100%; height: auto; }
        [hidden] { display: none; }
        .hidden { display: none; }

        /* --- Layout --- */
        body { display: flex; flex-direction: column; height: 100vh; background-color: #f3f4f6; overflow: hidden; }
        .app-header { background-color: #fff; padding: 0.75rem; width: 100%; z-index: 10;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
        .header-inner { width: 100%; margin-left: auto; margin-right: auto; display: flex; align-items: center;
            justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
        @media (min-width: 640px) { .header-inner { max-width: 640px; } }
        @media (min-width: 768px) { .header-inner { max-width: 768px; } }
        @media (min-width: 1024px) { .header-inner { max-width: 1024px; } }
        @media (min-width: 1280px) { .header-inner { max-width: 1280px; } }
        @media (min-width: 1536px) { .header-inner { max-width: 1536px; } }
        .header-group { display: flex; align-items: center; gap: 2rem; }
        .app-title { display: none; font-size: 1.25rem; line-height: 1.75rem; font-weight: 700; color: #1f2937; }
        @media (min-width: 640px) { .app-title { display: block; } }
        .toolbar { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .field { display: flex; align-items: center; gap: 0.5rem; }
        .status { width: 100%; margin-top: 0.5rem; font-size: 0.875rem; line-height: 1.25rem; text-align: center; color: #4b5563; }
        @media (min-width: 640px) { .status { width: auto; margin-top: 0; } }
        .app-main { flex-grow: 1; display: grid; align-items: start; justify-items: center; overflow: auto; grid-template-columns: repeat(1, minmax(0, 1fr)); padding:2rem;gap:3rem;} @media (min-width:768px){.app-main{padding:3rem;grid-template-columns:repeat(3,minmax(0,1fr));}} 
        .panel { width: 100%; display: flex; flex-direction: column; align-items: center; }
        .app-footer { width: 100%; padding: 0.5rem; background-color: #fff; border-top-width: 1px; }
        .app-footer-plain { background-color: #f3f4f6; border-top-width: 0; }
        .footer-text { text-align: left; font-size: 0.75rem; line-height: 1rem; color: #6b7280; }
        .section-title { font-size: 1.25rem; line-height: 1.75rem; font-weight: 600; text-align: center; margin-bottom: 0.75rem; color: #374151; }
        .panel-title { font-size: 1.125rem; line-height: 1.75rem; font-weight: 600; text-align: center; margin-bottom: 0.75rem; color: #374151; }
        .panel-title-sm { margin-bottom: 0.5rem; }

        /* --- Controls --- */
        .label { font-size: 0.875rem; line-height: 1.25rem; font-weight: 500; color: #374151; }
        .btn { --ring-color: #3b82f6; color: #fff; padding: 0.5rem 1rem; border-radius: 0.5rem;
            outline: 2px solid transparent; outline-offset: 2px; transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-blue { background-color: #3b82f6; --ring-color: #3b82f6; }
        .btn-blue:hover { background-color: #2563eb; }
        .btn-green { background-color: #22c55e; --ring-color: #22c55e; }
        .btn-green:hover { background-color: #16a34a; }
        .select { background-color: #f9fafb; border: 1px solid #d1d5db; color: #111827; font-size: 0.875rem; line-height: 1.25rem;
            border-radius: 0.5rem; padding: 0.5rem; }
        .select:focus { border-color: #3b82f6; }
        .checkbox { height: 1rem; width: 1rem; border-radius: 0.25rem; border-color: #d1d5db; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
        .threshold-value { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.875rem; line-height: 1.25rem; color: #374151; width: 2rem; }

        /* --- Plot frames and axis labels --- */
        .plot { position: relative; width: 100%; max-width: 512px; }
        .plot-col { display: flex; flex-direction: column; align-items: center; }
        .block512 { width: 100%; max-width: 512px; }
        .profile-block { margin-top: 1rem; }
        .anchored { position: relative; }
        .sweep { width: 100%; margin-top: 1rem; }
        .sweep-label { display: block; text-align: center; font-size: 0.875rem; line-height: 1.25rem; font-weight: 500; color: #374151; margin-top: 0.25rem; }
        .caption { font-size: 0.875rem; line-height: 1.25rem; text-align: center; color: #4b5563; margin-top: 0.25rem; margin-bottom: 0.5rem; }
        .caption-x { margin-top: 0.5rem; margin-bottom: 0; }
        .axis-title { position: absolute; left: -2rem; top: 50%; transform: translateY(-50%) rotate(-90deg);
            font-size: 0.875rem; line-height: 1.25rem; color: #4b5563; background-color: #f3f4f6; padding-left: 0.5rem; padding-right: 0.5rem; }
        .axis-title-near { left: -1rem; }
        .tick { position: absolute; font-size: 0.75rem; line-height: 1rem; color: #6b7280; }
        .tick-top { left: 0; top: 0; transform: translateX(-100%); padding-right: 0.25rem; }
        .tick-bottom { left: 0; bottom: 0; transform: translateX(-100%); padding-right: 0.25rem; }
        .tick-below-left { bottom: -1.25rem; left: 0; }
        .tick-below-right { bottom: -1.25rem; right: 0; }
        body {
            font-family: 'Inter', sans-serif;
        }
        .canvas-wrapper {
            background-color: #e5e7eb; /* gray-200 */
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 512px;
            aspect-ratio: 1 / 1;
        }
        .projection-wrapper {
            background-color: #e5e7eb; /* gray-200 */
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 512px;
            height: 80px;
        }
        canvas, video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .active-btn {
            box-shadow: 0 0 0 2px #fff, 0 0 0 5px var(--ring-color);
        }
         input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            background: #d1d5db; /* gray-300 */
            height: 0.5rem;
            border-radius: 0.25rem;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 1rem;
            width: 1rem;
            border-radius: 9999px;
            background: #3b82f6; /* blue-500 */
            cursor: pointer;
            margin-top: -0.25rem;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-inner">
            <div class="header-group">
                <h1 class="app-title">2D Radon Explorer</h1>
                <div class="toolbar">
                    <button id="use-upload-btn" class="btn btn-blue">
                        Upload Image
                    </button>
                    <div class="field">
                        <label for="function-presets" class="label">or select a Preset:</label>
                        <select id="function-presets" class="select">
                            <option value="upload" id="upload-option" disabled hidden>Uploaded image</option>
                            <option value="point" selected>Point</option>
                            <option value="two-points">Two Points</option>
                            <option value="line-segment">Line Segment</option>
                            <option value="gaussian-blob">Gaussian Blob</option>
                            <option value="sine-wave">Sine Wave Grating</option>
                            <option value="checkerboard">Checkerboard</option>
                            <option value="spokes">Spokes</option>
                            <option value="simple-phantom">Simple Organ Phantom</option>
                            <option value="text">Text</option>
                            <option value="circle">Circle</option>
                            <option value="square">Square</option>
                            <option value="concentric-circles">Concentric Circles</option>
                            <option value="embedded-squares">Embedded Squares</option>
                            <option value="shepp-logan">Shepp-Logan Phantom</option>
                        </select>
                    </div>


                    <div class="field">
    <input type="checkbox" id="filter-checkbox" class="checkbox" checked>
    <label for="filter-checkbox" class="label">Filter Back-Projection</label>
</div>

<input type="file" id="image-upload" class="hidden" accept="image/png, image/jpeg">
                </div>
            </div>
            <div id="status" class="status">Select a source to begin.</div>
        </div>
    </header>

    <main class="app-main">
        <div class="panel">
            <h3 class="panel-title">Source</h3>
            <div class="plot">
                <p class="axis-title axis-title-near">y</p>
                <div id="source-wrapper" class="canvas-wrapper anchored">
                    <canvas id="sourceCanvas"></canvas>
                    <canvas id="sourceOverlayCanvas" class="overlay-canvas"></canvas>
                </div>
                <p id="source-y-pos" class="tick tick-top"></p>
                <p id="source-y-neg" class="tick tick-bottom"></p>
                <p id="source-x-neg" class="tick tick-below-left"></p>
                <p id="source-x-pos" class="tick tick-below-right"></p>
            </div>
             <div class="block512">
                <div id="sweep-container" class="sweep">
                    <input type="range" id="sweep-slider" min="0" value="0">
                    <label for="sweep-slider" class="sweep-label">Sweep Angle (θ): <span id="sweep-value" class="mono">0</span>°</label>
                </div>
            </div>
        </div>
        <div class="panel">
            <h3 class="panel-title">Radon Transform (Sinogram)</h3>
            <div class="plot">
                <p class="axis-title">Position (ρ)</p>
                <div id="radon-wrapper" class="canvas-wrapper anchored">
                    <canvas id="radonCanvas"></canvas>
                    <canvas id="radonOverlayCanvas" class="overlay-canvas"></canvas>
                </div>
                <p id="rho-max-label" class="tick tick-top"></p>
                <p id="rho-min-label" class="tick tick-bottom"></p>
                <p class="tick tick-below-left">0°</p>
                <p class="tick tick-below-right">180°</p>
            </div>
             <div class="block512 profile-block">
                 <p class="caption">Projection Profile at θ = <span id="sweep-value-2" class="mono">0</span>°</p>
                 <div class="projection-wrapper">
                    <canvas id="projectionCanvas"></canvas>
                 </div>
            </div>
        </div>
        <div class="panel">
            <h3 class="panel-title">Reconstruction</h3>
            <div class="plot">
                <p class="axis-title axis-title-near">y</p>
                <div id="recon-wrapper" class="canvas-wrapper">
                    <canvas id="reconstructionCanvas"></canvas>
                </div>
                <p id="recon-y-pos" class="tick tick-top"></p>
                <p id="recon-y-neg" class="tick tick-bottom"></p>
                <p id="recon-x-neg" class="tick tick-below-left"></p>
                <p id="recon-x-pos" class="tick tick-below-right"></p>
            </div>
            <div class="block512">
                <p class="caption caption-x">x</p>
            </div>
        </div>
    </main>

    <footer class="app-footer app-footer-plain">
        <p class="footer-text">
            NitaD, Univ. Paris-Saclay, 17 August 2025
        </p>
    </footer>

    <script>
        // --- Elements ---
        const $ = id => document.getElementById(id);
        const useUploadBtn = $('use-upload-btn'),
            imageUpload = $('image-upload'),
            statusEl = $('status'),
            sourceCanvas = $('sourceCanvas'),
            sourceCtx = sourceCanvas.getContext('2d', { willReadFrequently: true }),
            radonCanvas = $('radonCanvas'),
            radonCtx = radonCanvas.getContext('2d'),
            reconstructionCanvas = $('reconstructionCanvas'),
            reconstructionCtx = reconstructionCanvas.getContext('2d'),
            projectionCanvas = $('projectionCanvas'),
            projectionCtx = projectionCanvas.getContext('2d'),
            functionPresets = $('function-presets'),
            uploadOption = $('upload-option'),
            filterCheckbox = $('filter-checkbox'),
            sourceWrapper = $('source-wrapper'),
            sourceOverlayCanvas = $('sourceOverlayCanvas'),
            sourceOverlayCtx = sourceOverlayCanvas.getContext('2d'),
            radonOverlayCanvas = $('radonOverlayCanvas'),
            radonOverlayCtx = radonOverlayCanvas.getContext('2d'),
            sweepSlider = $('sweep-slider'),
            sweepValue = $('sweep-value'),
            sweepValue2 = $('sweep-value-2');

        // --- Constants & State ---
        const IMG_SIZE = 256;
        const INTERACTIVE_MODES = ['point', 'two-points'];
        const PIXEL_GENERATORS = ['shepp-logan', 'gaussian-blob', 'sine-wave'];

        let NUM_ANGLES, NUM_RHO, RHO_OFFSET;   // RHO_OFFSET: bin index of rho = 0
        let currentMode = null, sourceImage = new Image(), currentObjectURL = null;
        let randomPoints = [];
        let cosAngles, sinAngles;
        let currentSinogram = null;
        let runToken = 0;

        // Angle of sinogram column i (shared by transform, slider and overlays)
        const angleOf = i => i * Math.PI / NUM_ANGLES;

        // --- Initial Setup ---
        function initializeParameters() {
            const rhoMax = Math.hypot(IMG_SIZE, IMG_SIZE) / 2;
            NUM_RHO = 2 * Math.ceil(rhoMax) + 2;   // +2 margin for interpolation
            RHO_OFFSET = NUM_RHO / 2;
            NUM_ANGLES = Math.round(IMG_SIZE * 1.5);

            cosAngles = new Float64Array(NUM_ANGLES);
            sinAngles = new Float64Array(NUM_ANGLES);
            for (let i = 0; i < NUM_ANGLES; i++) {
                cosAngles[i] = Math.cos(angleOf(i));
                sinAngles[i] = Math.sin(angleOf(i));
            }

            [sourceCanvas, reconstructionCanvas, sourceOverlayCanvas].forEach(c => c.width = c.height = IMG_SIZE);
            sweepSlider.max = NUM_ANGLES - 1;
            projectionCanvas.width = NUM_RHO;
            projectionCanvas.height = 80;

            const halfSize = IMG_SIZE / 2;
            const labels = {
                'source-y-pos': halfSize, 'source-y-neg': -halfSize,
                'source-x-neg': -halfSize, 'source-x-pos': halfSize,
                'recon-y-pos': halfSize, 'recon-y-neg': -halfSize,
                'recon-x-neg': -halfSize, 'recon-x-pos': halfSize,
                'rho-max-label': `+${RHO_OFFSET}`, 'rho-min-label': `-${RHO_OFFSET}`
            };
            for (const [id, value] of Object.entries(labels)) $(id).textContent = value;
        }

        initializeParameters();

        useUploadBtn.addEventListener('click', () => imageUpload.click());
        imageUpload.addEventListener('change', handleImageUpload);
        functionPresets.addEventListener('change', () => { setupMode('function'); performTransform(); });
        filterCheckbox.addEventListener('change', () => performTransform());
        sweepSlider.addEventListener('input', e => handleSliderChange(parseInt(e.target.value, 10)));

        setupMode('function');
        performTransform();

        // --- Mode Setup ---
        function setupMode(mode) {
            currentMode = mode;
            useUploadBtn.classList.toggle('active-btn', mode === 'upload');
            sourceWrapper.style.cursor = 'default';
            if (mode === 'upload') {
                functionPresets.value = 'upload';   // any later preset pick fires 'change'
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            imageUpload.value = '';   // allow re-uploading the same file
            if (!file) return;

            const url = URL.createObjectURL(file);
            sourceImage = new Image();
            sourceImage.onload = () => {
                if (currentObjectURL) URL.revokeObjectURL(currentObjectURL);
                currentObjectURL = url;
                setupMode('upload');
                performTransform();
            };
            sourceImage.onerror = () => {
                URL.revokeObjectURL(url);
                statusEl.textContent = 'Could not load that image.';
            };
            sourceImage.src = url;
        }

        // --- Main Execution (yields so the status actually renders) ---
        async function performTransform() {
            const token = ++runToken;
            statusEl.textContent = 'Processing...';
            await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
            if (token !== runToken) return;   // superseded by a newer request

            if (currentMode === 'function' && functionPresets.value === 'text' && document.fonts) {
                try { await document.fonts.load('24px Inter'); } catch (e) { /* fall back */ }
                if (token !== runToken) return;
            }

            const startTime = performance.now();
            generateSource();

            const imageData = sourceCtx.getImageData(0, 0, IMG_SIZE, IMG_SIZE);
            currentSinogram = radonTransform(imageData);
            drawSinogram(currentSinogram);

            const finalSinogram = filterCheckbox.checked ? filterSinogram(currentSinogram) : currentSinogram;
            drawReconstruction(inverseRadonTransform(finalSinogram, IMG_SIZE, IMG_SIZE));

            sweepSlider.value = 0;
            handleSliderChange(0);

            statusEl.textContent = `Transform complete (${Math.round(performance.now() - startTime)}ms).`;
        }

        function generateSource() {
            if (currentMode === 'function') {
                generateFromFunction();
            } else if (currentMode === 'upload' && sourceImage.complete && sourceImage.naturalWidth) {
                drawSourceToCanvas(sourceImage);
            }
        }

        // --- Core Logic ---
        // Pixel (x, y) center in math coordinates (y up, origin at image center)
        // x_m = x + 0.5 - W/2,  y_m = H/2 - (y + 0.5)

        function radonTransform(imageData) {
            const width = imageData.width, height = imageData.height, data = imageData.data;
            const cx = width / 2, cy = height / 2;
            const sinogram = Array.from({ length: NUM_ANGLES }, () => new Float32Array(NUM_RHO));

            const intensities = new Float32Array(width * height);
            for (let p = 0; p < width * height; p++) {
                const idx = p * 4;
                if (data[idx + 3] > 0) intensities[p] = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
            }

            for (let t = 0; t < NUM_ANGLES; t++) {
                const cosA = cosAngles[t], sinA = sinAngles[t], row = sinogram[t];
                for (let y = 0; y < height; y++) {
                    const yTerm = (cy - (y + 0.5)) * sinA;
                    const rowOffset = y * width;
                    for (let x = 0; x < width; x++) {
                        const intensity = intensities[rowOffset + x];
                        if (intensity <= 0) continue;
                        // Linear split between the two nearest rho bins
                        const f = (x + 0.5 - cx) * cosA + yTerm + RHO_OFFSET;
                        const i0 = Math.floor(f), w = f - i0;
                        if (i0 >= 0 && i0 < NUM_RHO) row[i0] += intensity * (1 - w);
                        if (i0 + 1 >= 0 && i0 + 1 < NUM_RHO) row[i0 + 1] += intensity * w;
                    }
                }
            }
            return sinogram;
        }

        // Ram-Lak filter (spatial form, scaled by 4): h[0] = 1, h[odd n] = -4/(π²n²), h[even n] = 0
        function filterSinogram(sinogram) {
            const numAngles = sinogram.length;
            if (numAngles === 0) return sinogram;
            const numRho = sinogram[0].length;
            const kernel = new Float64Array(numRho);   // kernel[n] for n >= 1 (odd only nonzero)
            for (let n = 1; n < numRho; n += 2) kernel[n] = -4 / (Math.PI * Math.PI * n * n);

            return sinogram.map(src => {
                const out = new Float32Array(numRho);
                for (let i = 0; i < numRho; i++) {
                    let sum = src[i];
                    for (let n = 1; n < numRho; n += 2) {
                        const k = kernel[n];
                        if (i - n >= 0) sum += src[i - n] * k;
                        if (i + n < numRho) sum += src[i + n] * k;
                    }
                    out[i] = sum;
                }
                return out;
            });
        }

        function inverseRadonTransform(sinogram, width, height) {
            const numAngles = sinogram.length;
            const reconstructed = new Float32Array(width * height);
            if (numAngles === 0) return reconstructed;
            const numRho = sinogram[0].length;
            const offset = numRho / 2;
            const cx = width / 2, cy = height / 2;

            for (let t = 0; t < numAngles; t++) {
                const angle = t * Math.PI / numAngles;
                const cosA = Math.cos(angle), sinA = Math.sin(angle);
                const row = sinogram[t];
                for (let y = 0; y < height; y++) {
                    const yTerm = (cy - (y + 0.5)) * sinA;
                    const rowOffset = y * width;
                    for (let x = 0; x < width; x++) {
                        const f = (x + 0.5 - cx) * cosA + yTerm + offset;
                        const i0 = Math.floor(f), w = f - i0;
                        if (i0 >= 0 && i0 + 1 < numRho) {
                            reconstructed[rowOffset + x] += row[i0] * (1 - w) + row[i0 + 1] * w;
                        }
                    }
                }
            }
            return reconstructed;
        }

        // --- Visualization ---
        function drawSinogram(sinogram) {
            const numAngles = sinogram.length;
            if (numAngles === 0) { radonOverlayCanvas.width = radonOverlayCanvas.height = 0; return; }
            const numRho = sinogram[0].length;
            radonCanvas.width = radonOverlayCanvas.width = numAngles;
            radonCanvas.height = radonOverlayCanvas.height = numRho;

            const out = radonCtx.createImageData(numAngles, numRho);
            let maxVal = 0;
            for (const row of sinogram) for (let j = 0; j < numRho; j++) if (row[j] > maxVal) maxVal = row[j];
            const scale = maxVal > 0 ? 255 / maxVal : 0;

            for (let t = 0; t < numAngles; t++) {
                const row = sinogram[t];
                for (let r = 0; r < numRho; r++) {
                    const val = row[r] * scale;
                    const idx = ((numRho - 1 - r) * numAngles + t) * 4;   // +rho at top
                    out.data[idx] = out.data[idx + 1] = out.data[idx + 2] = val;
                    out.data[idx + 3] = 255;
                }
            }
            radonCtx.putImageData(out, 0, 0);
        }

        function drawReconstruction(data) {
            const out = reconstructionCtx.createImageData(IMG_SIZE, IMG_SIZE);
            let maxVal = -Infinity, minVal = Infinity;
            for (let i = 0; i < data.length; i++) {
                if (data[i] > maxVal) maxVal = data[i];
                if (data[i] < minVal) minVal = data[i];
            }
            const range = maxVal - minVal;
            const scale = range > 1e-9 ? 255 / range : 0;
            for (let i = 0; i < data.length; i++) {
                const idx = i * 4;
                out.data[idx] = out.data[idx + 1] = out.data[idx + 2] = (data[i] - minVal) * scale;
                out.data[idx + 3] = 255;
            }
            reconstructionCtx.putImageData(out, 0, 0);
        }

        function drawProjectionProfile(t) {
            if (!currentSinogram) return;
            const proj = currentSinogram[t];
            const w = projectionCanvas.width, h = projectionCanvas.height;
            projectionCtx.clearRect(0, 0, w, h);

            let maxVal = 0;
            for (let i = 0; i < proj.length; i++) if (proj[i] > maxVal) maxVal = proj[i];
            if (maxVal === 0) return;

            const scaleY = (h - 2) / maxVal;
            projectionCtx.beginPath();
            projectionCtx.moveTo(0, h);
            for (let i = 0; i < proj.length; i++) {
                projectionCtx.lineTo(((i + 0.5) / proj.length) * w, h - proj[i] * scaleY);
            }
            projectionCtx.lineTo(w, h);
            projectionCtx.closePath();
            projectionCtx.fillStyle = 'rgba(59, 130, 246, 0.5)';
            projectionCtx.strokeStyle = 'rgba(59, 130, 246, 1)';
            projectionCtx.lineWidth = 2;
            projectionCtx.fill();
            projectionCtx.stroke();
        }

        // --- Preset Generation ---
        function generateFromFunction() {
            const type = functionPresets.value;
            sourceCtx.fillStyle = 'black';
            sourceCtx.fillRect(0, 0, IMG_SIZE, IMG_SIZE);
            randomPoints = [];

            if (PIXEL_GENERATORS.includes(type)) {
                const phantomData = type === 'shepp-logan' ? createSheppLoganData(IMG_SIZE)
                                  : type === 'gaussian-blob' ? createGaussianData(IMG_SIZE)
                                  : createSineWaveData(IMG_SIZE);
                const imageData = sourceCtx.createImageData(IMG_SIZE, IMG_SIZE);
                for (let i = 0; i < imageData.data.length; i += 4) {
                    const val = phantomData[i / 4];
                    imageData.data[i] = imageData.data[i + 1] = imageData.data[i + 2] = val;
                    imageData.data[i + 3] = 255;
                }
                sourceCtx.putImageData(imageData, 0, 0);
                return;
            }

            const S = IMG_SIZE;
            sourceCtx.save();
            sourceCtx.translate(S / 2, S / 2);
            sourceCtx.fillStyle = 'white';

            if (type === 'circle') {
                sourceCtx.beginPath(); sourceCtx.arc(0, 0, S * 0.4, 0, 2 * Math.PI); sourceCtx.fill();
            } else if (type === 'square') {
                sourceCtx.fillRect(-S * 0.3, -S * 0.3, S * 0.6, S * 0.6);
            } else if (type === 'embedded-squares') {
                sourceCtx.fillRect(-S * 0.4, -S * 0.4, S * 0.8, S * 0.8);
                sourceCtx.fillStyle = 'gray';
                sourceCtx.fillRect(-S * 0.2, -S * 0.2, S * 0.4, S * 0.4);
            } else if (type === 'concentric-circles') {
                sourceCtx.beginPath(); sourceCtx.arc(0, 0, S * 0.45, 0, 2 * Math.PI); sourceCtx.fill();
                sourceCtx.fillStyle = 'gray';
                sourceCtx.beginPath(); sourceCtx.arc(0, 0, S * 0.25, 0, 2 * Math.PI); sourceCtx.fill();
            } else if (type === 'point') {
                const x = 60, y = 40;
                randomPoints.push({ x, y });
                sourceCtx.fillRect(x - 2, -y - 2, 4, 4);
            } else if (type === 'two-points') {
                const x1 = 60, y1 = 40, x2 = -30, y2 = -70;
                randomPoints.push({ x: x1, y: y1 }, { x: x2, y: y2 });
                sourceCtx.fillRect(x1 - 2, -y1 - 2, 4, 4);
                sourceCtx.fillStyle = 'gray';
                sourceCtx.fillRect(x2 - 2, -y2 - 2, 4, 4);
            } else if (type === 'text') {
                sourceCtx.font = '24px Inter, sans-serif';
                sourceCtx.textAlign = 'center';
                sourceCtx.textBaseline = 'middle';
                sourceCtx.fillText('nitad54448.github.io', 0, -S / 4);
            } else if (type === 'line-segment') {
                sourceCtx.strokeStyle = 'white';
                sourceCtx.lineWidth = 3;
                sourceCtx.beginPath();
                sourceCtx.moveTo(-S * 0.4, -S * 0.3);
                sourceCtx.lineTo(S * 0.4, S * 0.3);
                sourceCtx.stroke();
            } else if (type === 'spokes') {
                sourceCtx.strokeStyle = 'white';
                sourceCtx.lineWidth = 1.5;
                const numSpokes = 12;
                for (let i = 0; i < numSpokes; i++) {
                    sourceCtx.rotate(Math.PI * 2 / numSpokes);
                    sourceCtx.beginPath();
                    sourceCtx.moveTo(0, 0);
                    sourceCtx.lineTo(S * 0.45, 0);
                    sourceCtx.stroke();
                }
            } else if (type === 'checkerboard') {
                const n = 8, sq = S / n;
                for (let i = 0; i < n; i++)
                    for (let j = 0; j < n; j++)
                        if ((i + j) % 2 === 0) sourceCtx.fillRect(i * sq - S / 2, j * sq - S / 2, sq, sq);
            } else if (type === 'simple-phantom') {
                sourceCtx.fillStyle = '#666666';
                sourceCtx.beginPath(); sourceCtx.ellipse(0, 0, S * 0.45, S * 0.35, 0, 0, 2 * Math.PI); sourceCtx.fill();
                sourceCtx.fillStyle = '#FFFFFF';
                sourceCtx.beginPath(); sourceCtx.arc(S * 0.15, -S * 0.1, S * 0.1, 0, 2 * Math.PI); sourceCtx.fill();
                sourceCtx.fillStyle = '#B3B3B3';
                sourceCtx.beginPath(); sourceCtx.arc(-S * 0.2, S * 0.1, S * 0.12, 0, 2 * Math.PI); sourceCtx.fill();
            }
            sourceCtx.restore();
        }

        function drawSourceToCanvas(source) {
            sourceCtx.fillStyle = 'black';
            sourceCtx.fillRect(0, 0, IMG_SIZE, IMG_SIZE);
            const sw = source.naturalWidth, sh = source.naturalHeight;
            const ratio = Math.min(IMG_SIZE / sw, IMG_SIZE / sh);
            sourceCtx.drawImage(source, 0, 0, sw, sh,
                (IMG_SIZE - sw * ratio) / 2, (IMG_SIZE - sh * ratio) / 2, sw * ratio, sh * ratio);
        }

        // Modified (Toft) Shepp-Logan phantom, standard geometry.
        // [x0, y0, a (semi-axis along x), b (along y), angle (deg, CCW), gray]
        function createSheppLoganData(size) {
            const data = new Float32Array(size * size);
            const ellipses = [
                [ 0,     0,      0.69,   0.92,    0,   1.0],
                [ 0,    -0.0184, 0.6624, 0.874,   0,  -0.8],
                [ 0.22,  0,      0.11,   0.31,  -18,  -0.2],
                [-0.22,  0,      0.16,   0.41,   18,  -0.2],
                [ 0,     0.35,   0.21,   0.25,    0,   0.1],
                [ 0,     0.1,    0.046,  0.046,   0,   0.1],
                [ 0,    -0.1,    0.046,  0.046,   0,   0.1],
                [-0.08, -0.605,  0.046,  0.023,   0,   0.1],
                [ 0,    -0.606,  0.023,  0.023,   0,   0.1],
                [ 0.06, -0.605,  0.023,  0.046,   0,   0.1]
            ].map(([x0, y0, a, b, angle, gray]) => {
                const r = angle * Math.PI / 180;
                return { x0, y0, a, b, cosA: Math.cos(r), sinA: Math.sin(r), gray };
            });

            const half = size / 2;
            for (let j = 0; j < size; j++) {
                const y = (half - (j + 0.5)) / half;   // y axis points up
                for (let i = 0; i < size; i++) {
                    const x = ((i + 0.5) - half) / half;
                    let sum = 0;
                    for (const e of ellipses) {
                        const dx = x - e.x0, dy = y - e.y0;
                        const u = ( dx * e.cosA + dy * e.sinA) / e.a;
                        const v = (-dx * e.sinA + dy * e.cosA) / e.b;
                        if (u * u + v * v <= 1) sum += e.gray;
                    }
                    data[j * size + i] = Math.max(0, Math.min(255, sum * 255));
                }
            }
            return data;
        }

        function createGaussianData(size) {
            const data = new Float32Array(size * size);
            const half = size / 2, sigma = size / 8;
            for (let j = 0; j < size; j++) {
                const y = j + 0.5 - half;
                for (let i = 0; i < size; i++) {
                    const x = i + 0.5 - half;
                    data[j * size + i] = 255 * Math.exp(-(x * x + y * y) / (2 * sigma * sigma));
                }
            }
            return data;
        }

        function createSineWaveData(size) {
            const data = new Float32Array(size * size);
            const half = size / 2;
            const kx = 2 * Math.PI * 4 / size, ky = 2 * Math.PI * 6 / size;
            for (let j = 0; j < size; j++) {
                const y = j + 0.5 - half;
                for (let i = 0; i < size; i++) {
                    const x = i + 0.5 - half;
                    data[j * size + i] = (Math.sin(kx * x + ky * y) + 1) * 127.5;
                }
            }
            return data;
        }

        // --- Interactive Guides ---
        function handleSliderChange(t) {
            const theta = angleOf(t);
            const angleDeg = (t * 180 / NUM_ANGLES).toFixed(1);
            sweepValue.textContent = angleDeg;
            sweepValue2.textContent = angleDeg;

            drawProjectionProfile(t);

            sourceOverlayCtx.clearRect(0, 0, sourceOverlayCanvas.width, sourceOverlayCanvas.height);
            radonOverlayCtx.clearRect(0, 0, radonOverlayCanvas.width, radonOverlayCanvas.height);

            const cx = sourceOverlayCanvas.width / 2, cy = sourceOverlayCanvas.height / 2;
            const len = Math.max(sourceOverlayCanvas.width, sourceOverlayCanvas.height);
            const cos_t = Math.cos(theta), sin_t = Math.sin(theta);

            // Projection axis
            sourceOverlayCtx.strokeStyle = 'rgba(255, 0, 0, 0.8)';
            sourceOverlayCtx.lineWidth = 1.5;
            sourceOverlayCtx.setLineDash([]);
            sourceOverlayCtx.beginPath();
            sourceOverlayCtx.moveTo(cx, cy);
            sourceOverlayCtx.lineTo(cx + len * cos_t, cy - len * sin_t);
            sourceOverlayCtx.stroke();
            sourceOverlayCtx.setLineDash([5, 10]);
            sourceOverlayCtx.beginPath();
            sourceOverlayCtx.moveTo(cx, cy);
            sourceOverlayCtx.lineTo(cx - len * cos_t, cy + len * sin_t);
            sourceOverlayCtx.stroke();

            // Angle arc
            sourceOverlayCtx.strokeStyle = 'rgba(255, 165, 0, 0.9)';
            sourceOverlayCtx.lineWidth = 2;
            sourceOverlayCtx.setLineDash([]);
            sourceOverlayCtx.beginPath();
            sourceOverlayCtx.arc(cx, cy, 25, 0, -theta, true);
            sourceOverlayCtx.stroke();

            // Column t center on the sinogram
            const x_pos = t + 0.5;
            radonOverlayCtx.strokeStyle = 'rgba(255, 165, 0, 0.9)';
            radonOverlayCtx.lineWidth = 2;
            radonOverlayCtx.beginPath();
            radonOverlayCtx.moveTo(x_pos, 0);
            radonOverlayCtx.lineTo(x_pos, radonOverlayCanvas.height);
            radonOverlayCtx.stroke();

            const isInteractive = currentMode === 'function' && INTERACTIVE_MODES.includes(functionPresets.value);
            if (!isInteractive || randomPoints.length === 0) return;

            const colors = ['rgba(0, 255, 0, 0.9)', 'rgba(20, 150, 255, 0.9)'];
            randomPoints.forEach((point, index) => {
                const color = colors[index % colors.length];
                const rho = point.x * cos_t + point.y * sin_t;
                const px = cx + point.x, py = cy - point.y;
                const qx = cx + rho * cos_t, qy = cy - rho * sin_t;

                sourceOverlayCtx.strokeStyle = color;
                sourceOverlayCtx.lineWidth = 1.5;
                sourceOverlayCtx.setLineDash([3, 5]);
                sourceOverlayCtx.beginPath();
                sourceOverlayCtx.moveTo(px, py);
                sourceOverlayCtx.lineTo(qx, qy);
                sourceOverlayCtx.stroke();

                sourceOverlayCtx.setLineDash([]);
                sourceOverlayCtx.beginPath();
                sourceOverlayCtx.moveTo(cx, cy);
                sourceOverlayCtx.lineTo(qx, qy);
                sourceOverlayCtx.stroke();

                sourceOverlayCtx.fillStyle = color;
                sourceOverlayCtx.beginPath();
                sourceOverlayCtx.arc(qx, qy, 3, 0, 2 * Math.PI);
                sourceOverlayCtx.fill();

                // Same mapping as drawSinogram: bin r = rho + RHO_OFFSET, drawn at row NUM_RHO-1-r
                const y_rho_pos = RHO_OFFSET - rho - 0.5;
                radonOverlayCtx.strokeStyle = color;
                radonOverlayCtx.lineWidth = 1.5;
                radonOverlayCtx.beginPath();
                radonOverlayCtx.moveTo(0, y_rho_pos);
                radonOverlayCtx.lineTo(radonOverlayCanvas.width, y_rho_pos);
                radonOverlayCtx.stroke();

                radonOverlayCtx.fillStyle = color;
                radonOverlayCtx.beginPath();
                radonOverlayCtx.arc(x_pos, y_rho_pos, 4, 0, 2 * Math.PI);
                radonOverlayCtx.fill();
            });
        }
    </script>
