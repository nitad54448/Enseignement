<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1D & 2D Convolution Explorer</title>
    <link href="./dist/output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .canvas-wrapper {
            background-color: white;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            padding: 1rem;
            width: 100%;
        }
        canvas, video {
            width: 100%;
            height: auto;
            background-color: #f9fafb;
            border-radius: 0.5rem;
            border: 1px solid #e5e7eb;
            object-fit: cover;
        }
        #canvas-g-1d, #canvas-f-1d, #canvas-result-1d {
             height: 150px;
             aspect-ratio: auto;
        }
        #canvas-f-2d, #canvas-result-2d {
            aspect-ratio: 1 / 1;
        }
        /* Keep the small kernel preview independent of full-width image cards. */
        #kernel-controls-row {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 1rem;
        }
        #g-controls-2d {
            flex: 1 1 160px;
            min-width: 0;
        }
        #kernel-preview {
            box-sizing: border-box;
            flex: 0 0 112px;
            width: 112px;
            height: 112px;
            padding: 4px;
        }
        #canvas-g-2d {
            box-sizing: border-box;
            display: block;
            width: 100%;
            height: 100%;
        }
        select, input[type="range"], button {
            cursor: pointer;
        }
        .hidden {
            display: none !important;
        }
        #status {
            min-height: 1.25rem;
        }
        /* Style for active source buttons, inspired by FT.html */
        .active-btn {
            --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);
            --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(3px + var(--tw-ring-offset-width)) var(--tw-ring-color);
            box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
        }

        /* Language switch (flags) */
        .lang-switch { display: flex; gap: 6px; }
        .lang-btn { padding: 0; width: 34px; height: 24px; border: 2px solid transparent; border-radius: 4px; background: none;
                    cursor: pointer; opacity: 0.55; overflow: hidden; line-height: 0; box-shadow: 0 0 0 1px #cbd5e1;
                    transition: opacity 0.15s, border-color 0.15s; }
        .lang-btn:hover { opacity: 1; }
        .lang-btn[aria-pressed="true"] { opacity: 1; border-color: #3b82f6; }
        .lang-btn svg { width: 100%; height: 100%; display: block; }
        /* Notes */
        details.notes { border: 1px solid #e5e7eb; border-radius: 0.5rem; margin-bottom: 0.6rem; background: #f9fafb; }
        details.notes summary { cursor: pointer; padding: 0.6rem 0.9rem; font-weight: 600; color: #111827; }
        details.notes .body { padding: 0 0.9rem 0.8rem; font-size: 0.92rem; line-height: 1.6; color: #374151; }
        details.notes .body p { margin: 0.45rem 0; }
        details.notes .body ul { margin: 0.3rem 0 0.3rem 1.2rem; padding: 0; list-style: disc; }
        details.notes .body li { margin-bottom: 0.3rem; }
        details.notes .eq { font-family: ui-monospace, Menlo, Consolas, monospace; background: #111827; color: #6ee7b7;
                            border-radius: 0.375rem; padding: 0.45rem 0.7rem; margin: 0.45rem 0; overflow-x: auto; white-space: pre; }
    </style>
</head>
<body class="antialiased text-gray-800">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8 flex flex-col min-h-screen">

        <header id="main-header" class="bg-white p-4 rounded-lg shadow-md mb-6">

                                <rect width="60" height="30" fill="#012169"/>

                                <path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="2.5"/>
                                <path d="M30,0 V30 M0,15 H60" stroke="#ffffff" stroke-width="10"/>
                                <path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/>

                            </svg>

                </div>
            </div>

            <div id="controls-container" class="border-t pt-4">
                <!-- 1D CONTROLS -->
                <div id="controls-1d" class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">
                    <div class="space-y-3">
                        <h3 class="text-lg font-semibold" data-i18n="hdrF1d">Function f(x)</h3>
                        <div id="f-controls-1d">
                            <!-- 1D f(x) controls will be populated by JS -->
                        </div>

                    <div class="space-y-3">
                        <h3 class="text-lg font-semibold" data-i18n="hdrG1d">Function g(x)</h3>
                        <div id="g-controls-1d">
                             <!-- 1D g(x) controls will be populated by JS -->
                        </div>
                    </div>
                </div>

                <!-- 2D CONTROLS -->
                <div id="controls-2d" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8">
                     <div class="space-y-3">
                        <h3 class="text-lg font-semibold" data-i18n="hdrF2d">Source Image f(x,y)</h3>
                        <div id="f-controls-2d">
                             <!-- 2D f(x,y) controls are populated by JS -->
                        </div>
                    </div>
                    <div class="space-y-3">
                        <h3 class="text-lg font-semibold" data-i18n="hdrG2d">Kernel g(x,y)</h3>
                        <div id="kernel-controls-row" class="flex items-start gap-4">
                            <div class="flex-1 space-y-3" id="g-controls-2d">
                                <!-- 2D g(x,y) controls are here -->
                            </div>

                                 <canvas id="canvas-g-2d" width="100" height="100"></canvas>

            </div>
        </header>

        <main id="main-content" class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Canvases will be dynamically added here -->
        </main>
        
        <section class="bg-white p-4 rounded-lg shadow-md mt-6">
            <h2 class="text-lg font-semibold mb-3" data-i18n="notesTitle">Notes</h2>
            <div id="notes-box"></div>
        </section>

        <footer class="text-center mt-8 text-sm text-gray-500">
            <p data-i18n="footer1">Convolution is calculated using discrete summation. For 2D, it's applied to image pixels.</p>
            <p class="mt-1" data-i18n="footer2">Built for educational purposes. NitaD, Univ. Paris-Saclay, 28 July 2025</p>
        </footer>
    </div>

    <script>
    // --- LANGUAGE (EN / FR): static text carries data-i18n="key"; generated text calls t(key) ---
    const I18N = {
        en: {
            title: '1D & 2D Convolution Explorer', h1: 'Convolution Explorer', mode: 'Mode:', mode1d: '1D Convolution', mode2d: '2D Convolution',
            hdrF1d: 'Function f(x)', hdrG1d: 'Function g(x)', hdrF2d: 'Source Image f(x,y)', hdrG2d: 'Kernel g(x,y)',
            footer1: 'Convolution is calculated using discrete summation. For 2D, it is applied to image pixels.',
            footer2: 'Built for educational purposes. NitaD, Univ. Paris-Saclay, 28 July 2025',
            notesTitle: 'Notes',
            type: 'Type', kernelType: 'Kernel Type',
            fTypes: { 'dirac-comb': 'Dirac Comb', 'single-gaussian': 'Single Peak', 'square-pulse': 'Square Pulse', 'two-peaks': 'Two Peaks' },
            gTypes: { 'gaussian': 'Gaussian', 'lorentzian': 'Lorentzian', 'triangle': 'Triangle', 'exp-decay': 'Asymmetric Decay' },
            lSpacing: 'Spacing', lWidthStd: 'Width (Std Dev)', lWidth: 'Width', lPeakWidth: 'Peak Width', lPeak1: 'Peak 1 Pos', lPeak2: 'Peak 2 Pos',
            lFwhm: 'FWHM', lBase: 'Base Width', lDecay: 'Decay Rate', lSigma: 'Sigma', lStrength: 'Strength', lSize: 'Size',
            upload: 'Upload Image', webcam: 'Use Webcam', orPreset: 'Or select a preset',
            presets: { grid: 'Grid Pattern', circle: 'Circle Pattern', checkerboard: 'Checkerboard' },
            kernels: { 'gaussian-blur': 'Gaussian Blur', 'sharpen': 'Sharpen', 'box-blur': 'Box Blur', 'edge-detect-h': 'Edge Detect (H)', 'edge-detect-v': 'Edge Detect (V)', 'identity': 'Identity (None)' },
            titleF1d: 'f(x) & g(x)', titleResult1d: 'Result: (f * g)(x)', titleF2d: 'Source f(x,y)', titleResult2d: 'Result: (f * g)(x,y)',
            stSelect: 'Select a source to begin.', stProcessing: 'Processing...', stDone: 'Convolution complete.', stError: 'Error processing convolution.',
            stLoadFail: 'Failed to load sample image.', stRequesting: 'Requesting webcam access...', stWebcam: 'Webcam active.',
            notes: `
                <details class="notes" open><summary>What is a convolution?</summary><div class="body">
                    <p>The convolution of f by g replaces each point of f by a copy of g, scaled by the value of f there, and adds all the copies. Equivalently: <b>flip g, slide it along f, multiply and sum</b>.</p>
                    <div class="eq">(f &lowast; g)(x) = &int; f(x') g(x &minus; x') dx'        discrete: &Sigma;<sub>k</sub> f[k]&middot;g[i &minus; k]</div>
                    <p>In diffraction, the observed pattern of a crystal is the lattice convolved with the motif; in spectroscopy, a measured line is the true line convolved with the instrument response.</p>
                </div></details>
                <details class="notes"><summary>1D examples</summary><div class="body"><ul>
                    <li><b>Dirac comb &lowast; any function:</b> the function is repeated at every tooth of the comb (a crystal: lattice &lowast; motif).</li>
                    <li><b>Peak &lowast; Gaussian or Lorentzian:</b> the peak is broadened; the area is multiplied by the area of g, so the plots are not on the same scale (g is not normalised to unit area).</li>
                    <li><b>Gaussian &lowast; Gaussian:</b> still a Gaussian, with &sigma;&sup2; = &sigma;<sub>1</sub>&sup2; + &sigma;<sub>2</sub>&sup2;. Try two peaks that merge when g widens.</li>
                    <li><b>Asymmetric decay:</b> the result is delayed and smeared to the right, like a detector with a response time.</li>
                    <li>At the edges, the signal is assumed to be zero outside the window.</li>
                </ul></div></details>
                <details class="notes"><summary>2D kernels</summary><div class="body"><ul>
                    <li><b>Blur (Gaussian, box):</b> each pixel becomes a weighted average of its neighbours: a low-pass filter. The weights sum to 1, so the mean brightness is unchanged.</li>
                    <li><b>Sharpen:</b> identity plus a Laplacian, which enhances differences between a pixel and its neighbours (weights still sum to 1).</li>
                    <li><b>Edge detection (Sobel):</b> a derivative along one direction. The weights sum to 0, so a flat area gives 0; the result is shown on a mid-grey background (128), with brighter and darker values for the two edge polarities.</li>
                    <li>Gaussian and box blurs are separable: they are computed as one horizontal then one vertical pass, which gives the same result much faster.</li>
                </ul></div></details>
                <details class="notes"><summary>Convolution theorem</summary><div class="body">
                    <div class="eq">FT(f &lowast; g) = FT(f) &middot; FT(g)</div>
                    <p>A convolution in real space is a product in Fourier space. A blur multiplies the spectrum by a low-pass function (the Fourier transform of a Gaussian is a Gaussian, of width 1/&sigma;). Compare with the <i>FT</i> page: the transform of a lattice convolved with a motif is the reciprocal lattice multiplied by the motif's form factor.</p>
                </div></details>`
        },
        fr: {
            title: 'Explorateur de convolution 1D et 2D', h1: 'Explorateur de convolution', mode: 'Mode :', mode1d: 'Convolution 1D', mode2d: 'Convolution 2D',
            hdrF1d: 'Fonction f(x)', hdrG1d: 'Fonction g(x)', hdrF2d: 'Image source f(x,y)', hdrG2d: 'Noyau g(x,y)',
            footer1: 'La convolution est calculée par sommation discrète. En 2D, elle s\'applique aux pixels de l\'image.',
            footer2: 'Outil pédagogique. NitaD, Univ. Paris-Saclay, 28 juillet 2025',
            notesTitle: 'Notes',
            type: 'Type', kernelType: 'Type de noyau',
            fTypes: { 'dirac-comb': 'Peigne de Dirac', 'single-gaussian': 'Pic unique', 'square-pulse': 'Impulsion carrée', 'two-peaks': 'Deux pics' },
            gTypes: { 'gaussian': 'Gaussienne', 'lorentzian': 'Lorentzienne', 'triangle': 'Triangle', 'exp-decay': 'Décroissance asymétrique' },
            lSpacing: 'Espacement', lWidthStd: 'Largeur (écart-type)', lWidth: 'Largeur', lPeakWidth: 'Largeur des pics', lPeak1: 'Position du pic 1', lPeak2: 'Position du pic 2',
            lFwhm: 'Largeur à mi-hauteur', lBase: 'Largeur de la base', lDecay: 'Taux de décroissance', lSigma: 'Sigma', lStrength: 'Intensité', lSize: 'Taille',
            upload: 'Charger une image', webcam: 'Utiliser la webcam', orPreset: 'Ou choisir un exemple',
            presets: { grid: 'Grille', circle: 'Cercle', checkerboard: 'Damier' },
            kernels: { 'gaussian-blur': 'Flou gaussien', 'sharpen': 'Accentuation', 'box-blur': 'Flou moyenneur', 'edge-detect-h': 'Détection de contours (H)', 'edge-detect-v': 'Détection de contours (V)', 'identity': 'Identité (aucun)' },
            titleF1d: 'f(x) et g(x)', titleResult1d: 'Résultat : (f * g)(x)', titleF2d: 'Source f(x,y)', titleResult2d: 'Résultat : (f * g)(x,y)',
            stSelect: 'Choisissez une source pour commencer.', stProcessing: 'Calcul en cours…', stDone: 'Convolution terminée.', stError: 'Erreur de calcul de la convolution.',
            stLoadFail: 'Échec du chargement de l\'image.', stRequesting: 'Demande d\'accès à la webcam…', stWebcam: 'Webcam active.',
            notes: `
                <details class="notes" open><summary>Qu'est-ce qu'une convolution ?</summary><div class="body">
                    <p>La convolution de f par g remplace chaque point de f par une copie de g, multipliée par la valeur de f en ce point, et additionne toutes les copies. De fa&ccedil;on &eacute;quivalente : <b>retourner g, la faire glisser le long de f, multiplier et sommer</b>.</p>
                    <div class="eq">(f &lowast; g)(x) = &int; f(x') g(x &minus; x') dx'        discret : &Sigma;<sub>k</sub> f[k]&middot;g[i &minus; k]</div>
                    <p>En diffraction, la figure observ&eacute;e pour un cristal est le r&eacute;seau convolu&eacute; par le motif ; en spectroscopie, une raie mesur&eacute;e est la raie vraie convolu&eacute;e par la r&eacute;ponse de l'instrument.</p>
                </div></details>
                <details class="notes"><summary>Exemples 1D</summary><div class="body"><ul>
                    <li><b>Peigne de Dirac &lowast; fonction :</b> la fonction est r&eacute;p&eacute;t&eacute;e &agrave; chaque dent du peigne (un cristal : r&eacute;seau &lowast; motif).</li>
                    <li><b>Pic &lowast; gaussienne ou lorentzienne :</b> le pic s'&eacute;largit ; l'aire est multipli&eacute;e par celle de g, donc les trac&eacute;s ne sont pas &agrave; la m&ecirc;me &eacute;chelle (g n'est pas normalis&eacute;e &agrave; une aire unit&eacute;).</li>
                    <li><b>Gaussienne &lowast; gaussienne :</b> encore une gaussienne, avec &sigma;&sup2; = &sigma;<sub>1</sub>&sup2; + &sigma;<sub>2</sub>&sup2;. Essayez deux pics qui fusionnent quand g s'&eacute;largit.</li>
                    <li><b>D&eacute;croissance asym&eacute;trique :</b> le r&eacute;sultat est retard&eacute; et &eacute;tal&eacute; vers la droite, comme un d&eacute;tecteur &agrave; temps de r&eacute;ponse.</li>
                    <li>Aux bords, le signal est suppos&eacute; nul en dehors de la fen&ecirc;tre.</li>
                </ul></div></details>
                <details class="notes"><summary>Noyaux 2D</summary><div class="body"><ul>
                    <li><b>Flou (gaussien, moyenneur) :</b> chaque pixel devient une moyenne pond&eacute;r&eacute;e de ses voisins : un filtre passe-bas. Les poids somment &agrave; 1, la luminosit&eacute; moyenne est conserv&eacute;e.</li>
                    <li><b>Accentuation :</b> identit&eacute; plus un laplacien, qui renforce les diff&eacute;rences entre un pixel et ses voisins (poids de somme 1).</li>
                    <li><b>D&eacute;tection de contours (Sobel) :</b> une d&eacute;riv&eacute;e selon une direction. Les poids somment &agrave; 0, une zone uniforme donne 0 ; le r&eacute;sultat est affich&eacute; sur un fond gris moyen (128), plus clair ou plus sombre selon le sens du contour.</li>
                    <li>Les flous gaussien et moyenneur sont s&eacute;parables : ils sont calcul&eacute;s par un passage horizontal puis un passage vertical, ce qui donne le m&ecirc;me r&eacute;sultat bien plus vite.</li>
                </ul></div></details>
                <details class="notes"><summary>Th&eacute;or&egrave;me de convolution</summary><div class="body">
                    <div class="eq">TF(f &lowast; g) = TF(f) &middot; TF(g)</div>
                    <p>Une convolution dans l'espace r&eacute;el est un produit dans l'espace de Fourier. Un flou multiplie le spectre par une fonction passe-bas (la transform&eacute;e de Fourier d'une gaussienne est une gaussienne, de largeur 1/&sigma;). Comparez avec la page <i>FT</i> : la transform&eacute;e d'un r&eacute;seau convolu&eacute; par un motif est le r&eacute;seau r&eacute;ciproque multipli&eacute; par le facteur de forme du motif.</p>
                </div></details>`
        }
    };
    let lang = 'en';
    try {
        const saved = localStorage.getItem('convolutions-lang');
        if (saved === 'fr' || saved === 'en') lang = saved;
        else if ((navigator.language || '').toLowerCase().startsWith('fr')) lang = 'fr';
    } catch (e) { /* storage unavailable: keep the default */ }
    const t = key => (I18N[lang] && I18N[lang][key] !== undefined) ? I18N[lang][key] : I18N.en[key];

    // --- DOM Elements ---
    const mainHeader = document.getElementById('main-header');
    const controls1D = document.getElementById('controls-1d');
    const controls2D = document.getElementById('controls-2d');
    const mainContent = document.getElementById('main-content');
    let statusEl; // Will be assigned after it's created in 2D mode

    // --- Canvas References (will be created dynamically) ---
    let canvasF, canvasG, canvasResult, webcamVideo;
    let ctxF, ctxG, ctxResult;

    // --- State & Constants ---
    let MODE = '1D';
    const SIZE_1D = 512;
    const SIZE_2D = 400;
    let webcamStream = null;
    let animationFrameId = null;
    let webcamRequestId = 0;
    let webcamRequestPending = false;
    let imageLoadId = 0;
    let uploadedImage = null;
    let activeSourceButton = null; // To track the active 2D source button

    const params = {
        '1D': { 
            // One width per function type: the sliders have different ranges, so sharing one value desynchronised them.
            f: { type: 'dirac-comb', spacing: 50, widthSg: 20, widthSp: 20, widthTp: 20, height: 1.0, pos1: 180, pos2: 320 }, 
            g: { type: 'gaussian', width: 20, widthTri: 20, fwhm: 30, decay: 50 } 
        },
        '2D': { 
            f: { source: 'grid' }, 
            g: { type: 'gaussian-blur', sigma: 1.4, strength: 1, size: 3 } 
        }
    };
    
    // --- SAMPLE IMAGE GENERATORS ---
    const SAMPLE_IMAGES = {
        'grid': createGridPattern(),
        'circle': createCirclePattern(),
        'checkerboard': createCheckerboardPattern()
    };

    function createGridPattern() {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 200;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, 200, 200);
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 2;
        for (let i = 0; i <= 200; i += 20) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 200); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(200, i); ctx.stroke();
        }
        return canvas.toDataURL();
    }

    function createCirclePattern() {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 200;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, 200, 200);
        ctx.fillStyle = 'black';
        ctx.beginPath();
        ctx.arc(100, 100, 60, 0, 2 * Math.PI);
        ctx.fill();
        return canvas.toDataURL();
    }

    function createCheckerboardPattern() {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 200;
        const ctx = canvas.getContext('2d');
        const squareSize = 25;
        for (let x = 0; x < 200; x += squareSize) {
            for (let y = 0; y < 200; y += squareSize) {
                const isBlack = ((x / squareSize) + (y / squareSize)) % 2 === 0;
                ctx.fillStyle = isBlack ? 'black' : 'white';
                ctx.fillRect(x, y, squareSize, squareSize);
            }
        }
        return canvas.toDataURL();
    }

    // --- CORE ALGORITHMS ---
    function convolve1D(signal, kernel) { 
        const signalLen = signal.length; 
        const kernelLen = kernel.length; 
        const result = new Array(signalLen).fill(0); 
        const kernelCenter = Math.floor(kernelLen / 2); 
        for (let i = 0; i < signalLen; i++) { 
            let sum = 0; 
            for (let j = 0; j < kernelLen; j++) { 
                const signalIndex = i - j + kernelCenter; 
                if (signalIndex >= 0 && signalIndex < signalLen) { 
                    sum += signal[signalIndex] * kernel[j]; 
                } 
            } 
            result[i] = sum; 
        } 
        return result; 
    }

    function convolve2D(sourceData, width, height, kernel) { 
        const src = sourceData.data; 
        const resultData = new Uint8ClampedArray(src.length); 
        const kernelSize = kernel.length; 
        const halfKernel = Math.floor(kernelSize / 2); 
        let kernelSum = 0;
        for (let i = 0; i < kernelSize; i++) {
            for (let j = 0; j < kernelSize; j++) {
                kernelSum += kernel[i][j];
            }
        }
        // A zero-sum kernel (edge detection) gives positive and negative responses: show them around mid-grey.
        const offset = (kernelSum === 0) ? 128 : 0;
        if (kernelSum === 0) kernelSum = 1;
        for (let y = 0; y < height; y++) { 
            for (let x = 0; x < width; x++) { 
                let r = 0, g = 0, b = 0; 
                for (let ky = 0; ky < kernelSize; ky++) { 
                    for (let kx = 0; kx < kernelSize; kx++) { 
                        const sy = y - ky + halfKernel; 
                        const sx = x - kx + halfKernel; 
                        if (sy >= 0 && sy < height && sx >= 0 && sx < width) { 
                            const i = (sy * width + sx) * 4; 
                            const weight = kernel[ky][kx]; 
                            r += src[i] * weight; 
                            g += src[i + 1] * weight; 
                            b += src[i + 2] * weight; 
                        } 
                    } 
                } 
                const outIndex = (y * width + x) * 4; 
                resultData[outIndex] = Math.max(0, Math.min(255, offset + r / kernelSum)); 
                resultData[outIndex + 1] = Math.max(0, Math.min(255, offset + g / kernelSum)); 
                resultData[outIndex + 2] = Math.max(0, Math.min(255, offset + b / kernelSum)); 
                resultData[outIndex + 3] = 255; 
            } 
        } 
        return new ImageData(resultData, width, height); 
    }

    // Separable kernels (Gaussian, box): the 2D kernel is the outer product of a 1D kernel with itself,
    // so one horizontal and one vertical pass give exactly the same result as the full 2D sum
    // (with zero padding) at a cost of 2k instead of k² per pixel and channel.
    function separableKernel1D(type, p) {
        if (type === 'gaussian-blur') {
            const size = Math.max(3, Math.ceil(p.sigma * 6) | 1), c = Math.floor(size / 2);
            const k = Array.from({ length: size }, (_, x) => Math.exp(-((x - c) ** 2) / (2 * p.sigma * p.sigma)));
            const sum = k.reduce((a, b) => a + b, 0);
            return k.map(v => v / sum);
        }
        if (type === 'box-blur') {
            const s = p.size % 2 === 0 ? p.size + 1 : p.size;
            return Array(s).fill(1 / s);
        }
        return null;
    }

    function convolve2DSeparable(sourceData, width, height, k) {
        const src = sourceData.data, half = k.length >> 1;
        const tmp = new Float32Array(src.length), out = new Uint8ClampedArray(src.length);
        for (let y = 0; y < height; y++) {            // horizontal pass
            for (let x = 0; x < width; x++) {
                for (let ch = 0; ch < 3; ch++) {
                    let sum = 0;
                    for (let j = 0; j < k.length; j++) {
                        const sx = x - j + half;
                        if (sx >= 0 && sx < width) sum += src[(y * width + sx) * 4 + ch] * k[j];
                    }
                    tmp[(y * width + x) * 4 + ch] = sum;
                }
            }
        }
        for (let y = 0; y < height; y++) {            // vertical pass
            for (let x = 0; x < width; x++) {
                const o = (y * width + x) * 4;
                for (let ch = 0; ch < 3; ch++) {
                    let sum = 0;
                    for (let j = 0; j < k.length; j++) {
                        const sy = y - j + half;
                        if (sy >= 0 && sy < height) sum += tmp[(sy * width + x) * 4 + ch] * k[j];
                    }
                    out[o + ch] = sum;                 // Uint8ClampedArray rounds and clamps
                }
                out[o + 3] = 255;
            }
        }
        return new ImageData(out, width, height);
    }

    // --- FUNCTION/DATA GENERATORS ---
    function create1DFunction(type, size, p) { 
        const data = new Array(size).fill(0); 
        switch (type) { 
            case 'dirac-comb': 
                for (let i = p.spacing; i < size; i += p.spacing) { if (i < size) data[i] = p.height; } break; 
            case 'single-gaussian': 
                const c = size / 2; 
                for (let i = 0; i < size; i++) { data[i] = p.height * Math.exp(-0.5 * Math.pow((i - c) / p.widthSg, 2)); } break; 
            case 'square-pulse': 
                const s = Math.floor(size / 2 - p.widthSp / 2); 
                for (let i = s; i < s + p.widthSp && i < size; i++) { if (i >= 0) data[i] = p.height; } break; 
            case 'two-peaks': 
                for (let i = 0; i < size; i++) { data[i] = p.height * Math.exp(-0.5 * Math.pow((i - p.pos1) / p.widthTp, 2)) + p.height * 0.8 * Math.exp(-0.5 * Math.pow((i - p.pos2) / p.widthTp, 2)); } break; 
            case 'gaussian': 
                for (let i = 0; i < size; i++) { data[i] = Math.exp(-0.5 * Math.pow((i - size / 2) / p.width, 2)); } break; 
            case 'lorentzian': 
                for (let i = 0; i < size; i++) { data[i] = 1 / (1 + Math.pow((i - size / 2) / (p.fwhm / 2), 2)); } break; 
            case 'triangle': 
                const hw = p.widthTri / 2; 
                for (let i = 0; i < size; i++) { const d = Math.abs(i - size / 2); if (d < hw) data[i] = 1.0 - d / hw; } break; 
            case 'exp-decay': 
                for (let i = Math.floor(size/2); i < size; i++) { data[i] = Math.exp(-(i - size/2) / p.decay); } break; 
        } 
        return data; 
    }

    function generate2DKernel(type, p) { 
        switch(type) { 
            case 'gaussian-blur': 
                const size = Math.max(3, Math.ceil(p.sigma * 6) | 1);
                const kernel = Array(size).fill(0).map(() => Array(size).fill(0)); 
                const center = Math.floor(size / 2); 
                let sum = 0;
                for (let y = 0; y < size; y++) { 
                    for (let x = 0; x < size; x++) { 
                        const distSq = Math.pow(x - center, 2) + Math.pow(y - center, 2); 
                        const value = Math.exp(-distSq / (2 * p.sigma * p.sigma)); 
                        kernel[y][x] = value; sum += value;
                    } 
                }
                for (let y = 0; y < size; y++) { for (let x = 0; x < size; x++) { kernel[y][x] /= sum; } } return kernel; 
            case 'sharpen': 
                const centerVal = 1 + 4 * p.strength; return [[0, -p.strength, 0], [-p.strength, centerVal, -p.strength], [0, -p.strength, 0]]; 
            case 'box-blur': 
                const s = p.size % 2 === 0 ? p.size + 1 : p.size; return Array(s).fill(0).map(() => Array(s).fill(1 / (s * s))); 
            case 'edge-detect-h': return [[1,2,1],[0,0,0],[-1,-2,-1]]; 
            case 'edge-detect-v': return [[1,0,-1],[2,0,-2],[1,0,-1]]; 
            case 'identity': default: return [[0,0,0],[0,1,0],[0,0,0]]; 
        } 
    }

    // --- DRAWING ---
    function draw1DFunction(ctx, data, color) { 
        const w = ctx.canvas.width, h = ctx.canvas.height; 
        ctx.clearRect(0, 0, w, h); 
        if (!data || data.length === 0) return;
        const maxVal = Math.max(...data, 1.0); 
        ctx.strokeStyle = '#d1d5db'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, h - 20); ctx.lineTo(w, h - 20); ctx.stroke(); 
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath(); 
        const startY = h - 20 - (data[0] / maxVal) * (h - 40);
        ctx.moveTo(0, startY); 
        for (let i = 1; i < data.length; i++) { 
            const x = (i / (data.length - 1)) * w; 
            const y = h - 20 - (data[i] / maxVal) * (h - 40); 
            ctx.lineTo(x, y); 
        } 
        ctx.stroke(); 
    }

    function draw2DKernel(ctx, kernel) { 
        const w = ctx.canvas.width, h = ctx.canvas.height; 
        ctx.clearRect(0, 0, w, h); 
        if (!kernel || kernel.length === 0) return;
        const s = kernel.length;
        const cellSize = Math.min(w, h) / s; 
        const flat = kernel.flat();
        const min = Math.min(...flat);
        const max = Math.max(...flat); 
        for (let y = 0; y < s; y++) { 
            for (let x = 0; x < s; x++) { 
                const val = kernel[y][x]; 
                const norm = (max > min) ? (val - min) / (max - min) : 0.5; 
                const cVal = Math.floor(norm * 255); 
                ctx.fillStyle = `rgb(${cVal}, ${cVal}, ${cVal})`; 
                ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize); 
                ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 0.5;
                ctx.strokeRect(x * cellSize, y * cellSize, cellSize, cellSize); 
                if (cellSize > 15) {
                    ctx.fillStyle = (norm > 0.5) ? 'black' : 'white'; 
                    ctx.font = `${Math.min(10, cellSize * 0.3)}px Inter`; 
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; 
                    ctx.fillText(val.toFixed(2), x * cellSize + cellSize / 2, y * cellSize + cellSize / 2); 
                }
            } 
        } 
    }

    function drawSourceToCanvasCover(source, canvas, context) { 
        const w = canvas.width, h = canvas.height; 
        const sW = source.videoWidth || source.width || source.naturalWidth;
        const sH = source.videoHeight || source.height || source.naturalHeight; 
        if (!sW || !sH) return;
        const canvasAspect = w / h;
        const sourceAspect = sW / sH; 
        let sx, sy, sw, sh; 
        if (sourceAspect > canvasAspect) { 
            sw = sH * canvasAspect; sh = sH; sx = (sW - sw) / 2; sy = 0; 
        } else { 
            sw = sW; sh = sW / canvasAspect; sx = 0; sy = (sH - sh) / 2; 
        } 
        context.drawImage(source, sx, sy, sw, sh, 0, 0, w, h); 
    }

        return `<div><label for="${id}" class="block text-sm font-medium text-gray-700">${label}: <span id="${id}-value" class="font-bold">${value}</span></label><input type="range" id="${id}" min="${min}" max="${max}" value="${value}" step="${step}" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"></div>`;
    }

    function getSelectHTML(id, label, options, selected) { 
        let opts = Object.entries(options).map(([v, t]) => `<option value="${v}" ${v === selected ? 'selected' : ''}>${t}</option>`).join(''); 
        return `<div><label for="${id}" class="block text-sm font-medium text-gray-700">${label}</label><select id="${id}" class="mt-1 block w-full text-sm rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50">${opts}</select></div>`;
    }

    function populateControls() {
        // 1D

        gControls1D.innerHTML = getSelectHTML('g-type-1d', t('type'), t('gTypes'), params['1D'].g.type) + `<div id="g-sliders-1d" class="space-y-2 mt-2"></div>`;
        update1DParamSliders();

        // 2D
        const fControls2D = document.getElementById('f-controls-2d');

        fControls2D.innerHTML = `
            <div class="flex items-center gap-4 flex-wrap mb-3">
                <div class="flex items-center gap-2">
                    <button id="use-upload-btn" class="bg-blue-500 text-white px-3 py-1.5 text-sm rounded-md hover:bg-blue-600 focus:outline-none ring-blue-500 ring-offset-2 transition-all duration-200">
                        ${t('upload')}
                    </button>
                    <button id="use-webcam-btn" class="bg-green-500 text-white px-3 py-1.5 text-sm rounded-md hover:bg-green-600 focus:outline-none ring-green-500 ring-offset-2 transition-all duration-200">
                        ${t('webcam')}
                    </button>
                </div>
                <div id="status" class="text-sm text-gray-600 font-medium"></div>
            </div>
            <div>
                <label for="preset-select-2d" class="block text-sm font-medium text-gray-700">${t('orPreset')}</label>
                <select id="preset-select-2d" class="mt-1 block w-full text-sm rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50">
                    ${Object.entries(t('presets')).map(([v, txt]) => `<option value="${v}">${txt}</option>`).join('')}
                </select>
            </div>
        `;

        gControls2D.innerHTML = getSelectHTML('g-type-2d', t('kernelType'), t('kernels'), params['2D'].g.type) + `<div id="g-sliders-2d" class="space-y-2 mt-2"></div>`;

        update2DKernelSliders();
    }

    // Buttons and preset list of the 2D source panel (rebuilt with populateControls)
    function bind2DSourceControls() {
        const fileInput = document.getElementById('image-upload-actual');
        document.getElementById('use-upload-btn').addEventListener('click', () => fileInput.click());
        document.getElementById('use-webcam-btn').addEventListener('click', () => {
            params['2D'].f.source = 'webcam';
            startWebcam();
        });
        document.getElementById('preset-select-2d').addEventListener('change', (e) => loadPreset(e.target.value));
    }

    // Rebuild every generated control (language change), keeping the current state.
    function rebuildControls() {
        populateControls();
        if (MODE !== '2D') return;
        statusEl = document.getElementById('status');
        bind2DSourceControls();
        const source = params['2D'].f.source;
        const select = document.getElementById('preset-select-2d');
        select.value = Object.prototype.hasOwnProperty.call(SAMPLE_IMAGES, source) ? source : '';
        updateActiveButton(source === 'upload' && uploadedImage ? document.getElementById('use-upload-btn')
                         : source === 'webcam' && webcamStream ? document.getElementById('use-webcam-btn') : null);
        updateAndDraw();
    }

    function update1DParamSliders() {
        const fSliderContainer = document.getElementById('f-sliders-1d');
        const gSliderContainer = document.getElementById('g-sliders-1d');
        let fHtml = '', gHtml = '';
        const p1D = params['1D'];
        switch (p1D.f.type) {
            case 'dirac-comb': fHtml += getSliderHTML('f-spacing', t('lSpacing'), 10, 100, p1D.f.spacing, 1); break;
            case 'single-gaussian': fHtml += getSliderHTML('f-width-sg', t('lWidthStd'), 5, 50, p1D.f.widthSg, 1); break;
            case 'square-pulse': fHtml += getSliderHTML('f-width-sp', t('lWidth'), 10, 200, p1D.f.widthSp, 1); break;
            case 'two-peaks': fHtml += getSliderHTML('f-width-tp', t('lPeakWidth'), 5, 40, p1D.f.widthTp, 1) + getSliderHTML('f-pos1', t('lPeak1'), 50, 250, p1D.f.pos1, 1) + getSliderHTML('f-pos2', t('lPeak2'), 260, 460, p1D.f.pos2, 1); break;
        }
        switch (p1D.g.type) {
            case 'gaussian': gHtml += getSliderHTML('g-width', t('lWidthStd'), 1, 50, p1D.g.width, 1); break;
            case 'lorentzian': gHtml += getSliderHTML('g-fwhm', t('lFwhm'), 2, 100, p1D.g.fwhm, 1); break;
            case 'triangle': gHtml += getSliderHTML('g-width-tri', t('lBase'), 2, 150, p1D.g.widthTri, 1); break;
            case 'exp-decay': gHtml += getSliderHTML('g-decay', t('lDecay'), 5, 100, p1D.g.decay, 1); break;
        }
        fSliderContainer.innerHTML = fHtml;
        gSliderContainer.innerHTML = gHtml;
    }

    function update2DKernelSliders() {
        const gSliderContainer = document.getElementById('g-sliders-2d');
        let gHtml = '';
        const p2D = params['2D'];
        switch (p2D.g.type) {
            case 'gaussian-blur': gHtml += getSliderHTML('g-sigma-2d', t('lSigma'), 0.1, 5, p2D.g.sigma, 0.1); break;
            case 'sharpen': gHtml += getSliderHTML('g-strength-2d', t('lStrength'), 0.1, 3, p2D.g.strength, 0.1); break;
            case 'box-blur': gHtml += getSliderHTML('g-size-2d', t('lSize'), 3, 15, p2D.g.size, 2); break;
        }
        gSliderContainer.innerHTML = gHtml;
    }

    function updateAndDraw() {
        if (!ctxF) return;
        if (MODE === '1D') {
            const fData = create1DFunction(params['1D'].f.type, SIZE_1D, params['1D'].f);
            const gData = create1DFunction(params['1D'].g.type, Math.floor(SIZE_1D / 2), params['1D'].g);
            const resultData = convolve1D(fData, gData);
            draw1DFunction(ctxF, fData, '#3b82f6');
            const gPadded = new Array(SIZE_1D).fill(0);
            const startIdx = Math.floor((SIZE_1D - gData.length) / 2);
            for (let i = 0; i < gData.length; i++) { if (startIdx + i < SIZE_1D) gPadded[startIdx + i] = gData[i]; }
            draw1DFunction(ctxG, gPadded, '#ef4444');
            draw1DFunction(ctxResult, resultData, '#10b981');
        } else {
            statusEl.textContent = t('stProcessing');
            try {
                const kernel = generate2DKernel(params['2D'].g.type, params['2D'].g);
                draw2DKernel(document.getElementById('canvas-g-2d').getContext('2d'), kernel);
                const sourceData = ctxF.getImageData(0, 0, canvasF.width, canvasF.height);
                const sep = separableKernel1D(params['2D'].g.type, params['2D'].g);   // fast path for blurs
                const resultImageData = sep
                    ? convolve2DSeparable(sourceData, canvasF.width, canvasF.height, sep)
                    : convolve2D(sourceData, canvasF.width, canvasF.height, kernel);
                ctxResult.putImageData(resultImageData, 0, 0);
                statusEl.textContent = t('stDone');
            } catch (error) {
                console.error('Error in 2D convolution:', error);
                statusEl.textContent = t('stError');
            }
        }
    }

    // --- EVENT LISTENERS (DELEGATION) ---
    function handleHeaderChange(e) {
        const t = e.target;
        if (!t.id) return;
        const id = t.id, v = t.type === 'range' ? parseFloat(t.value) : t.value;
        const vs = document.getElementById(`${id}-value`);
        if(vs) { vs.textContent = (t.step && String(t.step).includes('.')) ? parseFloat(v).toFixed(1) : v; }
        const p1D = params['1D'], p2D = params['2D'];
        switch(id) {
            case 'mode-select': if (v !== MODE) setupMode(v); return;
            case 'f-type-1d': p1D.f.type = v; update1DParamSliders(); break;
            case 'g-type-1d': p1D.g.type = v; update1DParamSliders(); break;
            case 'f-spacing': p1D.f.spacing = v; break;
            case 'f-width-sg': p1D.f.widthSg = v; break;
            case 'f-width-sp': p1D.f.widthSp = v; break;
            case 'f-width-tp': p1D.f.widthTp = v; break;
            case 'f-pos1': p1D.f.pos1 = v; break;
            case 'f-pos2': p1D.f.pos2 = v; break;
            case 'g-width': p1D.g.width = v; break;
            case 'g-fwhm': p1D.g.fwhm = v; break;
            case 'g-width-tri': p1D.g.widthTri = v; break;
            case 'g-decay': p1D.g.decay = v; break;
            case 'g-type-2d': p2D.g.type = v; update2DKernelSliders(); break;
            case 'g-sigma-2d': p2D.g.sigma = v; break;
            case 'g-strength-2d': p2D.g.strength = v; break;
            case 'g-size-2d': p2D.g.size = v; break;
        }
        updateAndDraw();
    }
    
    // --- DYNAMIC LAYOUT & MODE SWITCHING ---
    function buildLayout() {
        mainContent.innerHTML = '';
        if (MODE === '1D') {
            mainContent.className = 'flex-grow grid grid-cols-1 lg:grid-cols-2 gap-6';
            mainContent.innerHTML = `<div class="canvas-wrapper"><h2 class="text-xl font-semibold text-center mb-3" data-i18n="titleF1d">${t('titleF1d')}</h2><canvas id="canvas-f-1d" width="${SIZE_1D}" height="150"></canvas><canvas id="canvas-g-1d" width="${SIZE_1D}" height="150"></canvas></div><div class="canvas-wrapper"><h2 class="text-xl font-semibold text-center mb-3" data-i18n="titleResult1d">${t('titleResult1d')}</h2><canvas id="canvas-result-1d" width="${SIZE_1D}" height="150"></canvas></div>`;
            canvasF = document.getElementById('canvas-f-1d');
            canvasG = document.getElementById('canvas-g-1d');
            canvasResult = document.getElementById('canvas-result-1d');
            ctxF = canvasF.getContext('2d');
            ctxG = canvasG.getContext('2d');
            ctxResult = canvasResult.getContext('2d');
        } else {
            mainContent.className = 'flex-grow grid grid-cols-1 md:grid-cols-2 gap-6';
            mainContent.innerHTML = `<div class="canvas-wrapper"><h2 class="text-xl font-semibold text-center mb-3" data-i18n="titleF2d">${t('titleF2d')}</h2><div class="relative"><video id="webcam-video" class="hidden w-full aspect-square rounded-lg border" autoplay playsinline></video><canvas id="canvas-f-2d" width="${SIZE_2D}" height="${SIZE_2D}" class="w-full aspect-square"></canvas></div></div><div class="canvas-wrapper"><h2 class="text-xl font-semibold text-center mb-3" data-i18n="titleResult2d">${t('titleResult2d')}</h2><canvas id="canvas-result-2d" width="${SIZE_2D}" height="${SIZE_2D}" class="w-full aspect-square"></canvas></div>`;
            canvasF = document.getElementById('canvas-f-2d');
            canvasResult = document.getElementById('canvas-result-2d');
            webcamVideo = document.getElementById('webcam-video');
            ctxF = canvasF.getContext('2d', { willReadFrequently: true });
            ctxG = null;
            ctxResult = canvasResult.getContext('2d');
        }
    }
    
    function setupMode(newMode) {
        MODE = newMode;
        imageLoadId++; // Invalidate image callbacks targeting the previous layout.
        stopWebcam();
        updateActiveButton(null);
        
        if (MODE === '1D') {
            controls1D.classList.remove('hidden');
            controls2D.classList.add('hidden');
            buildLayout();
            populateControls();
            updateAndDraw();
        } else { // 2D Mode
            controls1D.classList.add('hidden');
            controls2D.classList.remove('hidden');
            buildLayout();
            populateControls();
            
            // Re-assign statusEl now that it exists in the DOM
            statusEl = document.getElementById('status');
            statusEl.textContent = t('stSelect'); // Set initial text
            bind2DSourceControls();
            
            loadPreset(params['2D'].f.source || 'grid');
        }
    }
    
    // --- 2D SOURCE HANDLING ---
    function updateActiveButton(buttonToActivate) {
        if (activeSourceButton) {
            activeSourceButton.classList.remove('active-btn');
        }
        if (buttonToActivate) {
            buttonToActivate.classList.add('active-btn');
        }
        activeSourceButton = buttonToActivate;
    }

    function loadPreset(sourceType) {
        if (MODE !== '2D') return;
        stopWebcam();
        const requestId = ++imageLoadId;
        // A webcam is restarted only by its button; uploads retain decoded pixels.
        if (sourceType === 'upload' && uploadedImage) {
            params['2D'].f.source = 'upload';
            document.getElementById('preset-select-2d').value = '';
            updateActiveButton(document.getElementById('use-upload-btn'));
            drawSourceToCanvasCover(uploadedImage, canvasF, ctxF);
            updateAndDraw();
            return;
        }
        if (!Object.prototype.hasOwnProperty.call(SAMPLE_IMAGES, sourceType)) sourceType = 'grid';
        updateActiveButton(null);
        document.getElementById('preset-select-2d').value = sourceType;
        params['2D'].f.source = sourceType;
        const img = new Image();
        img.onload = () => {
            if (requestId !== imageLoadId || MODE !== '2D') return;
            drawSourceToCanvasCover(img, canvasF, ctxF);
            updateAndDraw();
        };
        img.onerror = () => {
            if (requestId !== imageLoadId || MODE !== '2D') return;
            console.error('Failed to load sample image:', sourceType);
            if (statusEl) statusEl.textContent = t('stLoadFail');
        };
        img.src = SAMPLE_IMAGES[sourceType];
    }

    async function startWebcam() {
        if (MODE !== '2D' || webcamStream || webcamRequestPending) return;
        imageLoadId++; // A previous image load must not overwrite webcam frames.
        params['2D'].f.source = 'webcam';
        const requestId = ++webcamRequestId;
        webcamRequestPending = true;
        if (statusEl) statusEl.textContent = t('stRequesting');
        updateActiveButton(document.getElementById('use-webcam-btn'));
        document.getElementById('preset-select-2d').value = '';
        try {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                throw new Error('Webcam access is unavailable in this browser context.');
            }
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: SIZE_2D }, height: { ideal: SIZE_2D } }
            });
            if (requestId !== webcamRequestId || MODE !== '2D' || params['2D'].f.source !== 'webcam') {
                stream.getTracks().forEach(track => track.stop());
                return;
            }
            webcamRequestPending = false;
            webcamStream = stream;
            webcamVideo.onloadedmetadata = () => {
                if (requestId !== webcamRequestId || webcamStream !== stream) return;
                if (animationFrameId !== null) cancelAnimationFrame(animationFrameId);
                transformLoop2D();
            };
            webcamVideo.srcObject = stream;
            webcamVideo.classList.remove('hidden');
            canvasF.classList.add('hidden');
            if (statusEl) statusEl.textContent = t('stWebcam');
        } catch (err) {
            if (requestId !== webcamRequestId || MODE !== '2D') return;
            console.error('Webcam error:', err);
            loadPreset('grid');
        }
    }

    function stopWebcam() {
        webcamRequestId++; // Late permission results must dispose of their stream.
        webcamRequestPending = false;
        if (webcamVideo) webcamVideo.onloadedmetadata = null;
        if (webcamStream) {
            webcamStream.getTracks().forEach(track => track.stop());
            webcamStream = null;
        }
        if (webcamVideo) {
            webcamVideo.classList.add('hidden');
            webcamVideo.srcObject = null;
        }
        if (canvasF) canvasF.classList.remove('hidden');
        if (animationFrameId !== null) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }
    }

    function transformLoop2D() {
        if (MODE !== '2D' || !webcamStream || !webcamVideo || !canvasF || !ctxF) return;
        try {
            drawSourceToCanvasCover(webcamVideo, canvasF, ctxF);
            updateAndDraw();
        } catch (error) {
            console.error('Error in webcam loop:', error);
        }
        animationFrameId = requestAnimationFrame(transformLoop2D);
    }

    // --- INITIALIZATION ---
    function init() {
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.id = 'image-upload-actual';
        fileInput.className = 'hidden';
        fileInput.accept = 'image/*';
        document.body.appendChild(fileInput);

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file || MODE !== '2D') return;
            stopWebcam();
            const requestId = ++imageLoadId;
            updateActiveButton(document.getElementById('use-upload-btn'));
            document.getElementById('preset-select-2d').value = '';
            params['2D'].f.source = 'upload';
            const img = new Image();
            const objectUrl = URL.createObjectURL(file);
            img.onload = () => {
                URL.revokeObjectURL(objectUrl);
                if (requestId !== imageLoadId || MODE !== '2D') return;
                uploadedImage = img;
                drawSourceToCanvasCover(img, canvasF, ctxF);
                updateAndDraw();
            };
            img.onerror = () => {
                URL.revokeObjectURL(objectUrl);
                if (requestId !== imageLoadId || MODE !== '2D') return;
                loadPreset('grid');
            };
            img.src = objectUrl;
            fileInput.value = ''; // Permit choosing the same file again.
        });

        mainHeader.addEventListener('change', handleHeaderChange);
        mainHeader.addEventListener('input', handleHeaderChange);
        setupMode('1D');

        const langEn = document.getElementById('langEn'), langFr = document.getElementById('langFr');
        function applyLanguage() {
            document.documentElement.lang = lang;
            document.title = t('title');
            document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
            document.getElementById('notes-box').innerHTML = t('notes');
            langEn.setAttribute('aria-pressed', String(lang === 'en'));
            langFr.setAttribute('aria-pressed', String(lang === 'fr'));
            rebuildControls();
        }
        function setLanguage(code) {
            lang = code;
            try { localStorage.setItem('convolutions-lang', code); } catch (e) { /* ignore */ }
            applyLanguage();
        }
        langEn.addEventListener('click', () => setLanguage('en'));
        langFr.addEventListener('click', () => setLanguage('fr'));
        applyLanguage();
    }

    window.addEventListener('beforeunload', stopWebcam);
    window.addEventListener('load', init);
    </script>
</body>
</html>
