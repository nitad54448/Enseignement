function setupConceptVisualization(concept) {
            switch (concept) {
                case 'wavelength_amplitude': {
                    waveLine1 = createSingleWaveObject(0x2ecc71);
                    scene.add(waveLine1);
                    wavelengthIndicatorViz = new THREE.Group();
                    const indicatorMat = new THREE.LineBasicMaterial({
                        color: 0xff00ff
                    });
                    const mainBarGeom = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(1, 0, 0)]);
                    const capGeom = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -0.1, 0), new THREE.Vector3(0, 0.1, 0)]);
                    wavelengthIndicatorViz.add(new THREE.Line(mainBarGeom, indicatorMat));
                    wavelengthIndicatorViz.add(new THREE.Line(capGeom.clone(), indicatorMat));
                    wavelengthIndicatorViz.add(new THREE.Line(capGeom.clone(), indicatorMat));
                    scene.add(wavelengthIndicatorViz);
                    updateConceptVisualization(currentConcept);
                    break;
                }
                case 'phase': {
                    phasorCanvas.style.display = 'block';
                    waveLine1 = createSingleWaveObject(0x3498db, 0.6);
                    scene.add(waveLine1);
                    waveLine2 = createSingleWaveObject(0xe67e22);
                    scene.add(waveLine2);
                    phaseShiftIndicatorViz = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, -0.2, 0.1), 0, 0x00ffff, 0.2, 0.1);
                    scene.add(phaseShiftIndicatorViz);
                    updateConceptVisualization(currentConcept);
                    break;
                }
                case 'interference': {
                    waveLine1 = createSingleWaveObject(0x3498db, 0.6);
                    scene.add(waveLine1);
                    waveLine2 = createSingleWaveObject(0xe67e22, 0.6);
                    scene.add(waveLine2);
                    interferenceSuperposition = createSingleWaveObject(0xffffff, 1.0);
                    scene.add(interferenceSuperposition);
                    break;
                }
                case 'standing_waves': {
                    standingWaveFwd = createSingleWaveObject(0x3498db, 0.6);
                    scene.add(standingWaveFwd);
                    standingWaveBwd = createSingleWaveObject(0xe67e22, 0.6);
                    scene.add(standingWaveBwd);
                    standingWaveResult = createSingleWaveObject(0xffffff, 1.0);
                    scene.add(standingWaveResult);
                    rebuildStandingMarkers();
                    break;
                }
                case 'attenuation': {
                    waveLine1 = createSingleWaveObject(0x1abc9c);
                    scene.add(waveLine1);
                    // Faint dashed-looking envelope ±A₀ exp(−α|x|)
                    attenuationEnvelopeUpper = createSingleWaveObject(0xe74c3c, 0.6);
                    attenuationEnvelopeLower = createSingleWaveObject(0xe74c3c, 0.6);
                    scene.add(attenuationEnvelopeUpper);
                    scene.add(attenuationEnvelopeLower);
                    break;
                }
                case 'doppler_effect': {
                    waveLine1 = createSingleWaveObject(0x1abc9c);
                    scene.add(waveLine1);
                    const sourceGeom = new THREE.SphereGeometry(0.15, 16, 12);
                    const sourceMat = new THREE.MeshBasicMaterial({
                        color: 0xf1c40f
                    });
                    dopplerSourceViz = new THREE.Mesh(sourceGeom, sourceMat);
                    scene.add(dopplerSourceViz);
                    // Observers (left and right of the scene)
                    const obsGeom = new THREE.SphereGeometry(0.12, 12, 8);
                    dopplerObserverLeft = new THREE.Mesh(obsGeom.clone(), new THREE.MeshBasicMaterial({ color: 0xe74c3c }));
                    dopplerObserverLeft.position.set(-waveParams.extent / 2 + 0.4, -0.6, 0);
                    scene.add(dopplerObserverLeft);
                    dopplerObserverRight = new THREE.Mesh(obsGeom.clone(), new THREE.MeshBasicMaterial({ color: 0x2ecc71 }));
                    dopplerObserverRight.position.set(waveParams.extent / 2 - 0.4, -0.6, 0);
                    scene.add(dopplerObserverRight);
                    animationTime = 0;
                    break;
                }
                case 'polarization': {
                    animationTime = 0;
                    if (controls) { camera.position.set(8, 4, 10); controls.target.set(0, 0, 0); controls.update(); }
                    if (waveParams.polarizationViewMode === 'temporal') {
                        waveLine1 = createSingleWaveObject(0x67e8f9, 0.85);
                        waveLine1.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(501 * 3), 3));
                        scene.add(waveLine1);
                        const E_amp_temp = waveParams.amplitude;
                        animatedEVector = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0), E_amp_temp, 0xffff00, 0.25 * E_amp_temp, 0.15 * E_amp_temp);
                        scene.add(animatedEVector);
                        const traceMaterial = new THREE.LineBasicMaterial({
                            color: 0xffffff,
                            transparent: true,
                            opacity: 0.7
                        });
                        const tracePointsCount = 100;
                        const tracePositions = new Float32Array(tracePointsCount * 3);
                        let initialEy, initialEz;
                        const temp_A_trace = (waveParams.polarizationType === 'elliptical' && waveParams.Ey_amplitude !== undefined) ? waveParams.Ey_amplitude : E_amp_temp;
                        const temp_B_trace = (waveParams.polarizationType === 'elliptical' && waveParams.Ez_amplitude !== undefined) ? waveParams.Ez_amplitude : E_amp_temp;
                        const initialField = polarizationField(0, 0);
                        initialEy = initialField.y; initialEz = initialField.z;
                        for (let i = 0; i < tracePointsCount; ++i) {
                            tracePositions[i * 3] = 0;
                            tracePositions[i * 3 + 1] = initialEy;
                            tracePositions[i * 3 + 2] = initialEz;
                        }
                        const traceGeometry = new THREE.BufferGeometry();
                        traceGeometry.setAttribute('position', new THREE.BufferAttribute(tracePositions, 3));
                        traceGeometry.setDrawRange(0, 1);
                        eVectorTracePath = new THREE.Line(traceGeometry, traceMaterial);
                        eVectorTracePath.userData = {
                            pathLength: tracePointsCount,
                            drawnPoints: 1
                        };
                        scene.add(eVectorTracePath);
                    } else {
                        const arrowColor = 0xffff00;
                        const numberOfArrows = 25;
                        const arrowSpacing = waveParams.extent / (numberOfArrows > 1 ? (numberOfArrows - 1) : 1);
                        for (let i = 0; i < numberOfArrows; i++) {
                            const xPos = -waveParams.extent / 2 + i * arrowSpacing;
                            const origin = new THREE.Vector3(xPos, 0, 0);
                            const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), origin, 1, arrowColor, 0.3, 0.2);
                            if (waveParams.polarizationType === 'unpolarized') arrow.userData.randomAngleSpatial = Math.random() * 2 * Math.PI;
                            spatialPolarizationEVectors.push(arrow);
                            scene.add(arrow);
                        }
                        // Helix path: connects arrow tips, shown for circular/elliptical.
                        const helixPolarizationTypes = ['linear_vertical', 'linear_horizontal', 'circular_right_expected', 'circular_left_expected', 'elliptical', 'unpolarized'];
                        if (helixPolarizationTypes.includes(waveParams.polarizationType)) {
                            const helixGeom = new THREE.BufferGeometry();
                            const helixPoints = 241;
                            helixGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(helixPoints * 3), 3));
                            const helixMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 });
                            polarizationHelixPath = new THREE.Line(helixGeom, helixMat);
                            polarizationHelixPath.userData = { points: helixPoints };
                            scene.add(polarizationHelixPath);
                        }
                    }
                    updateConceptVisualization(currentConcept);
                    break;
                }
                case 'poynting_vector': {
                    waveLine1 = createSingleWaveObject(0x3498db, 0.8);
                    scene.add(waveLine1);
                    updateWaveGeometry(waveLine1, waveParams.wavelength, waveParams.amplitude, 0);
                    poyntingArrowViz = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 0), 1.5, 0xffff00, 0.3, 0.15);
                    scene.add(poyntingArrowViz);
                    updateConceptVisualization(currentConcept);
                    break;
                }
                case 'phase_group_velocity': {
                    const baseAmp = waveParams.amplitude;
                    const baseLambda = waveParams.wavelength;
                    if (waveParams.velocityDisplayType === 'phase') {
                        waveLine1 = createSingleWaveObject(0x1abc9c);
                        scene.add(waveLine1);
                        updateWaveGeometry(waveLine1, baseLambda, baseAmp, 0);
                        const markerGeom = new THREE.SphereGeometry(0.15, 12, 8);
                        const markerMat = new THREE.MeshBasicMaterial({
                            color: 0xf1c40f
                        });
                        phaseMarkerViz = new THREE.Mesh(markerGeom, markerMat);
                        scene.add(phaseMarkerViz);
                    } else {
                        groupWaveComp1 = createSingleWaveObject(0x3498db, 0.5);
                        scene.add(groupWaveComp1);
                        groupWaveComp2 = createSingleWaveObject(0x9b59b6, 0.5);
                        scene.add(groupWaveComp2);
                        groupWaveSuperposition = createSingleWaveObject(0xffffff, 0.9);
                        scene.add(groupWaveSuperposition);
                        groupWaveEnvelopeUpper = createSingleWaveObject(0xe74c3c, 0.8);
                        scene.add(groupWaveEnvelopeUpper);
                        groupWaveEnvelopeLower = createSingleWaveObject(0xe74c3c, 0.8);
                        scene.add(groupWaveEnvelopeLower);
                        const markerGeomPhase = new THREE.SphereGeometry(0.1, 10, 6);
                        const markerMatPhase = new THREE.MeshBasicMaterial({
                            color: 0xf1c40f
                        });
                        phaseMarkerViz = new THREE.Mesh(markerGeomPhase, markerMatPhase);
                        scene.add(phaseMarkerViz);
                        const markerGeomGroup = new THREE.SphereGeometry(0.12, 10, 6);
                        const markerMatGroup = new THREE.MeshBasicMaterial({
                            color: 'cyan'
                        });
                        groupMarkerViz = new THREE.Mesh(markerGeomGroup, markerMatGroup);
                        scene.add(groupMarkerViz);
                    }
                    animationTime = 0;
                    updateConceptVisualization(currentConcept);
                    break;
                }
                case 'wave_type_comparison': {
                    const particleMat = new THREE.MeshBasicMaterial({
                        color: 0xffffff
                    });
                    const particleGeom = new THREE.SphereGeometry(0.08, 16, 12);
                    for (let i = 0; i < waveParams.particleCount; i++) {
                        const xPos = -waveParams.extent / 2 + i * (waveParams.extent / (waveParams.particleCount > 1 ? (waveParams.particleCount - 1) : 1));
                        const particle = new THREE.Mesh(particleGeom.clone(), particleMat.clone());
                        particle.userData.initialX = xPos;
                        particle.position.set(xPos, 0, 0);
                        particleSystemViz.push(particle);
                        scene.add(particle);
                    }
                    animationTime = 0;
                    break;
                }
                case 'wavefront': {
                    const wfMat = new THREE.MeshBasicMaterial({
                        color: 0x1abc9c,
                        transparent: true,
                        opacity: 0.24, depthWrite: false,
                        side: THREE.DoubleSide
                    });
                    const numFronts = 7;
                    const planeSize = waveParams.extent / aspectVerticalFix(camera) * 0.8;
                    if (waveParams.wavefrontType === 'plane') {
                        const planeGeom = new THREE.PlaneGeometry(planeSize, planeSize);
                        for (let i = 0; i < numFronts; i++) {
                            const plane = new THREE.Mesh(planeGeom, wfMat.clone());
                            plane.rotation.y = Math.PI / 2;
                            plane.userData.initialX = -waveParams.extent / 2 - i * 1.5;
                            plane.position.x = plane.userData.initialX;
                            addWavefrontFieldProbes(plane, false);
                            wavefrontObjects.push(plane);
                            scene.add(plane);
                        }
                    } else {
                        const sphereGeom = new THREE.SphereGeometry(1, 32, 16);
                        for (let i = 0; i < numFronts - 2; i++) {
                            const sphere = new THREE.Mesh(sphereGeom, wfMat.clone());
                            sphere.material.wireframe = false;
                            sphere.userData.currentRadius = 0.1 + i * 1.2;
                            sphere.scale.setScalar(sphere.userData.currentRadius);
                            addWavefrontFieldProbes(sphere, true);
                            wavefrontObjects.push(sphere);
                            scene.add(sphere);
                        }
                    }
                    animationTime = 0;
                    updateConceptVisualization(concept);
                    if (controls) {
                        camera.position.set(4, 3, 8);
                        controls.target.set(-2, 0, 0);
                        controls.update();
                    }
                    break;
                }
                case 'wave_scattering': {
                    switchToPerspectiveCamera();
                    axesHelper.visible = false;
                    if (gridHelper) gridHelper.visible = false;
                    if (polarCanvas) polarCanvas.style.display = Object.values(scatteringParams.polarSelections).some(Boolean) ? 'block' : 'none';
                    scatteringViz.lights.push(new THREE.AmbientLight(0xffffff, 0.6));
                    scatteringViz.lights.push(new THREE.DirectionalLight(0xffffff, 0.8));
                    scatteringViz.lights.forEach(l => scene.add(l));
                    scatteringViz.axes = new THREE.AxesHelper(scatteringParams.sceneExtent / 2);
                    scene.add(scatteringViz.axes);
                    createScatteringParticle();
                    createScatteringWaves();
                    // Internal wave coordinates (propagation x, polarization y) map to
                    // the reference figure's world coordinates (propagation z, polarization x).
                    scatteringFrame = new THREE.Group();
                    scatteringFrame.setRotationFromMatrix(new THREE.Matrix4().makeBasis(
                        new THREE.Vector3(0,0,1),new THREE.Vector3(1,0,0),new THREE.Vector3(0,1,0)));
                    scatteringFrame.add(scatteringViz.particle);
                    scatteringViz.incomingWave.planes.forEach(o=>scatteringFrame.add(o));
                    scatteringViz.incomingWave.vectors.forEach(row=>row.forEach(o=>scatteringFrame.add(o)));
                    scatteringViz.radiatedWave.shells.forEach(shell=>scatteringFrame.add(shell.sphere,shell.torus));
                    scene.add(scatteringFrame);
                    createPsiIllustration();
                    break;
                }
                case 'reflection_transmission': {
                    reflectionWaveIncident = createSingleWaveObject(0x3498db, 0.7);
                    reflectionWaveReflected = createSingleWaveObject(0xe67e22, 0.7);
                    reflectionWaveTransmitted = createSingleWaveObject(0x2ecc71, 1.0);
                    reflectionWaveTransmitted.position.z = 0.05; // draw on top
                    waveLine1 = createSingleWaveObject(0xffffff, 0.85); // resultant on left only
                    scene.add(reflectionWaveIncident);
                    scene.add(reflectionWaveReflected);
                    scene.add(reflectionWaveTransmitted);
                    scene.add(waveLine1);
                    // Shaded background regions to mark the two media
                    const halfH = waveParams.extent; // tall enough to fill the visible viewport
                    const leftMedium = new THREE.Mesh(
                        new THREE.PlaneGeometry(waveParams.extent / 2, halfH),
                        new THREE.MeshBasicMaterial({ color: 0x1c3a5e, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
                    );
                    leftMedium.position.set(-waveParams.extent / 4, 0, -0.1);
                    scene.add(leftMedium);
                    const rightMedium = new THREE.Mesh(
                        new THREE.PlaneGeometry(waveParams.extent / 2, halfH),
                        new THREE.MeshBasicMaterial({ color: 0x3a1c5e, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
                    );
                    rightMedium.position.set(waveParams.extent / 4, 0, -0.1);
                    scene.add(rightMedium);
                    // Solid vertical interface line at x=0, full height
                    const interfaceGeom = new THREE.BufferGeometry().setFromPoints([
                        new THREE.Vector3(0, -halfH / 2, 0.05), new THREE.Vector3(0, halfH / 2, 0.05)
                    ]);
                    const interfaceMat = new THREE.LineBasicMaterial({ color: 0xffffff });
                    reflectionInterfaceLine = new THREE.Line(interfaceGeom, interfaceMat);
                    scene.add(reflectionInterfaceLine);
                    // Stash the background meshes on the interface line for cleanup
                    reflectionInterfaceLine.userData.bgMeshes = [leftMedium, rightMedium];
                    break;
                }
                case 'beats': {
                    beatsWave1 = createSingleWaveObject(0x3498db, 0.5);
                    beatsWave2 = createSingleWaveObject(0x9b59b6, 0.5);
                    beatsSuperposition = createSingleWaveObject(0xffffff, 0.95);
                    beatsEnvelopeUpper = createSingleWaveObject(0xe74c3c, 0.8);
                    beatsEnvelopeLower = createSingleWaveObject(0xe74c3c, 0.8);
                    [beatsWave1, beatsWave2, beatsSuperposition, beatsEnvelopeUpper, beatsEnvelopeLower].forEach(o => scene.add(o));
                    break;
                }
                case 'snell': {
                    const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
                    const interfaceGeom = new THREE.BufferGeometry().setFromPoints([
                        new THREE.Vector3(-waveParams.extent/2, 0, 0.05),
                        new THREE.Vector3(waveParams.extent/2, 0, 0.05)
                    ]);
                    snellInterfaceLine = new THREE.Line(interfaceGeom, lineMat);
                    scene.add(snellInterfaceLine);
                    const normalGeom = new THREE.BufferGeometry().setFromPoints([
                        new THREE.Vector3(0, -waveParams.extent/2, 0.05),
                        new THREE.Vector3(0, waveParams.extent/2, 0.05)
                    ]);
                    const normalMat = new THREE.LineDashedMaterial({ color: 0x888888, dashSize: 0.15, gapSize: 0.1 });
                    snellNormalLine = new THREE.Line(normalGeom, normalMat);
                    snellNormalLine.computeLineDistances();
                    scene.add(snellNormalLine);
                    // Ray placeholders — geometries are rebuilt every frame
                    const rayGeomI = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
                    const rayGeomR = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
                    const rayGeomT = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
                    snellIncidentRay = new THREE.Line(rayGeomI, new THREE.LineBasicMaterial({ color: 0x3498db, linewidth: 3 }));
                    snellReflectedRay = new THREE.Line(rayGeomR, new THREE.LineBasicMaterial({ color: 0xe67e22 }));
                    snellRefractedRay = new THREE.Line(rayGeomT, new THREE.LineBasicMaterial({ color: 0x2ecc71, linewidth: 3 }));
                    scene.add(snellIncidentRay);
                    scene.add(snellReflectedRay);
                    scene.add(snellRefractedRay);
                    break;
                }
                case 'atomic_form_factor':
                case 'form_factor_2_centers': {
                    // Show phasor (top-right) AND f(Q) graph (below it)
                    phasorCanvas.style.display = 'block';
                    aff_graphCanvas.style.display = 'block';
                    // Hide axes/grid — they're not informative here
                    axesHelper.visible = false;
                    if (gridHelper) gridHelper.visible = false;
                    // Build atom disc(s) — Gaussian density rendered as a radial texture
                    rebuildAffAtoms();
                    // Arrows: k_in (blue), k_out (green), Q = k_out - k_in (red)
                    aff_kInArrow  = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0.1), 1, 0x3498db, 0.3, 0.18);
                    aff_kOutArrow = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0.1), 1, 0x2ecc71, 0.3, 0.18);
                    aff_qArrow    = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0.1), 1, 0xe74c3c, 0.3, 0.18);
                    scene.add(aff_kInArrow);
                    scene.add(aff_kOutArrow);
                    scene.add(aff_qArrow);
                    break;
                }
            }
        }

        function updateConceptVisualization(concept) {
            let A = waveParams.amplitude;
            let L = waveParams.wavelength;
            let k = (2 * Math.PI) / L;
            if (L <= 0.001) k = (2 * Math.PI) / 0.001;
            const phaseOffset = -omegaAnimation * animationTime;

            switch (concept) {
                case 'wavelength_amplitude': {
                    if (waveLine1) updateWaveGeometry(waveLine1, L, A, phaseOffset);
                    if (wavelengthIndicatorViz) {
                        const yPos = A + 0.3;
                        const peakBaseX = (Math.PI / 2 - phaseOffset) / k;
                        const n = Math.ceil((-waveParams.extent / 2 - peakBaseX) / L);
                        let xStart = peakBaseX + n * L;
                        let xEnd = xStart + L;
                        const mainBarPos = wavelengthIndicatorViz.children[0].geometry.attributes.position;
                        mainBarPos.setXYZ(0, xStart, yPos, 0.1);
                        mainBarPos.setXYZ(1, xEnd, yPos, 0.1);
                        mainBarPos.needsUpdate = true;
                        const cap1Pos = wavelengthIndicatorViz.children[1].geometry.attributes.position;
                        cap1Pos.setXYZ(0, xStart, yPos - 0.15, 0.1);
                        cap1Pos.setXYZ(1, xStart, yPos + 0.15, 0.1);
                        cap1Pos.needsUpdate = true;
                        const cap2Pos = wavelengthIndicatorViz.children[2].geometry.attributes.position;
                        cap2Pos.setXYZ(0, xEnd, yPos - 0.15, 0.1);
                        cap2Pos.setXYZ(1, xEnd, yPos + 0.15, 0.1);
                        cap2Pos.needsUpdate = true;
                        wavelengthIndicatorViz.visible = xEnd < (waveParams.extent / 2 + L);
                    }
                    break;
                }
                case 'phase': {
                    const A1 = waveParams.phaseAmp1 || 1.0;
                    const A2 = waveParams.phaseAmp2 || 1.0;
                    L = 2.0;
                    k = (2 * Math.PI) / L;
                    if (waveLine1) updateWaveGeometry(waveLine1, L, A1, phaseOffset);
                    if (waveLine2) updateWaveGeometry(waveLine2, L, A2, waveParams.phaseShift + phaseOffset);
                    if (phaseShiftIndicatorViz) {
                        const spatialShift = -waveParams.phaseShift / k;
                        if (Math.abs(spatialShift) < 0.01) {
                            phaseShiftIndicatorViz.visible = false;
                        } else {
                            phaseShiftIndicatorViz.visible = true;
                            const direction = new THREE.Vector3(Math.sign(spatialShift), 0, 0);
                            const length = Math.abs(spatialShift);
                            phaseShiftIndicatorViz.position.set(0, -0.2, 0.1);
                            phaseShiftIndicatorViz.setDirection(direction);
                            phaseShiftIndicatorViz.setLength(length, 0.2, 0.1);
                        }
                    }
                    drawPhasorDiagram(waveParams.phaseShift, {
                        showResultant: true,
                        color1: '#3498db',
                        color2: '#e67e22',
                        amp1: A1,
                        amp2: A2
                    });

                    const sumAmpInfo = document.getElementById('sum-amplitude-info');
                    if (sumAmpInfo) {
                        // |A1·e^{i·0} + A2·e^{iφ}| = sqrt(A1² + A2² + 2·A1·A2·cos φ)
                        const sumAmplitude = Math.sqrt(A1*A1 + A2*A2 + 2*A1*A2*Math.cos(waveParams.phaseShift));
                        sumAmpInfo.textContent = `Sum Amplitude: ${sumAmplitude.toFixed(2)}`;
                    }
                    break;
                }
                case 'interference': {
                    if (!waveLine1 || !waveLine2 || !interferenceSuperposition) return;
                    A = waveParams.interferenceAmplitude;
                    L = waveParams.interferenceWavelength;
                    const sep = waveParams.interferenceSeparation / 2;
                    updateWaveGeometry(waveLine1, L, A, phaseOffset, {
                        x_offset: -sep
                    });
                    updateWaveGeometry(waveLine2, L, A, phaseOffset, {
                        x_offset: sep
                    });
                    const pos1 = waveLine1.geometry.attributes.position.array;
                    const pos2 = waveLine2.geometry.attributes.position.array;
                    const superPos = interferenceSuperposition.geometry.attributes.position.array;
                    for (let i = 0; i < waveParams.points; i++) {
                        superPos[i * 3] = pos1[i * 3];
                        superPos[i * 3 + 1] = pos1[i * 3 + 1] + pos2[i * 3 + 1];
                        superPos[i * 3 + 2] = 0;
                    }
                    interferenceSuperposition.geometry.attributes.position.needsUpdate = true;
                    // Path-difference info: between sources, Δd ≈ separation, and Δd/λ tells (de)constructive
                    const info = document.getElementById('interf-pathdiff-info');
                    if (info) {
                        const ratio = waveParams.interferenceSeparation / L;
                        let nature = 'mixed';
                        const fractional = Math.abs(ratio - Math.round(ratio));
                        if (fractional < 0.05) nature = '≈ constructive (integer λ)';
                        else if (Math.abs(fractional - 0.5) < 0.05) nature = '≈ destructive (half-integer λ)';
                        info.innerHTML = `Source separation / λ = <b>${ratio.toFixed(2)}</b><br>${nature}`;
                    }
                    break;
                }
                case 'standing_waves': {
                    if (!standingWaveFwd || !standingWaveBwd || !standingWaveResult) return;
                    A = waveParams.standingAmplitude;
                    L = waveParams.standingWavelength;
                    updateWaveGeometry(standingWaveFwd, L, A, phaseOffset);
                    updateWaveGeometry(standingWaveBwd, L, A, -phaseOffset);
                    const pos1 = standingWaveFwd.geometry.attributes.position.array;
                    const pos2 = standingWaveBwd.geometry.attributes.position.array;
                    const resultPos = standingWaveResult.geometry.attributes.position.array;
                    for (let i = 0; i < waveParams.points; i++) {
                        resultPos[i * 3] = pos1[i * 3];
                        resultPos[i * 3 + 1] = pos1[i * 3 + 1] + pos2[i * 3 + 1];
                        resultPos[i * 3 + 2] = 0;
                    }
                    standingWaveResult.geometry.attributes.position.needsUpdate = true;
                    break;
                }
                case 'attenuation': {
                    if (!waveLine1) return;
                    updateWaveGeometry(waveLine1, L, A, phaseOffset, {
                        attenuation: waveParams.attenuationFactor
                    });
                    // Draw the analytic envelope ±A₀ e^{-α|x|} as static smooth curves
                    if (attenuationEnvelopeUpper && attenuationEnvelopeLower) {
                        const posU = attenuationEnvelopeUpper.geometry.attributes.position.array;
                        const posL = attenuationEnvelopeLower.geometry.attributes.position.array;
                        for (let i = 0; i < waveParams.points; i++) {
                            const x = (i / (waveParams.points - 1)) * waveParams.extent - (waveParams.extent / 2);
                            const env = A * Math.exp(-waveParams.attenuationFactor * Math.abs(x));
                            posU[i * 3] = x; posU[i * 3 + 1] = env; posU[i * 3 + 2] = 0;
                            posL[i * 3] = x; posL[i * 3 + 1] = -env; posL[i * 3 + 2] = 0;
                        }
                        attenuationEnvelopeUpper.geometry.attributes.position.needsUpdate = true;
                        attenuationEnvelopeLower.geometry.attributes.position.needsUpdate = true;
                    }
                    break;
                }
                case 'doppler_effect': {
                    if (!waveLine1 || !dopplerSourceViz) return;
                    const state = dopplerState(animationTime);
                    dopplerSourceViz.position.x = state.sourceX;
                    const positions = waveLine1.geometry.attributes.position.array;
                    for (let i = 0; i < waveParams.points; i++) {
                        const x = i / (waveParams.points - 1) * waveParams.extent - waveParams.extent / 2;
                        positions[i * 3] = x;
                        positions[i * 3 + 1] = dopplerDisplacement(x, animationTime, state);
                        positions[i * 3 + 2] = 0;
                    }
                    waveLine1.geometry.attributes.position.needsUpdate = true;
                    waveLine1.geometry.computeBoundingSphere();
                    const info = document.getElementById('doppler-freq-info');
                    if (info) {
                        info.innerHTML = `f₀ = <b>${state.f0.toFixed(3)}</b><br>` +
                            `<span style="color:#e74c3c">●</span> Left observer: f = <b>${state.fLeft.toFixed(3)}</b> (${((state.fLeft/state.f0-1)*100).toFixed(0)}%)<br>` +
                            `<span style="color:#2ecc71">●</span> Right observer: f = <b>${state.fRight.toFixed(3)}</b> (${((state.fRight/state.f0-1)*100).toFixed(0)}%)`;
                    }
                    break;
                }
                case 'polarization': {
                    const temporal = waveParams.polarizationViewMode === 'temporal';
                    const t = temporal ? animationTime : 0;
                    const curve = temporal ? waveLine1 : polarizationHelixPath;
                    if (curve) {
                        const pos = curve.geometry.attributes.position;
                        for (let i = 0; i < pos.count; i++) {
                            const x = -waveParams.extent / 2 + i / (pos.count - 1) * waveParams.extent;
                            const e = polarizationField(x, t);
                            pos.setXYZ(i, x, e.y, e.z);
                        }
                        pos.needsUpdate = true; curve.geometry.computeBoundingSphere();
                    }
                    if (temporal && animatedEVector && eVectorTracePath) {
                        const e = polarizationField(0, t);
                        setFieldArrow(animatedEVector, e);
                        if (eVectorTracePath.userData.lastSampleTime !== animationTime) {
                            eVectorTracePath.userData.lastSampleTime = animationTime;
                            const positions = eVectorTracePath.geometry.attributes.position;
                            positions.array.copyWithin(3, 0, positions.array.length - 3);
                            positions.setXYZ(0, 0, e.y, e.z);
                            const data = eVectorTracePath.userData;
                            data.drawnPoints = Math.min(data.pathLength, data.drawnPoints + 1);
                            eVectorTracePath.geometry.setDrawRange(0, data.drawnPoints);
                            positions.needsUpdate = true;
                            eVectorTracePath.geometry.computeBoundingSphere();
                        }
                    } else spatialPolarizationEVectors.forEach(arrow => setFieldArrow(arrow, polarizationField(arrow.position.x, t)));
                    break;
                }
                case 'poynting_vector': {
                    const E0 = waveParams.amplitude;
                    if (waveLine1) updateWaveGeometry(waveLine1, waveParams.wavelength, E0, 0);
                    if (poyntingArrowViz) {
                        const poyntingMagnitude = 0.4 * E0 * E0;
                        const headLength = 0.25 * poyntingMagnitude;
                        const headWidth = 0.12 * poyntingMagnitude;
                        poyntingArrowViz.setLength(poyntingMagnitude, headLength, headWidth);
                    }
                    break;
                }
                case 'phase_group_velocity': {
                    const baseAmp = waveParams.amplitude;
                    const baseLambda = waveParams.wavelength;
                    const k0 = (2 * Math.PI) / baseLambda;
                    const baseOmega = omegaAnimation * 1.2;
                    const v0_ref_global = baseOmega / k0;
                    if (waveParams.velocityDisplayType === 'phase') {
                        if (waveLine1 && phaseMarkerViz) {
                            const phaseOffset = -baseOmega * animationTime;
                            updateWaveGeometry(waveLine1, baseLambda, baseAmp, phaseOffset);
                            let markerX = (Math.PI / 2 - phaseOffset) / k0;
                            while (markerX > waveParams.extent / 2 + baseLambda) markerX -= baseLambda;
                            while (markerX < -waveParams.extent / 2 - baseLambda) markerX += baseLambda;
                            if (markerX > waveParams.extent / 2) markerX -= baseLambda;
                            else if (markerX < -waveParams.extent / 2) markerX += baseLambda;
                            phaseMarkerViz.position.set(markerX, baseAmp * Math.sin(k0 * markerX + phaseOffset), 0.01);
                        }
                        const readout = document.getElementById('velocity-readout');
                        if (readout) {
                            readout.innerHTML = `<span style="color:#f1c40f">●</span> v_phase = ω/k = <b>${v0_ref_global.toFixed(3)}</b>`;
                        }
                    } else {
                        if (!groupWaveSuperposition || !groupWaveEnvelopeUpper || !groupWaveEnvelopeLower || !phaseMarkerViz || !groupMarkerViz) return;
                        const A_comp = baseAmp * 0.5;
                        const delta_k_factor = waveParams.packet_delta_k_factor;
                        const k1 = k0 * (1 - delta_k_factor);
                        const k2 = k0 * (1 + delta_k_factor);
                        const v0_ref = baseOmega / k0;
                        const D = waveParams.dispersionFactor * v0_ref / k0;
                        const omega1 = k1 * v0_ref - D * k1 * (k1 - k0);
                        const omega2 = k2 * v0_ref - D * k2 * (k2 - k0);
                        const k_mod = (k2 - k1) / 2.0;
                        const omega_mod = (omega2 - omega1) / 2.0;
                        const lambda_env = (k_mod === 0 || isNaN(k_mod)) ? Infinity : (2 * Math.PI) / Math.abs(k_mod);
                        const phaseOffset_env = -omega_mod * animationTime;
                        updateWaveGeometry(groupWaveEnvelopeUpper, lambda_env, 2 * A_comp, phaseOffset_env, {
                            isEnvelope: true
                        });
                        updateWaveGeometry(groupWaveEnvelopeLower, lambda_env, -2 * A_comp, phaseOffset_env, {
                            isEnvelope: true
                        });
                        const positions = groupWaveSuperposition.geometry.attributes.position.array;
                        const time_factor_vg = 1.0;
                        for (let i = 0; i < waveParams.points; i++) {
                            const x_pos = (i / (waveParams.points - 1)) * waveParams.extent - (waveParams.extent / 2);
                            const y1 = calculateWavePoint(x_pos, k1, omega1, A_comp, animationTime * time_factor_vg, 0);
                            const y2 = calculateWavePoint(x_pos, k2, omega2, A_comp, animationTime * time_factor_vg, 0);
                            positions[i * 3] = x_pos;
                            positions[i * 3 + 1] = y1 + y2;
                            positions[i * 3 + 2] = 0;
                        }
                        groupWaveSuperposition.geometry.attributes.position.needsUpdate = true;
                        if (groupWaveComp1) updateWaveGeometry(groupWaveComp1, (2 * Math.PI) / k1, A_comp, -omega1 * animationTime * time_factor_vg);
                        if (groupWaveComp2) updateWaveGeometry(groupWaveComp2, (2 * Math.PI) / k2, A_comp, -omega2 * animationTime * time_factor_vg);
                        let groupMarkerX = (k_mod === 0) ? 0 : (-phaseOffset_env) / k_mod;
                        const lambda_env_vis = (k_mod === 0) ? waveParams.extent * 2 : Math.abs(2 * Math.PI / k_mod);
                        while (groupMarkerX > waveParams.extent / 2 + lambda_env_vis) groupMarkerX -= lambda_env_vis;
                        while (groupMarkerX < -waveParams.extent / 2 - lambda_env_vis) groupMarkerX += lambda_env_vis;
                        if (groupMarkerX > waveParams.extent / 2 && k_mod !== 0) groupMarkerX -= lambda_env_vis;
                        else if (groupMarkerX < -waveParams.extent / 2 && k_mod !== 0) groupMarkerX += lambda_env_vis;
                        groupMarkerViz.position.set(groupMarkerX, 2 * A_comp * Math.cos(k_mod * groupMarkerX + phaseOffset_env), 0.1);
                        const k_carr_avg = (k1 + k2) / 2;
                        const omega_carr_avg = (omega1 + omega2) / 2;
                        let phaseMarkerX_g = (k_carr_avg === 0) ? 0 : (Math.PI / 2 - (-omega_carr_avg * animationTime * time_factor_vg)) / k_carr_avg;
                        const lambda_carr_vis = (k_carr_avg === 0) ? waveParams.extent * 2 : Math.abs(2 * Math.PI / k_carr_avg);
                        while (phaseMarkerX_g > waveParams.extent / 2 + lambda_carr_vis) phaseMarkerX_g -= lambda_carr_vis;
                        while (phaseMarkerX_g < -waveParams.extent / 2 - lambda_carr_vis) phaseMarkerX_g += lambda_carr_vis;
                        if (phaseMarkerX_g > waveParams.extent / 2) phaseMarkerX_g -= lambda_carr_vis;
                        else if (phaseMarkerX_g < -waveParams.extent / 2) phaseMarkerX_g += lambda_carr_vis;
                        const y_env_at_phase_marker = 2 * A_comp * Math.cos(k_mod * phaseMarkerX_g + phaseOffset_env);
                        const y_carrier_at_marker = y_env_at_phase_marker * Math.sin(k_carr_avg * phaseMarkerX_g - omega_carr_avg * animationTime * time_factor_vg);
                        phaseMarkerViz.position.set(phaseMarkerX_g, y_carrier_at_marker, 0.1);
                        // Velocity readout
                        const v_phase = omega_carr_avg / k_carr_avg;
                        const v_group = (omega2 - omega1) / (k2 - k1);
                        const readout = document.getElementById('velocity-readout');
                        if (readout) {
                            readout.innerHTML =
                                `<span style="color:#f1c40f">●</span> v_phase = ω̄/k̄ = <b>${v_phase.toFixed(3)}</b><br>` +
                                `<span style="color:cyan">●</span> v_group = dω/dk ≈ <b>${v_group.toFixed(3)}</b><br>` +
                                `Ratio v_g / v_φ = <b>${(v_group / v_phase).toFixed(3)}</b>`;
                        }
                    }
                    break;
                }
                case 'wave_type_comparison': {
                    const k_comp = (2 * Math.PI) / waveParams.wavelength;
                    const omega_comp = omegaAnimation;
                    particleSystemViz.forEach(particle => {
                        const x_i = particle.userData.initialX;
                        if (waveParams.waveComparisonType === 'transverse') {
                            particle.position.y = waveParams.amplitude * Math.sin(k_comp * x_i - omega_comp * animationTime);
                            particle.position.x = x_i;
                        } else {
                            particle.position.x = x_i + waveParams.amplitude * 0.5 * Math.sin(k_comp * x_i - omega_comp * animationTime);
                            particle.position.y = 0;
                        }
                    });
                    break;
                }
                case 'wavefront': {
                    wavefrontObjects.forEach(wf => {
                        if (waveParams.wavefrontType === 'plane') {
                            const width = wf.geometry.parameters.width;
                            const minX = -waveParams.extent / 2 - width / 2 - 1;
                            const maxX = waveParams.extent / 2 + width / 2 + 1;
                            wf.position.x = minX + positiveModulo(wf.userData.initialX - minX + 1.2 * animationTime, maxX - minX);
                        } else {
                            const maxRadius = waveParams.extent / 1.8;
                            const radius = 0.1 + positiveModulo(wf.userData.currentRadius - 0.1 + 0.36 * animationTime, maxRadius - 0.1);
                            wf.scale.setScalar(radius);
                            wf.material.clippingPlanes = waveParams.wavefrontHalf ? [wavefrontCutPlane] : null;
                        }
                        updateWavefrontFieldProbes(wf);
                    });
                    break;
                }
                case 'wave_scattering': {
                    const omega_t = scatteringParams.oscillationFrequency * animationTime;
                    const firstPeakOffset = ((scatteringParams.waveSpeed * animationTime - (scatteringParams.wavelength / 4)) % scatteringParams.wavelength + scatteringParams.wavelength) % scatteringParams.wavelength;
                    if (scatteringParams.polarizationType === 'non_polarized') {
                        for (let i = 0; i < scatteringParams.numPlanes; i++) {
                            const peakX = scatteringParams.sceneExtent + firstPeakOffset - i * scatteringParams.wavelength;
                            if (!scatteringViz.incomingWave.passedParticle[i] && peakX < 0) scatteringViz.incomingWave.passedParticle[i] = true;
                            if (scatteringViz.incomingWave.passedParticle[i] && peakX > scatteringParams.sceneExtent) {
                                scatteringViz.incomingWave.passedParticle[i] = false;
                                scatteringViz.incomingWave.polarizationAngles[i] = Math.random() * 2 * Math.PI;
                            }
                        }
                    }
                    const k_scatter = (2 * Math.PI) / scatteringParams.wavelength;
                    for (let i = 0; i < scatteringParams.numPlanes; i++) {
                        const peakX = scatteringParams.sceneExtent + firstPeakOffset - i * scatteringParams.wavelength;
                        scatteringViz.incomingWave.planes[i].position.x = peakX;
                        scatteringViz.incomingWave.planes[i].visible = scatteringParams.showWavefront;
                        for (let j = 0; j < scatteringParams.vectorsPerCycle; j++) {
                            const vector = scatteringViz.incomingWave.vectors[i][j];
                            vector.position.x = peakX - (j / scatteringParams.vectorsPerCycle) * scatteringParams.wavelength;
                            const phase = omega_t - k_scatter * vector.position.x;
                            const amplitude = -Math.sin(phase);
                            let polarizationDir = new THREE.Vector3();
                            switch (scatteringParams.polarizationType) {
                                case 'linear_vertical':
                                    polarizationDir.set(0, 1, 0);
                                    break;
                                case 'linear_horizontal':
                                    polarizationDir.set(0, 0, 1);
                                    break;
                                case 'non_polarized':
                                    const currentAngle = scatteringViz.incomingWave.polarizationAngles[i];
                                    polarizationDir.set(0, Math.cos(currentAngle), Math.sin(currentAngle));
                                    break;
                            }
                            vector.setDirection(amplitude >= 0 ? polarizationDir : polarizationDir.clone().multiplyScalar(-1));
                            vector.setLength(Math.abs(amplitude) * 1.5, 0.4, 0.2);
                            vector.setColor(amplitude >= 0 ? 0xFFFF00 : 0xE74C3C);
                            vector.visible = Math.abs(amplitude) > 0.05;
                        }
                    }
                    const particlePhase = omega_t;
                    let particleAngle = 0;
                    if (scatteringParams.polarizationType === 'non_polarized') {
                        const i_particle = Math.floor((scatteringParams.sceneExtent + firstPeakOffset) / scatteringParams.wavelength);
                        particleAngle = scatteringViz.incomingWave.polarizationAngles[Math.max(0, Math.min(i_particle, scatteringParams.numPlanes - 1))];
                    }
                    const effectiveAmplitude = scatteringParams.baseAmplitude / scatteringParams.particleMass; // normalized visual displacement amplitude
                    let displacement = new THREE.Vector3();
                    switch (scatteringParams.polarizationType) {
                        case 'linear_vertical':
                            displacement.y = Math.sin(particlePhase);
                            break;
                        case 'linear_horizontal':
                            displacement.z = Math.sin(particlePhase);
                            break;
                        case 'non_polarized':
                            displacement.set(0, Math.sin(particlePhase) * Math.cos(particleAngle), Math.sin(particlePhase) * Math.sin(particleAngle));
                            break;
                    }
                    scatteringViz.lastParticleAngle = particleAngle;
                    if (scatteringViz.particle) scatteringViz.particle.position.copy(displacement).multiplyScalar(effectiveAmplitude * scatteringParams.particleCharge);
                    emitScatteringPulse(particlePhase);
                    updateAccelerationPlot();
                    updateRadiatedScatteringWave(effectiveAmplitude);
                    updatePsiIllustration();
                    drawPolarDipole(scatteringParams.polarizationType);
                    break;
                }
                case 'reflection_transmission': {
                    // 1D plane wave at normal incidence: r = (n1-n2)/(n1+n2), t = 2n1/(n1+n2).
                    // We display the spatial wave at fixed omega. Use a fixed source wavelength
                    // in vacuum, then λ in each medium scales as 1/n.
                    const lambda0 = 2.0;
                    const A0 = 1.0;
                    const n1 = waveParams.n1, n2 = waveParams.n2;
                    const r_amp = (n1 - n2) / (n1 + n2);
                    const t_amp = 2 * n1 / (n1 + n2);
                    const lambda1 = lambda0 / n1;
                    const lambda2 = lambda0 / n2;
                    const k1 = (2 * Math.PI) / lambda1;
                    const k2 = (2 * Math.PI) / lambda2;
                    // Common angular frequency: ω = k1 * v1 = k2 * v2 (v_i = c/n_i). Take ω = k1 / n1 * something:
                    // Simpler: pick ω so that on-screen motion is reasonable. ω drives time evolution only.
                    const omega = omegaAnimation;
                    const phaseT = -omega * animationTime;
                    const posI = reflectionWaveIncident.geometry.attributes.position.array;
                    const posR = reflectionWaveReflected.geometry.attributes.position.array;
                    const posT = reflectionWaveTransmitted.geometry.attributes.position.array;
                    const posL = waveLine1.geometry.attributes.position.array;
                    for (let i = 0; i < waveParams.points; i++) {
                        const fraction = i / (waveParams.points - 1);
                        const xLeft = (fraction - 1) * waveParams.extent / 2;
                        const xRight = fraction * waveParams.extent / 2;
                        const yI = A0 * Math.sin(k1 * xLeft + phaseT);
                        const yR = r_amp * A0 * Math.sin(-k1 * xLeft + phaseT);
                        const yT = t_amp * A0 * Math.sin(k2 * xRight + phaseT);
                        posI.set([xLeft, yI, 0], i * 3);
                        posR.set([xLeft, yR, 0], i * 3);
                        posT.set([xRight, yT, 0], i * 3);
                        posL.set([xLeft, yI + yR, 0], i * 3);
                    }
                    [reflectionWaveIncident, reflectionWaveReflected, reflectionWaveTransmitted, waveLine1].forEach(line => line.geometry.computeBoundingSphere());
                    reflectionWaveIncident.geometry.attributes.position.needsUpdate = true;
                    reflectionWaveReflected.geometry.attributes.position.needsUpdate = true;
                    reflectionWaveTransmitted.geometry.attributes.position.needsUpdate = true;
                    waveLine1.geometry.attributes.position.needsUpdate = true;
                    const info = document.getElementById('rt-coefs');
                    if (info) {
                        const R = r_amp * r_amp;
                        const T = (n2 / n1) * t_amp * t_amp;
                        info.innerHTML = `r = (n₁−n₂)/(n₁+n₂) = <b>${r_amp.toFixed(3)}</b><br>` +
                                         `t = 2n₁/(n₁+n₂) = <b>${t_amp.toFixed(3)}</b><br>` +
                                         `R = r² = <b>${R.toFixed(3)}</b>, &nbsp; T = (n₂/n₁)t² = <b>${T.toFixed(3)}</b><br>` +
                                         `R + T = <b>${(R + T).toFixed(3)}</b> (should be 1)`;
                    }
                    break;
                }
                case 'beats': {
                    if (!beatsWave1 || !beatsWave2 || !beatsSuperposition) break;
                    const f1 = waveParams.beatFreq1;
                    const f2 = waveParams.beatFreq2;
                    const A_b = 0.6;
                    const v_b = 1.0; // speed: λ = v/f
                    const k1 = 2 * Math.PI * f1 / v_b;
                    const k2 = 2 * Math.PI * f2 / v_b;
                    const omega1 = 2 * Math.PI * f1;
                    const omega2 = 2 * Math.PI * f2;
                    updateWaveGeometry(beatsWave1, 2 * Math.PI / k1, A_b, -omega1 * animationTime * 0.3);
                    updateWaveGeometry(beatsWave2, 2 * Math.PI / k2, A_b, -omega2 * animationTime * 0.3);
                    const p1 = beatsWave1.geometry.attributes.position.array;
                    const p2 = beatsWave2.geometry.attributes.position.array;
                    const ps = beatsSuperposition.geometry.attributes.position.array;
                    const peU = beatsEnvelopeUpper.geometry.attributes.position.array;
                    const peL = beatsEnvelopeLower.geometry.attributes.position.array;
                    const k_mod = (k2 - k1) / 2;
                    const omega_mod = (omega2 - omega1) / 2;
                    for (let i = 0; i < waveParams.points; i++) {
                        const x = (i / (waveParams.points - 1)) * waveParams.extent - (waveParams.extent / 2);
                        ps[i*3] = p1[i*3];
                        ps[i*3+1] = p1[i*3+1] + p2[i*3+1];
                        ps[i*3+2] = 0;
                        const env = 2 * A_b * Math.cos(k_mod * x - omega_mod * animationTime * 0.3);
                        peU[i*3] = x; peU[i*3+1] = env; peU[i*3+2] = 0;
                        peL[i*3] = x; peL[i*3+1] = -env; peL[i*3+2] = 0;
                    }
                    beatsSuperposition.geometry.attributes.position.needsUpdate = true;
                    beatsEnvelopeUpper.geometry.attributes.position.needsUpdate = true;
                    beatsEnvelopeLower.geometry.attributes.position.needsUpdate = true;
                    const info = document.getElementById('beat-readout');
                    if (info) {
                        const fbeat = Math.abs(f1 - f2);
                        const favg = 0.5 * (f1 + f2);
                        info.innerHTML = `f̄ = (f₁+f₂)/2 = <b>${favg.toFixed(3)}</b><br>` +
                                         `f_beat = |f₁ − f₂| = <b>${fbeat.toFixed(3)}</b><br>` +
                                         `T_beat = <b>${(fbeat > 0 ? (1 / fbeat).toFixed(2) : '∞')}</b>`;
                    }
                    break;
                }
                case 'snell': {
                    if (!snellIncidentRay) break;
                    const theta_i = waveParams.snellTheta_i;
                    const n1 = waveParams.snellN1, n2 = waveParams.snellN2;
                    // Snell: sin(θt) = (n1/n2) sin(θi). Total internal reflection if > 1.
                    const sin_t = (n1 / n2) * Math.sin(theta_i);
                    const totalInternal = sin_t > 1;
                    const theta_t = totalInternal ? null : Math.asin(sin_t);
                    const L = waveParams.extent / 2 * 0.9;
                    // Geometry:
                    // Interface is horizontal (y=0); normal is vertical (y-axis).
                    // Incident ray comes from upper-left, hits origin.
                    // Reflected goes to upper-right, refracted goes to lower-right (or back up if TIR).
                    // θ is measured from the normal (y-axis).
                    const setLinePoints = (line, p0, p1) => {
                        const arr = line.geometry.attributes.position.array;
                        arr[0] = p0.x; arr[1] = p0.y; arr[2] = p0.z;
                        arr[3] = p1.x; arr[4] = p1.y; arr[5] = p1.z;
                        line.geometry.attributes.position.needsUpdate = true;
                        line.geometry.computeBoundingSphere();
                    };
                    const origin = new THREE.Vector3(0, 0, 0.1);
                    const inc_start = new THREE.Vector3(-L * Math.sin(theta_i), L * Math.cos(theta_i), 0.1);
                    setLinePoints(snellIncidentRay, inc_start, origin);
                    const refl_end = new THREE.Vector3(L * Math.sin(theta_i), L * Math.cos(theta_i), 0.1);
                    setLinePoints(snellReflectedRay, origin, refl_end);
                    if (totalInternal) {
                        setLinePoints(snellRefractedRay, origin, origin);
                        snellRefractedRay.visible = false;
                    } else {
                        snellRefractedRay.visible = true;
                        const ref_end = new THREE.Vector3(L * Math.sin(theta_t), -L * Math.cos(theta_t), 0.1);
                        setLinePoints(snellRefractedRay, origin, ref_end);
                    }
                    const info = document.getElementById('snell-readout');
                    if (info) {
                        const t_deg = totalInternal ? '— (TIR)' : (theta_t * 180 / Math.PI).toFixed(1) + '°';
                        const critical = (n1 > n2) ? (Math.asin(n2 / n1) * 180 / Math.PI).toFixed(1) + '°' : 'n/a';
                        info.innerHTML = `θᵢ = <b>${(theta_i * 180 / Math.PI).toFixed(1)}°</b><br>` +
                                         `θₜ = <b>${t_deg}</b><br>` +
                                         `Critical angle (n₁→n₂): <b>${critical}</b>` +
                                         (totalInternal ? '<br><span style="color:#e74c3c">Total internal reflection</span>' : '');
                    }
                    break;
                }
                case 'atomic_form_factor':
                case 'form_factor_2_centers': {
                    if (!aff_kInArrow || !aff_kOutArrow || !aff_qArrow) break;
                    const kmag = waveParams.aff_k_in_mag;
                    const a = waveParams.aff_atomSize;
                    const Z = waveParams.aff_Z;
                    // Build vectors (in screen plane, z=0.1)
                    const kIn  = new THREE.Vector3(kmag * Math.cos(waveParams.aff_theta_in),  kmag * Math.sin(waveParams.aff_theta_in),  0);
                    const kOut = new THREE.Vector3(kmag * Math.cos(waveParams.aff_theta_out), kmag * Math.sin(waveParams.aff_theta_out), 0);
                    const Q = new THREE.Vector3().subVectors(kOut, kIn);
                    // Arrow scaling: map k-magnitude (max 10) to visual length max ~3
                    const visScale = 3 / 10;
                    const visK = kmag * visScale;
                    const visQ = Q.length() * visScale;
                    // k_in: drawn ending at the atom (origin). So start = -kIn direction, length |k|.
                    const kInDir = kIn.clone().normalize();
                    aff_kInArrow.position.copy(kInDir.clone().multiplyScalar(-visK)).setZ(0.1);
                    aff_kInArrow.setDirection(kInDir);
                    aff_kInArrow.setLength(visK, Math.min(0.25, 0.25 * visK), 0.15);
                    // k_out: starts at atom, points along kOut, length visK
                    const kOutDir = kOut.clone().normalize();
                    aff_kOutArrow.position.set(0, 0, 0.1);
                    aff_kOutArrow.setDirection(kOutDir);
                    aff_kOutArrow.setLength(visK, Math.min(0.25, 0.25 * visK), 0.15);
                    // Q: also starts at atom (showing Q = k_out - k_in as a vector from the origin)
                    aff_qArrow.position.set(0, 0, 0.1);
                    if (visQ < 1e-3) {
                        aff_qArrow.setLength(0.001, 0, 0);
                    } else {
                        aff_qArrow.setDirection(Q.clone().normalize());
                        aff_qArrow.setLength(visQ, Math.min(0.25, 0.25 * visQ), 0.15);
                    }
                    updateCenterAnnotations();
                    // f(Q) graph
                    drawAffGraph();
                    // Scattering-vector construction inset.
                    drawAffKVectorPhasor(Q);
                    // Numeric readout
                    const readout = document.getElementById('aff-readout');
                    if (readout) {
                        const Qmag = Q.length();
                        const f = aff_singleAtomFormFactor(Qmag, a, Z);
                        if (currentConcept === 'atomic_form_factor') {
                            readout.innerHTML =
                                `|Q| = <b>${Qmag.toFixed(3)}</b><br>` +
                                `f(Q) = <b>${f.toFixed(3)}</b>  (out of Z=${Z})<br>` +
                                `|f|² = <b>${(f*f).toFixed(3)}</b>`;
                        } else {
                            const d_vec = new THREE.Vector3(
                                waveParams.aff_atomDistance * Math.cos(waveParams.aff_atomPairAngle),
                                waveParams.aff_atomDistance * Math.sin(waveParams.aff_atomPairAngle), 0);
                            const Qd = Q.dot(d_vec);
                            const {F, intensity} = twoCenterFormFactor(Qmag, Qd);
                            readout.innerHTML =
                                `d = <b>${waveParams.aff_atomDistance.toFixed(2)}</b>, |Q| = <b>${Qmag.toFixed(3)}</b><br>` +
                                `Δφ = Q·d = <b>${Qd.toFixed(3)} rad</b><br>` +
                                `f per center = <b>${f.toFixed(3)}</b><br>` +
                                `F = 2f cos(Δφ/2) = <b>${F.toFixed(3)}</b><br>` +
                                `Intensity |F|² = <b>${intensity.toFixed(3)}</b><br>` +
                                `<span>Constructive: Δφ = 2πn; destructive: Δφ = (2n+1)π.<br>Graph: radial Q scan along the current Q direction, not a detector-angle scan.</span>`;
                        }
                    }
                    break;
                }
            }
        }

        // Phasor diagram for single-atom mode: Z electron phasors at positions sampled from the cloud
        // Inset showing the scattering geometry as vectors: k_in (blue), k_out (green),
        // Q = k_out − k_in (red). Drawn tip-to-tail with a thin construction line so the
        // triangle relation is visually explicit. Used for both single- and two-atom modes.
        function drawAffKVectorPhasor(Q) {
            if (!phasorCtx) return;
            const w = phasorCanvas.width, h = phasorCanvas.height;
            const cx = w / 2, cy = h / 2 + 4;
            const maxR = Math.min(w / 2 - 8, h / 2 - 14);
            phasorCtx.clearRect(0, 0, w, h);
            // Title
            phasorCtx.fillStyle = '#cccccc';
            phasorCtx.font = '11px Arial';
            phasorCtx.textAlign = 'center';
            phasorCtx.fillText('Scattering geometry: Q = k_out − k_in', cx, 12);
            // k vectors in world units
            const kmag = waveParams.aff_k_in_mag;
            const kIn  = new THREE.Vector2( kmag * Math.cos(waveParams.aff_theta_in),  kmag * Math.sin(waveParams.aff_theta_in));
            const kOut = new THREE.Vector2( kmag * Math.cos(waveParams.aff_theta_out), kmag * Math.sin(waveParams.aff_theta_out));
            // Auto-zoom: scale so the longest of |k_in|, |k_out|, |Q| fits in the inset.
            // Q's magnitude can reach 2|k| (back-scatter), so account for it.
            const maxLen = Math.max(kmag, kmag, Q.length()) || 1;
            const scale = (maxR * 0.85) / maxLen;
            // Convert world (math) → screen: x stays, y flips (canvas y is down).
            // For all three vectors we draw from the origin (cx,cy).
            // Helper to draw an arrow at angle θ with length len (world units).
            function drawArrow(angle_rad, len_world, color, lineWidth) {
                const len = len_world * scale;
                const dx =  Math.cos(angle_rad) * len;
                const dy = -Math.sin(angle_rad) * len; // screen y-flip → CCW for positive angle
                phasorCtx.strokeStyle = color;
                phasorCtx.fillStyle = color;
                phasorCtx.lineWidth = lineWidth;
                phasorCtx.beginPath();
                phasorCtx.moveTo(cx, cy);
                phasorCtx.lineTo(cx + dx, cy + dy);
                phasorCtx.stroke();
                // Arrow head
                const ang = Math.atan2(dy, dx);
                const headLen = 9;
                phasorCtx.beginPath();
                phasorCtx.moveTo(cx + dx, cy + dy);
                phasorCtx.lineTo(cx + dx - headLen * Math.cos(ang - 0.35),
                                 cy + dy - headLen * Math.sin(ang - 0.35));
                phasorCtx.lineTo(cx + dx - headLen * Math.cos(ang + 0.35),
                                 cy + dy - headLen * Math.sin(ang + 0.35));
                phasorCtx.closePath();
                phasorCtx.fill();
            }
            // Construction triangle: draw k_in from origin, then add (−k_in) from k_out's tip,
            // which closes back to the origin. Equivalently: from the tip of k_in, draw a thin
            // line to the tip of k_out — that is Q. We'll instead show the cleaner "vectors from origin"
            // view, with a faint dashed construction line from k_in tip to k_out tip (= Q's geometry).
            // 1) Faint dashed line from k_in tip to k_out tip (length = |Q|, visualizes the relation)
            const kIn_dx  =  Math.cos(waveParams.aff_theta_in)  * kmag * scale;
            const kIn_dy  = -Math.sin(waveParams.aff_theta_in)  * kmag * scale;
            const kOut_dx =  Math.cos(waveParams.aff_theta_out) * kmag * scale;
            const kOut_dy = -Math.sin(waveParams.aff_theta_out) * kmag * scale;
            phasorCtx.strokeStyle = 'rgba(255,255,255,0.35)';
            phasorCtx.setLineDash([3, 3]);
            phasorCtx.lineWidth = 1.6;
            phasorCtx.beginPath();
            phasorCtx.moveTo(cx + kIn_dx, cy + kIn_dy);
            phasorCtx.lineTo(cx + kOut_dx, cy + kOut_dy);
            phasorCtx.stroke();
            phasorCtx.setLineDash([]);
            // 2) |k| reference circle (since |k_in| = |k_out| = kmag, both end on this circle).
            phasorCtx.strokeStyle = 'rgba(255,255,255,0.18)';
            phasorCtx.lineWidth = 1.6;
            phasorCtx.beginPath();
            phasorCtx.arc(cx, cy, kmag * scale, 0, 2 * Math.PI);
            phasorCtx.stroke();
            // 3) The three vectors from the origin
            drawArrow(waveParams.aff_theta_in,  kmag, '#3498db', 3);    // k_in (blue)
            drawArrow(waveParams.aff_theta_out, kmag, '#2ecc71', 3);    // k_out (green)
            // Q angle = atan2(Q.y, Q.x) but be careful with the screen y-flip in drawArrow
            // (drawArrow expects a *math* angle, and uses sin/cos directly with the y-flip).
            const Qang = Math.atan2(Q.y, Q.x);
            if (Q.length() > 1e-4) {
                drawArrow(Qang, Q.length(), '#ffffff', 3.5);             // Q (white)
            }
            // Origin dot
            phasorCtx.fillStyle = 'rgba(255,255,255,0.7)';
            phasorCtx.beginPath();
            phasorCtx.arc(cx, cy, 3, 0, 2 * Math.PI);
            phasorCtx.fill();
            // Labels at the tips
            phasorCtx.font = 'bold 10px Arial';
            phasorCtx.textAlign = 'left';

        function disposeSceneObject(object) {
            if (!object) return;
            const materials = new Set(), geometries = new Set();
            object.traverse(child => {
                const sharedArrowPart = child.parent && child.parent.type === 'ArrowHelper';
                if (child.geometry && !sharedArrowPart) geometries.add(child.geometry);
                if (child.material) (Array.isArray(child.material) ? child.material : [child.material]).forEach(m => materials.add(m));
            });

        function positiveModulo(value, period) { return ((value % period) + period) % period; }

        function dopplerState(time) {
            const c = 3, velocity = waveParams.sourceVelocity * c;
            const span = waveParams.extent * 0.8;
            const sourceX = positiveModulo(velocity * time + span / 2, span) - span / 2;
            const f0 = c / waveParams.wavelength;
            return { sourceX, omega: 2 * Math.PI * f0,
                kLeft: 2 * Math.PI / (waveParams.wavelength * (1 + velocity / c)),
                kRight: 2 * Math.PI / (waveParams.wavelength * (1 - velocity / c)),
                f0, fLeft: f0 / (1 + velocity / c), fRight: f0 / (1 - velocity / c) };
        }

        function dopplerDisplacement(x, time, state = dopplerState(time)) {
            const dx = x - state.sourceX;
            const phase = (dx < 0 ? -state.kLeft : state.kRight) * dx - state.omega * time;
            return waveParams.amplitude * Math.sin(phase);
        }

        function affPairProjection() {
            const qx = Math.cos(waveParams.aff_theta_out) - Math.cos(waveParams.aff_theta_in);
            const qy = Math.sin(waveParams.aff_theta_out) - Math.sin(waveParams.aff_theta_in);
            const length = Math.hypot(qx, qy);
            // At Q=0 choose the limiting direction of an outgoing-angle scan.
            const ux = length > 1e-10 ? qx / length : -Math.sin(waveParams.aff_theta_in);
            const uy = length > 1e-10 ? qy / length : Math.cos(waveParams.aff_theta_in);
            return waveParams.aff_atomDistance * (ux * Math.cos(waveParams.aff_atomPairAngle) + uy * Math.sin(waveParams.aff_atomPairAngle));
        }

        function createSingleWaveObject(color, opacity = 1) { const material = new THREE.LineBasicMaterial({ color: color, transparent: opacity < 1, opacity: opacity }); const geometry = new THREE.BufferGeometry(); const positions = new Float32Array(waveParams.points * 3); geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3)); return new THREE.Line(geometry, material); }
        function updateWaveGeometry(lineObject, wavelength, amplitude, phase, options = {}) { if (!lineObject) { return; } const positions = lineObject.geometry.attributes.position.array; if (wavelength <= 0.001) wavelength = 0.001; const k = (2 * Math.PI) / wavelength; for (let i = 0; i < waveParams.points; i++) { const x_base = (i / (waveParams.points - 1)) * waveParams.extent - (waveParams.extent / 2); const x = x_base - (options.x_offset || 0); let currentAmplitude = amplitude; if(options.attenuation) { currentAmplitude *= Math.exp(-options.attenuation * Math.abs(x_base)); } let y = (options.isEnvelope) ? currentAmplitude * Math.cos(k * x + phase) : currentAmplitude * Math.sin(k * x + phase); positions[i * 3] = x_base; positions[i * 3 + 1] = y; positions[i * 3 + 2] = 0; } lineObject.geometry.attributes.position.needsUpdate = true; lineObject.geometry.computeBoundingSphere(); }
        
        function update3DWaveGeometry(lineObject, origin, direction, magnitude, wavelength, phase, numPoints = 100) {
            if (!lineObject) return;
            let positions = lineObject.geometry.attributes.position.array;
            if (!positions || positions.length !== numPoints * 3) {
                lineObject.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(numPoints * 3), 3));
                positions = lineObject.geometry.attributes.position.array;
            }
            
            const k = (2 * Math.PI) / wavelength;
            const tangent = direction.clone().normalize();
            
            let up = new THREE.Vector3(0, 0, 1);
            if (Math.abs(tangent.z) > 0.95) { up.set(0, 1, 0); }
            const perpendicular = new THREE.Vector3().crossVectors(tangent, up).normalize();
            
            const amplitude = 0.2;

            for (let i = 0; i < numPoints; i++) {
                const distanceAlongPath = (i / (numPoints - 1)) * magnitude;
                const pathPoint = origin.clone().addScaledVector(tangent, distanceAlongPath);
                const sineOffset = amplitude * Math.sin(k * distanceAlongPath + phase);
                const finalPoint = pathPoint.addScaledVector(perpendicular, sineOffset);
                
                positions[i * 3] = finalPoint.x;
                positions[i * 3 + 1] = finalPoint.y;
                positions[i * 3 + 2] = finalPoint.z;
            }
            lineObject.geometry.attributes.position.needsUpdate = true;
            lineObject.geometry.computeBoundingSphere();
        }

        function makeGaussianAtomSprite(a, Z) {
            const canvas = document.createElement('canvas');
            const size = 128;
            canvas.width = canvas.height = size;
            const ctx = canvas.getContext('2d');
            const c = size / 2;
            const imgData = ctx.createImageData(size, size);
            const data = imgData.data;
            // Peak alpha scales with Z so more electrons → denser-looking cloud.
            // Z ranges 1..30 in the UI; map to alpha 0.25..1.0 at the center.
            const peakAlpha = Math.min(1, 0.2 + 0.8 * (Z / 30));
            // Gaussian falls as exp(-r²/a²) but here r is in "sprite radius" units. We map sprite radius=1 → r = 2a (so density at edge ≈ exp(-4) ≈ 0.018).
            for (let py = 0; py < size; py++) {
                for (let px = 0; px < size; px++) {
                    const dx = (px - c) / c; // -1 .. 1
                    const dy = (py - c) / c;
                    const r2 = dx*dx + dy*dy;     // 0..2 across sprite
                    if (r2 > 1) continue;          // outside disc → transparent
                    // r_physical / a == 2 * sqrt(r2)  (since edge of sprite == 2a). So exp(-r_phys²/a²) = exp(-4 r2)
                    const intensity = Math.exp(-4 * r2);
                    const idx = (py * size + px) * 4;
                    data[idx + 0] = 100;             // R
                    data[idx + 1] = 180;             // G
                    data[idx + 2] = 255;             // B (light blue cloud)
                    data[idx + 3] = Math.floor(255 * intensity * peakAlpha);
                }
            }
            ctx.putImageData(imgData, 0, 0);
            const tex = new THREE.CanvasTexture(canvas);
            tex.needsUpdate = true;
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
            const sprite = new THREE.Sprite(mat);
            // Sprite world size: 4a (so visible cloud radius ~ 2a, matching where exp drops to ~e^-4)
            const worldSize = 4 * a;
            sprite.scale.set(worldSize, worldSize, 1);
            return sprite;
        }

        // f(Q) for a Gaussian cloud of width a and Z electrons.
        function aff_singleAtomFormFactor(Q, a, Z) {

        // Draw f(Q) (single-atom) or |F(Q)|² (two-atom) inset graph.
        function isFormFactorConcept(concept) {

        }
        function twoCenterFormFactor(Q, Qd) {
            const f = aff_singleAtomFormFactor(Q, waveParams.aff_atomSize, waveParams.aff_Z);
            const F = 2 * f * Math.cos(Qd / 2);

        function affPlotValue(Q) {
            if (currentConcept === 'atomic_form_factor') return aff_singleAtomFormFactor(Q, waveParams.aff_atomSize, waveParams.aff_Z);

        function drawAffGraph() {
            if (!aff_graphCtx) return;
            const ctx=aff_graphCtx, w=aff_graphCanvas.width, h=aff_graphCanvas.height;
            ctx.clearRect(0,0,w,h);
            const single=currentConcept==='atomic_form_factor';
            const intensity=!single && waveParams.aff_quantity==='intensity';
            const maxQ=2*waveParams.aff_k_in_mag;
            const yMax=single ? waveParams.aff_Z : intensity ? (2*waveParams.aff_Z)**2 : 2*waveParams.aff_Z;
            const yMin=!single && !intensity ? -yMax : 0;
            const left=43,right=w-10,top=32,bottom=h-28;
            const X=q=>left+q/maxQ*(right-left), Y=y=>bottom-(y-yMin)/(yMax-yMin)*(bottom-top);
            ctx.font='10px Arial';ctx.fillStyle='#e2e8f0';ctx.textAlign='center';
            ctx.fillText(single ? 'Atomic form factor f(Q)' : intensity ? 'Two centers: intensity |F|²' : 'Two centers: signed F(Q)', w/2,11);
            ctx.font='9px Arial';ctx.fillText(single ? 'Gaussian density' : 'Fixed Q direction; center spacing d',w/2,23);
            ctx.lineWidth=1;ctx.strokeStyle='#60718b';
            for(const value of [yMin,(yMin+yMax)/2,yMax]) {
                ctx.beginPath();ctx.moveTo(left,Y(value));ctx.lineTo(right,Y(value));ctx.stroke();
                ctx.textAlign='right';ctx.fillText(value.toFixed(0),left-5,Y(value)+3);
            }
            ctx.textAlign='center';
            for(const q of [0,maxQ/2,maxQ])ctx.fillText(q.toFixed(1),X(q),bottom+12);
            ctx.fillText('|Q| (inverse length)',(left+right)/2,h-3);
            ctx.save();ctx.beginPath();ctx.rect(left,top,right-left,bottom-top);ctx.clip();
            ctx.strokeStyle='#facc15';ctx.lineWidth=2.5;ctx.beginPath();
            for(let i=0;i<=400;i++) {
                const q=maxQ*i/400,value=affPlotValue(q);
                if(i)ctx.lineTo(X(q),Y(value));else ctx.moveTo(X(q),Y(value));
            }
            ctx.stroke();
            const q=aff_currentQMagnitude(),value=affPlotValue(q);
            ctx.strokeStyle='#fb7185';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(X(q),top);ctx.lineTo(X(q),bottom);ctx.stroke();
            ctx.fillStyle='#fb7185';ctx.beginPath();ctx.arc(X(q),Y(value),3.5,0,2*Math.PI);ctx.fill();ctx.restore();
        }

        // |Q| from current params
        function aff_currentQMagnitude() {
            const k = waveParams.aff_k_in_mag;
            const kIn  = new THREE.Vector2(k * Math.cos(waveParams.aff_theta_in),  k * Math.sin(waveParams.aff_theta_in));
            const kOut = new THREE.Vector2(k * Math.cos(waveParams.aff_theta_out), k * Math.sin(waveParams.aff_theta_out));

        // Screen-space triangle strips keep line widths reliable on WebGL platforms.

        function updateThickLines() {

            for (const line of lines) {

        function updateAccelerationPlot() {

            const series = [

                {key:'acceleration', label:'a', color:'#f472b6', peak:Math.abs(omega*omega*amplitude), dash:[3,3]},

            ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
