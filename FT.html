<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Fourier Transform Explorer</title>
    <link href="./dist/output.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        .hidden { display: none !important; }
        body {
            font-family: 'Inter', sans-serif;
        }
        .canvas-wrapper {
            background-color: #e5e7eb; /* gray-200 */
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 512px; /* Control max size */
        }
        canvas, video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
        }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .active-btn {
            --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);
            --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(3px + var(--tw-ring-offset-width)) var(--tw-ring-color);
            box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
        }
        #crystal-controls { transition: opacity 0.3s; }
    </style>
</head>
<body class="flex flex-col h-screen bg-gray-100 overflow-hidden">

    <header class="bg-white p-3 shadow-md w-full z-10">
        <div class="container mx-auto">
            <div class="flex items-center flex-wrap gap-4">
                <h1 class="text-xl font-bold text-gray-800 hidden sm:block">2D FT Explorer</h1>
                <div class="flex-grow"></div> <div class="flex items-center gap-3">
                    <button id="use-upload-btn" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 focus:outline-none ring-blue-500 ring-offset-2 transition-all duration-200">
                        Upload Image
                    </button>
                    <button id="use-webcam-btn" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 focus:outline-none ring-green-500 ring-offset-2 transition-all duration-200">
                        Use Webcam
                    </button>
                    <input type="file" id="image-upload" class="hidden" accept="image/png, image/jpeg">
                </div>
                <div id="status" class="text-sm text-gray-600 font-medium">Select a source to begin.</div>
            </div>

            <div id="function-section" class="mt-3">
                <div class="flex items-center flex-wrap gap-4">
                    <select id="function-presets" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2">
                        <option value="">Choose a function or pattern...</option>
                        <optgroup label="Crystallography &amp; Diffraction">
                            <option value="cubic-lattice">Square Lattice (2D)</option>
                            <option value="tetragonal-lattice">Rectangular Lattice (2D)</option>
                            <option value="hexagonal-lattice">Hexagonal Lattice (2D)</option>
                            <option value="diffraction-grating">Diffraction Grating</option>
                            <option value="powder-rings">Powder (randomly oriented crystallites)</option>
                        </optgroup>
                        <optgroup label="Mathematical Functions">
                            <option value="128 * Math.sin(x * 20) + 128">Sine Wave (Vertical)</option>
                            <option value="128 * Math.sin(y * 20) + 128">Sine Wave (Horizontal)</option>
                            <option value="(Math.sin(x * 20) + Math.sin(y * 20)) * 64 + 128">Crosshatch</option>
                            <option value="Math.sqrt(x*x + y*y) < 0.5 ? 255 : 0">Circle Aperture</option>
                            <option value="(Math.abs(x) < 0.3 && Math.abs(y) < 0.3) ? 255 : 0">Square Aperture</option>
                            <option value="Math.random() * 255">Random Noise</option>
                        </optgroup>
                        <optgroup label="Optics &amp; Signal Processing">
                            <option value="255 * Math.exp(-(x*x + y*y) * 10)">Gaussian</option>
                            <option value="(Math.abs(x) < 0.015 && Math.abs(y) <= 1) ? 255 : 0">Single Slit</option>
                            <option value="(Math.abs(y) <=1 && (Math.abs(x - 0.2) < 0.05 || Math.abs(x + 0.2) < 0.05)) ? 255 : 0">Double Slit</option>
                            <option value="(r => r > 0.4 && r < 0.6 ? 255 : 0)(Math.sqrt(x*x+y*y))">Annulus / Ring Aperture</option>
                            <option value="Math.sin((x*x + y*y) * 100) > 0 ? 255 : 0">Fresnel Zone Plate</option>
                        </optgroup>
                    </select>

                    <input type="text" id="function-input" placeholder="...or type a function to auto-generate" class="flex-grow p-2 border rounded-lg" style="min-width: 200px;">
                    
                    <div class="flex items-center gap-2">
                        <label for="sigma-slider" class="text-sm font-medium text-gray-700">Gaussian window σ</label>
                        <input type="range" id="sigma-slider" min="0.1" max="1.5" value="0.4" step="0.05" class="w-24">
                        <span id="sigma-value" class="text-sm font-semibold w-8 text-left text-gray-800">0.4</span>
                    </div>
                </div>

                <div id="crystal-controls" class="hidden mt-3 p-3 bg-gray-50 rounded-lg flex items-center justify-start flex-wrap gap-x-6 gap-y-2">
                    <div class="flex items-center gap-2">
                        <label for="motif-type" class="text-sm font-medium">Motif:</label>
                        <select id="motif-type" class="bg-white border border-gray-300 text-sm rounded-md p-1">
                            <option value="point">Point</option>
                            <option value="duck">Duck</option>
                            <option value="circle" selected>Circle</option>
                            <option value="square">Square</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <label for="motif-size" class="text-sm font-medium">Motif Size:</label>
                        <input type="range" id="motif-size" min="1" max="20" value="8" class="w-24">
                        <span id="motif-size-value" class="text-sm font-semibold w-4">8</span>
                    </div>
                     <div class="flex items-center gap-2">
                        <label for="cell-size" class="text-sm font-medium">Cell Size:</label>
                        <input type="range" id="cell-size" min="10" max="100" value="40" class="w-24">
                        <span id="cell-size-value" class="text-sm font-semibold w-6">40</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 md:p-6 grid grid-cols-1 md:grid-cols-2 gap-6 items-center justify-items-center overflow-auto">
        <div class="w-full flex flex-col items-center">
            <h3 class="text-lg font-semibold text-center mb-3 text-gray-700">Source (Direct Space)</h3>
            <div class="canvas-wrapper">
                <video id="webcam-video" class="hidden" autoplay playsinline></video>
                <canvas id="sourceCanvas"></canvas>
            </div>
        </div>
        <div class="w-full flex flex-col items-center">
            <h3 class="text-lg font-semibold text-center mb-3 text-gray-700">Fourier Transform (Reciprocal Space)</h3>
            <div class="canvas-wrapper">
                <canvas id="fftCanvas"></canvas>
            </div>
        </div>
    </main>

    <footer class="w-full p-3 bg-white border-t border-gray-200">
        <div class="container mx-auto text-xs text-gray-600 flex justify-between items-center">
            <p>Log FFT magnitude of grayscale × Gaussian window; σ is relative to the image half-width. Red scale bars are display annotations only.</p>
            <p class="text-right font-medium">NitaD, Univ. Paris-Saclay, 1 May 2025</p>
        </div>
    </footer>
    
    <script>
        // --- DOM Elements ---
        const useUploadBtn = document.getElementById('use-upload-btn');
        const useWebcamBtn = document.getElementById('use-webcam-btn');
        const imageUpload = document.getElementById('image-upload');
        const statusEl = document.getElementById('status');
        const webcamVideo = document.getElementById('webcam-video');
        const sourceCanvas = document.getElementById('sourceCanvas');
        const fftCanvas = document.getElementById('fftCanvas');
        const sourceCtx = sourceCanvas.getContext('2d', { willReadFrequently: true });
        const fftCtx = fftCanvas.getContext('2d');
        const functionInput = document.getElementById('function-input');
        const functionPresets = document.getElementById('function-presets');
        const crystalControls = document.getElementById('crystal-controls');
        const motifTypeSelect = document.getElementById('motif-type');
        const motifSizeSlider = document.getElementById('motif-size');
        const cellSizeSlider = document.getElementById('cell-size');
        const motifSizeValue = document.getElementById('motif-size-value');
        const cellSizeValue = document.getElementById('cell-size-value');
        const sigmaSlider = document.getElementById('sigma-slider');
        const sigmaValue = document.getElementById('sigma-value');

        // --- Constants & State ---
        const FFT_SIZE = 512;
        sourceCanvas.width = sourceCanvas.height = FFT_SIZE;
        fftCanvas.width = fftCanvas.height = FFT_SIZE;

        let currentMode = null;
        let webcamStream = null;
        let sourceImage = null;
        let cleanFunctionImage = null;
        let sourceReady = false;
        let sourceRevision = 0;
        let webcamRequestPending = false;
        let isTransforming = false;
        let animationFrameId = null;
        
        const CRYSTAL_PRESETS = [
            'cubic-lattice', 'tetragonal-lattice', 'hexagonal-lattice',
            'diffraction-grating', 'powder-rings'
        ];

        // --- DEBOUNCE UTILITY ---
        function debounce(func, delay) {
            let timeout = null;
            function debounced(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => { timeout = null; func(...args); }, delay);
            }
            debounced.cancel = () => { clearTimeout(timeout); timeout = null; };
            return debounced;
        }
        const debouncedTransform = debounce(() => {
            if (currentMode !== 'webcam' && sourceReady) performTransform();
        }, 50);

        // --- FUNCTION DEFINITIONS ---
        function regenerateCrystalIfActive() {
            const currentPreset = functionPresets.value;
            if (currentMode === 'function' && CRYSTAL_PRESETS.includes(currentPreset)) {
                generateCrystalPattern(currentPreset);
            }
        }

        function setupMode(mode) {
            sourceRevision++;
            debouncedGenerate.cancel();
            debouncedTransform.cancel();
            currentMode = mode;
            sourceReady = false;
            cleanFunctionImage = null;
            sourceCtx.clearRect(0, 0, FFT_SIZE, FFT_SIZE);
            fftCtx.clearRect(0, 0, FFT_SIZE, FFT_SIZE);
            stopTransformLoop();
            [useUploadBtn, useWebcamBtn].forEach(btn => btn.classList.remove('active-btn'));
            crystalControls.classList.add('hidden');
            functionPresets.value = '';
            
            if (mode === 'upload') {
                stopWebcam();
                webcamVideo.classList.add('hidden');
                sourceCanvas.classList.remove('hidden');
                useUploadBtn.classList.add('active-btn');
                statusEl.textContent = 'Select an image file to begin.';
            } else if (mode === 'webcam') {
                stopWebcam();
                useWebcamBtn.classList.add('active-btn');
                startWebcam();
            } else if (mode === 'function') {
                stopWebcam();
                webcamVideo.classList.add('hidden');
                sourceCanvas.classList.remove('hidden');
                statusEl.textContent = 'Choose a preset or type a function.';
            }
        }
        
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            setupMode('upload');
            const revision = sourceRevision;
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                URL.revokeObjectURL(url);
                if (revision !== sourceRevision || currentMode !== 'upload') return;
                sourceImage = img;
                sourceReady = true;
                performTransform();
            };
            img.onerror = () => {
                URL.revokeObjectURL(url);
                if (revision === sourceRevision) statusEl.textContent = 'Could not read this image.';
            };
            img.src = url;
            imageUpload.value = '';
        }

        function generateFromFunction() {
            if (currentMode !== 'function') return;
            const fnBody = functionInput.value;
            if (!fnBody) { 
                statusEl.textContent = 'Please enter a function.'; 
                sourceCtx.fillStyle = '#e5e7eb';
                sourceCtx.fillRect(0, 0, FFT_SIZE, FFT_SIZE);
                fftCtx.fillStyle = '#e5e7eb';
                fftCtx.fillRect(0, 0, FFT_SIZE, FFT_SIZE);
                return;
            }
            try {
                const safeFn = new Function('x', 'y', 'Math', `return ${fnBody}`);
                const imageData = sourceCtx.createImageData(FFT_SIZE, FFT_SIZE);
                for (let j = 0; j < FFT_SIZE; j++) {
                    for (let i = 0; i < FFT_SIZE; i++) {
                        const x = (i - FFT_SIZE / 2) / (FFT_SIZE / 2);
                        const y = (j - FFT_SIZE / 2) / (FFT_SIZE / 2);
                        const value = safeFn(x, y, Math);
                        if (typeof value !== 'number' || !Number.isFinite(value)) {
                            throw new Error('The expression must return a finite number at every pixel.');
                        }
                        const color = Math.max(0, Math.min(255, value));
                        const idx = (j * FFT_SIZE + i) * 4;
                        imageData.data.set([color, color, color, 255], idx);
                    }
                }
                cleanFunctionImage = imageData;
                sourceReady = true;
                sourceCtx.putImageData(imageData, 0, 0);
                performTransform();
            } catch (e) {
                sourceReady = false;
                cleanFunctionImage = null;
                sourceCtx.clearRect(0, 0, FFT_SIZE, FFT_SIZE);
                fftCtx.clearRect(0, 0, FFT_SIZE, FFT_SIZE);
                statusEl.textContent = `Invalid function: ${e.message}`;
                console.error("Function parsing error:", e);
            }
        }

        // --- EVENT LISTENERS AND INITIALIZATION ---
        useUploadBtn.addEventListener('click', () => { imageUpload.click(); });
        useWebcamBtn.addEventListener('click', () => {
            if (currentMode !== 'webcam' || (!webcamStream && !webcamRequestPending)) setupMode('webcam');
        });
        imageUpload.addEventListener('change', handleImageUpload);

        functionPresets.addEventListener('change', () => {
            const value = functionPresets.value;
            if (value === "") {
                crystalControls.classList.add('hidden');
                return;
            }
            setupMode('function');
            functionPresets.value = value;
            crystalControls.classList.add('hidden');

            if (CRYSTAL_PRESETS.includes(value)) {
                functionInput.value = ''; 
                crystalControls.classList.remove('hidden');
                generateCrystalPattern(value);
            } else {
                functionInput.value = value;
                generateFromFunction();
            }
        });

        const debouncedGenerate = debounce(generateFromFunction, 400);

        functionInput.addEventListener('input', () => {
            setupMode('function');
            debouncedGenerate();
        });
        
        motifTypeSelect.addEventListener('change', regenerateCrystalIfActive);
        motifSizeSlider.addEventListener('input', () => {
            motifSizeValue.textContent = motifSizeSlider.value;
            regenerateCrystalIfActive();
        });
        cellSizeSlider.addEventListener('input', () => {
            cellSizeValue.textContent = cellSizeSlider.value;
            regenerateCrystalIfActive();
        });

        sigmaSlider.addEventListener('input', () => {
            sigmaValue.textContent = sigmaSlider.value;
            if (currentMode !== 'webcam') {
                debouncedTransform();
            }
        });

        setupMode('upload');

        // --- FULL IMPLEMENTATIONS OF OTHER FUNCTIONS ---
        function generateCrystalPattern(patternType) {
            statusEl.textContent = 'Generating pattern...';
            const motifType = motifTypeSelect.value;
            const motifSize = parseInt(motifSizeSlider.value);
            const cellSize = parseInt(cellSizeSlider.value);
            sourceCtx.fillStyle = 'black';
            sourceCtx.fillRect(0, 0, FFT_SIZE, FFT_SIZE);
            sourceCtx.save();
            sourceCtx.translate(FFT_SIZE / 2, FFT_SIZE / 2);
            sourceCtx.fillStyle = 'white';
            switch (patternType) {
                case 'cubic-lattice': {
                    for (let x = -FFT_SIZE / 2; x < FFT_SIZE / 2; x += cellSize) {
                        for (let y = -FFT_SIZE / 2; y < FFT_SIZE / 2; y += cellSize) {
                            drawMotif(sourceCtx, motifType, x, y, motifSize);
                        }
                    }
                    break;
                }
                case 'tetragonal-lattice': {
                    const spacingY = Math.round(cellSize * 0.7);
                    for (let x = -FFT_SIZE / 2; x < FFT_SIZE / 2; x += cellSize) {
                        for (let y = -FFT_SIZE / 2; y < FFT_SIZE / 2; y += spacingY) {
                            drawMotif(sourceCtx, motifType, x, y, motifSize);
                        }
                    }
                    break;
                }
                case 'hexagonal-lattice': {
                    const a = cellSize;
                    const v1 = { x: a, y: 0 };
                    const v2 = { x: a * 0.5, y: a * Math.sqrt(3) / 2 };
                    const nx = Math.ceil(FFT_SIZE / a) * 2;
                    const ny = Math.ceil(FFT_SIZE / (a * Math.sqrt(3) / 2)) * 2;
                    for (let i = -nx; i <= nx; i++) {
                        for (let j = -ny; j <= ny; j++) {
                            const x = i * v1.x + j * v2.x;
                            const y = i * v1.y + j * v2.y;
                            if (Math.abs(x) <= FFT_SIZE / 2 + a && Math.abs(y) <= FFT_SIZE / 2 + a) {
                                drawMotif(sourceCtx, motifType, x, y, motifSize);
                            }
                        }
                    }
                    break;
                }
                case 'diffraction-grating': {
                    const width = motifSize;
                    sourceCtx.restore(); 
                    sourceCtx.save();
                    sourceCtx.fillStyle = 'white';
                    for (let x = width; x < FFT_SIZE; x += cellSize) {
                         sourceCtx.fillRect(x, 0, width, FFT_SIZE);
                    }
                    break;
                }
                case 'powder-rings': {
                    // Many tiny crystals (square lattice, spacing = cell size), each rotated at random:
                    // the lattice peaks of all orientations smear into rings of radius 1/d.
                    const patchCells = Math.max(2, Math.min(6, Math.round(120 / cellSize)));
                    const reach = Math.ceil(patchCells / 2);
                    for (let c = 0; c < 60; c++) {
                        const cx = (Math.random() - 0.5) * (FFT_SIZE - 2 * reach * cellSize);
                        const cy = (Math.random() - 0.5) * (FFT_SIZE - 2 * reach * cellSize);
                        sourceCtx.save();
                        sourceCtx.translate(cx, cy);
                        sourceCtx.rotate(Math.random() * 2 * Math.PI);
                        for (let i = -reach; i <= reach; i++) {
                            for (let j = -reach; j <= reach; j++) drawMotif(sourceCtx, motifType, i * cellSize, j * cellSize, motifSize);
                        }
                        sourceCtx.restore();
                    }
                    break;
                }
            }
            sourceCtx.restore();
            cleanFunctionImage = sourceCtx.getImageData(0, 0, FFT_SIZE, FFT_SIZE);
            sourceReady = true;
            performTransform();
        }
        // Annotates the real-space lattice vectors a1, a2 (red arrows, top-left of the image) and the
        // matching reciprocal vectors b1, b2 (arrows from the centre of the transform).
        // Convention here: b_i . a_j = delta_ij, in cycles per pixel; a peak at frequency f lies
        // FFT_SIZE * f pixels from the centre of the transform.
        function latticeVectors(type, d) {
            switch (type) {
                case 'cubic-lattice': return [[d, 0], [0, d]];
                case 'tetragonal-lattice': return [[d, 0], [0, Math.round(d * 0.7)]];   // same spacing as the generator
                case 'hexagonal-lattice': return [[d, 0], [d * 0.5, d * Math.sqrt(3) / 2]];
                default: return [[d, 0]];   // grating and powder: only the spacing d is meaningful
            }
        }
        function reciprocalVectors(v) {
            if (v.length === 1) { const len2 = v[0][0] ** 2 + v[0][1] ** 2; return [[v[0][0] / len2, v[0][1] / len2]]; }
            const det = v[0][0] * v[1][1] - v[0][1] * v[1][0];
            return [[v[1][1] / det, -v[1][0] / det], [-v[0][1] / det, v[0][0] / det]];   // rows of the inverse matrix
        }
        function arrow(ctx, x0, y0, dx, dy, label) {
            const len = Math.hypot(dx, dy); if (len < 1e-6) return;
            const ux = dx / len, uy = dy / len, head = Math.min(8, len * 0.5);
            ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + dx, y0 + dy);
            ctx.moveTo(x0 + dx, y0 + dy); ctx.lineTo(x0 + dx - head * (ux + 0.5 * uy), y0 + dy - head * (uy - 0.5 * ux));
            ctx.moveTo(x0 + dx, y0 + dy); ctx.lineTo(x0 + dx - head * (ux - 0.5 * uy), y0 + dy - head * (uy + 0.5 * ux));
            ctx.stroke();
            ctx.fillText(label, x0 + dx + (dx >= 0 ? 4 : -22), y0 + dy + (dy > 0 ? 14 : -6));
        }
        function drawScaleBars() {
            const d = parseInt(cellSizeSlider.value);
            if (!d) return;
            const type = functionPresets.value;
            const a = latticeVectors(type, d), b = reciprocalVectors(a);
            const origin = 30, centre = FFT_SIZE / 2;
            for (const ctx of [sourceCtx, fftCtx]) { ctx.strokeStyle = 'red'; ctx.fillStyle = 'red'; ctx.lineWidth = 1.5; ctx.font = '14px Inter'; }
            a.forEach((v, i) => arrow(sourceCtx, origin, origin, v[0], v[1], a.length > 1 ? `a${i + 1}` : 'd'));
            if (type === 'powder-rings') {
                // Randomly oriented crystals: the diffraction peaks of every orientation fall on a ring of radius 1/d.
                fftCtx.setLineDash([5, 4]);
                fftCtx.beginPath(); fftCtx.arc(centre, centre, FFT_SIZE * b[0][0], 0, 2 * Math.PI); fftCtx.stroke();
                fftCtx.setLineDash([]);
                fftCtx.fillText('1/d', centre + FFT_SIZE * b[0][0] + 4, centre - 6);
            } else {
                b.forEach((v, i) => arrow(fftCtx, centre, centre, FFT_SIZE * v[0], FFT_SIZE * v[1], b.length > 1 ? `b${i + 1}` : '1/d'));
            }
        }
        function drawMotif(ctx, type, x, y, size) {
            switch(type) {
                case 'point': ctx.fillRect(Math.round(x), Math.round(y), 1, 1); break; 
                case 'duck': drawDuck(ctx, x, y, size); break;
                case 'circle': ctx.beginPath(); ctx.arc(x, y, size * 1.5, 0, 2 * Math.PI); ctx.fill(); break;
                case 'square': ctx.fillRect(x - size, y - size, size * 2, size * 2); break;
            }
        }
        function drawDuck(ctx, x, y, size) {
            ctx.save(); ctx.translate(x, y); ctx.beginPath();
            ctx.arc(0, 0, size * 1.2, Math.PI * 0.2, Math.PI * 1.8);
            ctx.lineTo(size * 1.5, -size * 1.5);
            ctx.arc(size * 1.5, -size * 1.5, size * 0.6, 0, Math.PI * 2);
            ctx.closePath(); ctx.fill(); ctx.restore();
        }
        async function startWebcam() {
            if (webcamStream || webcamRequestPending || currentMode !== 'webcam') return;
            const revision = sourceRevision;
            webcamRequestPending = true;
            statusEl.textContent = 'Requesting webcam...';
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('Webcam access unavailable.');
                }
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                if (revision !== sourceRevision || currentMode !== 'webcam') {
                    stream.getTracks().forEach(track => track.stop());
                    return;
                }
                webcamRequestPending = false;
                webcamStream = stream;
                // Show the exact same letterboxed pixels that are transformed.
                webcamVideo.classList.add('hidden');
                sourceCanvas.classList.remove('hidden');
                webcamVideo.onloadeddata = () => {
                    if (revision !== sourceRevision || webcamStream !== stream || isTransforming) return;
                    sourceReady = true;
                    isTransforming = true;
                    transformLoop();
                };
                webcamVideo.srcObject = stream;
                statusEl.textContent = 'Waiting for webcam frames...';
            } catch (err) {
                if (revision !== sourceRevision) return;
                webcamRequestPending = false;
                setupMode('upload');
                statusEl.textContent = 'Could not access webcam. Upload an image or choose a pattern.';
            }
        }
        function stopWebcam() {
            webcamRequestPending = false;
            webcamVideo.onloadeddata = null;
            webcamVideo.srcObject = null;
            if (webcamStream) {
                webcamStream.getTracks().forEach(track => track.stop());
                webcamStream = null;
            }
        }
        function drawSourceToCanvas(source) { 
            sourceCtx.fillStyle = '#000'; sourceCtx.fillRect(0, 0, FFT_SIZE, FFT_SIZE); 
            const sW = source.videoWidth || source.naturalWidth || source.width;
            const sH = source.videoHeight || source.naturalHeight || source.height;
            if (!(sW > 0 && sH > 0)) return false; 
            const r = Math.min(FFT_SIZE / sW, FFT_SIZE / sH); 
            const cX = (FFT_SIZE - sW * r) / 2, cY = (FFT_SIZE - sH * r) / 2; 
            sourceCtx.drawImage(source, 0, 0, sW, sH, cX, cY, sW * r, sH * r);
            return true; 
        }
        function transformLoop() { 
            if (!isTransforming) return; 
            if (webcamVideo.readyState >= 2) performTransform();
            animationFrameId = requestAnimationFrame(transformLoop); 
        }
        function stopTransformLoop() { 
            isTransforming = false; if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; } 
        }
        function performTransform() {
            if (!sourceReady) return;
            if (currentMode === 'webcam') {
                if (!drawSourceToCanvas(webcamVideo)) return;
            } else if (currentMode === 'upload') {
                if (!sourceImage || !drawSourceToCanvas(sourceImage)) return;
            } else if (currentMode === 'function') {
                if (!cleanFunctionImage) return;
                // Restore unannotated pixels before every transform.
                sourceCtx.putImageData(cleanFunctionImage, 0, 0);
            }
            
            const imageData = sourceCtx.getImageData(0, 0, FFT_SIZE, FFT_SIZE);
            const sigma = parseFloat(sigmaSlider.value);
            const N = FFT_SIZE, re = new Float64Array(N * N), im = new Float64Array(N * N);
            for (let y = 0; y < N; y++) {
                const ny = (y - N / 2) / (N / 2);
                for (let x = 0; x < N; x++) {
                    const i = (y * N + x) * 4;
                    const gray = 0.299 * imageData.data[i] + 0.587 * imageData.data[i + 1] + 0.114 * imageData.data[i + 2];
                    const nx = (x - N / 2) / (N / 2);
                    // Gaussian window: suppresses the streaks caused by the abrupt image edges
                    re[y * N + x] = gray * Math.exp(-(nx * nx + ny * ny) / (2 * sigma * sigma));
                }
            }

            fft2d(re, im);

            // Magnitude with the zero frequency moved to the centre (fftshift): the sample at
            // (x, y) is displayed at ((x + N/2) mod N, (y + N/2) mod N).
            const mag = new Float64Array(N * N);
            let maxMag = 0;
            const half = N / 2;
            for (let y = 0; y < N; y++) {
                for (let x = 0; x < N; x++) {
                    const m = Math.hypot(re[y * N + x], im[y * N + x]);
                    mag[((y + half) % N) * N + ((x + half) % N)] = m;
                    if (m > maxMag) maxMag = m;
                }
            }

            const fftImageData = fftCtx.createImageData(N, N);
            const maxLogMag = Math.log(1 + maxMag);
            for (let p = 0; p < N * N; p++) {
                const intensity = maxLogMag > 0 ? (Math.log(1 + mag[p]) / maxLogMag) * 255 : 0;
                fftImageData.data.set([intensity, intensity, intensity, 255], p * 4);
            }
            fftCtx.putImageData(fftImageData, 0, 0);

            if (currentMode === 'function' && CRYSTAL_PRESETS.includes(functionPresets.value)) {
                drawScaleBars();
            }
            statusEl.textContent = currentMode === 'webcam' ? 'Live transform running...' : 'Transform complete.';
        }
        window.addEventListener('beforeunload', () => {
            sourceRevision++;
            debouncedGenerate.cancel(); debouncedTransform.cancel();
            stopTransformLoop(); stopWebcam();
        });
        // --- Fast Fourier transform (iterative radix-2, in place, typed arrays) ---
        // Tables are computed once: bit-reversal permutation and the twiddle factors exp(-2*pi*i*m/N).
        const FFT_REV = new Uint32Array(FFT_SIZE);
        const FFT_COS = new Float64Array(FFT_SIZE / 2), FFT_SIN = new Float64Array(FFT_SIZE / 2);
        (function initFftTables() {
            const bits = Math.log2(FFT_SIZE);
            for (let i = 0; i < FFT_SIZE; i++) {
                let r = 0;
                for (let b = 0; b < bits; b++) if (i & (1 << b)) r |= 1 << (bits - 1 - b);
                FFT_REV[i] = r;
            }
            for (let m = 0; m < FFT_SIZE / 2; m++) {
                FFT_COS[m] = Math.cos(2 * Math.PI * m / FFT_SIZE);
                FFT_SIN[m] = -Math.sin(2 * Math.PI * m / FFT_SIZE);
            }
        })();
        // Transforms the FFT_SIZE samples re[off + i*stride], im[off + i*stride].
        function fft1d(re, im, off, stride) {
            const n = FFT_SIZE;
            for (let i = 0; i < n; i++) {
                const j = FFT_REV[i];
                if (j > i) {
                    const a = off + i * stride, b = off + j * stride;
                    let t = re[a]; re[a] = re[b]; re[b] = t;
                    t = im[a]; im[a] = im[b]; im[b] = t;
                }
            }
            for (let size = 2; size <= n; size <<= 1) {
                const half = size >> 1, tstep = n / size;
                for (let start = 0; start < n; start += size) {
                    for (let k = 0; k < half; k++) {
                        const wr = FFT_COS[k * tstep], wi = FFT_SIN[k * tstep];
                        const a = off + (start + k) * stride, b = off + (start + k + half) * stride;
                        const tr = wr * re[b] - wi * im[b], ti = wr * im[b] + wi * re[b];
                        re[b] = re[a] - tr; im[b] = im[a] - ti;
                        re[a] += tr; im[a] += ti;
                    }
                }
            }
        }
        // 2D transform of an FFT_SIZE x FFT_SIZE image stored row by row: rows first, then columns.
        function fft2d(re, im) {
            const n = FFT_SIZE;
            for (let y = 0; y < n; y++) fft1d(re, im, y * n, 1);
            for (let x = 0; x < n; x++) fft1d(re, im, x, n);
        }
    </script>
