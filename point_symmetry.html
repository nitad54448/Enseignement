        // Γ_pos, Γ_3N and Γ_vib for the current set of positions.
        function computeGammas(A) {
            const N = state.positions.length;
            const P = state.positions.map(({ pos }) => [pos.x, pos.y, pos.z]);
            const repOp = [];
            state.posOfOp.forEach((k, i) => { if (repOp[k] === undefined) repOp[k] = i; });
            const permutationOf = g => repOp.map(h => state.posOfOp[A.mult[g][h]]);

            // Orthonormal basis of rigid motions (translations + rotations) in the 3N displacement space.
            const raw = [];
            for (let a = 0; a < 3; a++) {
                const t = new Float64Array(3 * N);
                for (let k = 0; k < N; k++) t[3 * k + a] = 1;
                raw.push(t);
            }
            for (let a = 0; a < 3; a++) {
                const e = [0, 0, 0]; e[a] = 1;
                const r = new Float64Array(3 * N);
                P.forEach((p, k) => { const c = vec.cross(e, p); r.set(c, 3 * k); });
                raw.push(r);
            }
            const basis = [];
            raw.forEach(v => {
                const w = Float64Array.from(v);
                const n0 = Math.sqrt(w.reduce((s, x) => s + x * x, 0));
                basis.forEach(q => {
                    const d = q.reduce((s, x, j) => s + x * w[j], 0);
                    for (let j = 0; j < w.length; j++) w[j] -= d * q[j];
                });
                const n = Math.sqrt(w.reduce((s, x) => s + x * x, 0));
                if (n > 1e-9 + 1e-7 * n0) basis.push(w.map(x => x / n));
            });

            const pos = [], full = [], vib = [];
            A.classes.forEach(cls => {
                const g = cls[0];
                const op = A.ops[g];
                const perm = permutationOf(g);
                const fixed = perm.filter((k2, k) => k2 === k).length;
                let rigid = 0;
                basis.forEach(q => {
                    for (let k = 0; k < N; k++) {
                        const v = M3.apply(op.m, [q[3 * k], q[3 * k + 1], q[3 * k + 2]]);
                        const t = 3 * perm[k];
                        rigid += q[t] * v[0] + q[t + 1] * v[1] + q[t + 2] * v[2];
                    }
                });
                const chi3N = fixed * M3.trace(op.m);
                pos.push(fixed);
                full.push(Math.round(chi3N));
                vib.push(Math.round(chi3N - rigid));
            });
            return { pos, full, vib, N };
        }
        function updateGammaRows() {
            const el = byId('tab-characters');

        // ---------- Stereogram tab ----------
        const stereoOptions = { elements: true, points: true };
        function renderStereogramTab() {

        function exportStereogram() {
            const svg = byId('stereo-svg').querySelector('svg');
            if (!svg) return;
            const copy = svg.cloneNode(true);
            copy.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            copy.setAttribute('width', '600');
            copy.setAttribute('height', '600');
            copy.setAttribute('font-family', 'STIX Two Text, Times New Roman, serif');
            copy.removeAttribute('class');
            copy.insertAdjacentHTML('afterbegin', '<rect x="-1.25" y="-1.25" width="2.5" height="2.5" fill="#111827"/>');
            downloadFile(`stereogram_${state.groupKey.replace('/', '-')}.svg`, new XMLSerializer().serializeToString(copy), 'image/svg+xml');
        }
        const project = d => [d[0] / (1 + Math.abs(d[2])), d[1] / (1 + Math.abs(d[2]))];
        function greatCirclePath(n) {
            let t = [-n[1], n[0], 0];
            const tl = Math.hypot(t[0], t[1]);
            if (tl < 1e-9) return null; // horizontal plane: the primitive circle itself
            t = t.map(v => v / tl);
            let h = vec.cross(n, t);
            if (h[2] < 0) h = h.map(v => -v);
            const pts = [];
            for (let k = 0; k <= 120; k++) {
                const a = Math.PI * k / 120;
                const [X, Y] = project([0, 1, 2].map(j => Math.cos(a) * t[j] + Math.sin(a) * h[j]));
                pts.push(`${fmt(X)} ${fmt(-Y)}`);
            }
            return `M${pts.join('L')}`;
        }
        function drawStereogram() {
            const host = byId('stereo-svg');
            if (!host) return;
            const A = currentAnalysis();
            const E = A.elements;
            const horizontalMirror = E.planes.some(p => Math.abs(Math.abs(p.normal[2]) - 1) < 1e-6);
            const parts = [];
            parts.push(`<circle r="1" fill="#111827" stroke="${horizontalMirror && stereoOptions.elements ? cssColor(MIRROR_COLOR) : '#6b7280'}" stroke-width="${horizontalMirror && stereoOptions.elements ? 0.02 : 0.008}"/>`);
            parts.push('<g stroke="#4b5563" stroke-width="0.006"><line x1="1.03" y1="0" x2="1.1" y2="0"/><line x1="0" y1="-1.03" x2="0" y2="-1.1"/></g>');
            parts.push('<g fill="#9ca3af" font-size="0.1" font-style="italic" text-anchor="middle"><text x="1.17" y="0.035">x</text><text x="0" y="-1.14">y</text></g>');
            if (stereoOptions.elements) {
                E.planes.forEach(p => {
                    const path = greatCirclePath(p.normal);
                    if (path) parts.push(`<path d="${path}" fill="none" stroke="${cssColor(MIRROR_COLOR)}" stroke-width="0.018" stroke-linejoin="round"/>`);
                });
                E.axes.forEach(a => {
                    const color = cssColor(a.color);
                    if (Math.abs(a.dir[2]) < 1e-6) {
                        // In-plane axis: draw its trace unless a vertical mirror already draws that diameter.
                        const onMirror = E.planes.some(pl => Math.abs(pl.normal[2]) < 1e-6 && Math.abs(pl.normal[0] * a.dir[0] + pl.normal[1] * a.dir[1]) < 1e-6);
                        if (!onMirror) parts.push(`<line x1="${fmt(-a.dir[0])}" y1="${fmt(a.dir[1])}" x2="${fmt(a.dir[0])}" y2="${fmt(-a.dir[1])}" stroke="${color}" stroke-width="0.007" stroke-dasharray="0.03 0.02" opacity="0.8"/>`);
                        [1, -1].forEach(s => {
                            const X = s * a.dir[0], Y = s * a.dir[1];
                            parts.push(glyphSVG(a.symbol, X, -Y, -Math.atan2(Y, X) * 180 / Math.PI, color, 0.068));
                        });
                    } else {
                        const d = a.dir[2] > 0 ? a.dir : a.dir.map(v => -v);
                        const [X, Y] = project(d);
                        const centred = Math.hypot(X, Y) < 1e-6;
                        parts.push(glyphSVG(a.symbol, X, -Y, centred ? 0 : -Math.atan2(Y, X) * 180 / Math.PI, color, 0.068));
                    }
                });
                const centreTaken = E.axes.some(a => Math.abs(Math.abs(a.dir[2]) - 1) < 1e-6);
                if (E.inversion && !centreTaken) parts.push(glyphSVG('-1', 0, 0, 0, '#f9fafb', 0.065));
            }
            let note = '';
            if (stereoOptions.points) {
                let skipped = 0;
                state.positions.forEach(({ pos, parities }) => {
                    const L = Math.hypot(pos.x, pos.y, pos.z);
                    if (L < 1e-6) { skipped++; return; }
                    const d = [pos.x / L, pos.y / L, pos.z / L];
                    const [X, Y] = project(d);
                    const color = parities.size > 1 ? '#c084fc' : parities.has(true) ? '#ef4444' : '#3b82f6';
                    if (d[2] > -1e-6) parts.push(`<circle cx="${fmt(X)}" cy="${fmt(-Y)}" r="0.03" fill="${color}"/>`);
                    if (d[2] < 1e-6) parts.push(`<circle cx="${fmt(X)}" cy="${fmt(-Y)}" r="0.047" fill="none" stroke="${color}" stroke-width="0.013"/>`);
                });
                if (skipped) note = tx('st_note_origin');
            }
            host.innerHTML = `<svg class="stereo-svg" viewBox="-1.25 -1.25 2.5 2.5" role="img" aria-label="${tx('st_aria', A.key)}">${parts.join('')}</svg>`;
            byId('stereo-note').textContent = note || tx('st_note');
        }

        // ---------- Properties tab ----------
        function renderPropertiesTab() {
            const A = currentAnalysis();
            const el = byId('tab-properties');
            const system = tx(`sys_${systemOf(A.key)}`);
            const laueKinds = [...new Map(A.ops.flatMap(op => [op.m, op.m.map(v => -v || 0)]).map(m => [M3.key(m), describeOperation(m, false).kind])).values()];
            const laue = identifyGroup(laueKinds);
            const forms = Object.fromEntries(TENSOR_SPECS.map(spec => [spec.id, tensorForm(A, spec)]));
            const kleinman = tensorForm(A, KLEINMAN_SPEC).count;
            const centro = A.ops.some(op => op.kind === '-1');
            const pyroComps = forms.p.exprs.map((t, j) => (t.length ? `<i>p</i><sub>${j + 1}</sub>` : null)).filter(Boolean);
            const yes = (on, title, detail) => `<li><span class="${on ? 'yes' : 'no'}" aria-hidden="true">${on ? '✓' : '·'}</span><span>${title}: ${tx(on ? 'yes' : 'no').toLowerCase()}${detail ? `<small>${detail}</small>` : ''}</span></li>`;

            let html = `<div class="tab-head"><h2>${hmHTML(A.key)} <span class="sch">(${schHTML(A.table.sch)})</span></h2><p>${tx('pr_sub')}</p></div>`;
            html += '<dl class="facts">'
                + `<dt>${tx('pr_system')}</dt><dd>${system}</dd>`
                + `<dt>${tx('pr_laue')}</dt><dd class="math">${groupLabelHTML(laue)}</dd>`
                + `<dt>${tx('pr_order')}</dt><dd>${tx('n_ops', A.n)} / ${tx('n_classes', A.classes.length)}</dd>`
                + `<dt>${tx('pr_gens')}</dt><dd class="math">${pointGroups[A.key].generators.map(g => opSymbolHTML(describeOperation(M3.fromMatrix4(operators[g]), A.hex))).join(', ')}</dd>`
                + '</dl>';
            html += `<h3>${tx('pr_effects')}</h3><ul class="flag-list">`
                + yes(centro, tx('pr_centro'), centro ? tx('pr_centro_d') : '')
                + yes(A.chiral, tx('pr_enant'), A.chiral ? tx('pr_enant_d') : '')
                + yes(forms.p.count > 0, tx('pr_polar'), forms.p.count ? tx('pr_polar_d', pyroComps.join(', ')) : '')
                + yes(forms.d.count > 0, tx('pr_piezo'), forms.d.count ? tx('pr_piezo_d', forms.d.count) : (A.key === '432' ? tx('pr_piezo_432') : ''))
                + yes(forms.d.count > 0, tx('pr_shg'), forms.d.count ? tx('pr_shg_d', kleinman) : '')
                + yes(forms.g.count > 0, tx('pr_optic'), forms.g.count ? tx('pr_optic_d', forms.g.count) : '')
                + '</ul>';
            html += `<h3>${tx('pr_tensors')}</h3><p class="note" style="margin:0 0 12px">${tx('pr_neumann')}</p>`;
            TENSOR_SPECS.forEach(spec => {
                const form = forms[spec.id];
                let table = '<table class="tensor math"><tbody>';
                for (let r = 0; r < spec.rows; r++) {
                    table += '<tr>';
                    for (let c = 0; c < spec.cols; c++) {
                        const { comp, mirror } = spec.cell(r, c);
                        const expr = termsHTML(form.exprs[comp], spec);
                        table += `<td class="${expr ? '' : 'zero'}${mirror ? ' mirror' : ''}">${expr || '·'}</td>`;
                    }
                    table += '</tr>';
                }
                table += '</tbody></table>';
                html += `<div class="tensor-block"><h4>${tx(`tensor_${spec.id}`)} <span class="math">${spec.letter}</span> <small>${tx('pr_indep', form.count)}</small></h4><div class="scroll-x" style="display:inline-block;max-width:100%;border:0;background:none">${table}</div></div>`;
            });
            el.innerHTML = html;
        }

        // ===================================================================
        // Events, layout, render loop
        // ===================================================================
        function setupEventListeners() {
            byId('point-group-select').addEventListener('change', updatePointGroup);
            const motifControls = byId('parent-motif-controls');
            const syncCoordinate = (event, commit) => {
                const match = event.target.id.match(/^parent-([xyz])-(range|num)$/);
                if (!match) return;
                const axis = match[1];
                const number = byId(`parent-${axis}-num`);
                const range = byId(`parent-${axis}-range`);
                let value = event.target.valueAsNumber;
                if (!Number.isFinite(value)) {
                    if (!commit) {
                        number.setAttribute('aria-invalid', 'true');
                        return;
                    }
                    value = lastValid[axis];
                }
                value = clamp(value, -1, 1);
                lastValid[axis] = value;
                range.value = value;
                // Preserve an in-progress valid decimal while typing.
                if (commit || match[2] === 'range' || number.valueAsNumber !== value) {
                    number.value = value;
                }
                number.removeAttribute('aria-invalid');
                updateScene();
                scheduleHashSync();
            };
            motifControls.addEventListener('input', event => syncCoordinate(event, false));
            motifControls.addEventListener('change', event => syncCoordinate(event, true));
            motifControls.addEventListener('focusout', event => syncCoordinate(event, true));

            setupLegend();
            byId('lang-btn').addEventListener('click', () => setLanguage(lang === 'en' ? 'fr' : 'en'));
            byId('share-btn').addEventListener('click', async e => {
                const btn = e.currentTarget; // currentTarget is null after the first await
                writeHash();
                if (await copyText(location.href)) flash(btn, 'share_done');
            });
            byId('coords-copy').addEventListener('click', async e => {
                const btn = e.currentTarget;
                const text = coordinatesTable().map(r => `${r.x}\t${r.y}\t${r.z}`).join('\n');
                if (await copyText(text)) flash(btn, 'copied');
            });
            byId('coords-csv').addEventListener('click', () => {
                const rows = coordinatesTable().map(r => [r.x, r.y, r.z, r.count, r.handedness].join(','));
                downloadFile(`positions_${state.groupKey.replace('/', '-')}.csv`, ['x,y,z,orientations,handedness', ...rows].join('\n') + '\n', 'text/csv');
            });

            // The canvas follows its container (window resize, panel drags, switching tabs).
            const viewport = byId('visualization-area');
            if ('ResizeObserver' in window) new ResizeObserver(onWindowResize).observe(viewport);
            else window.addEventListener('resize', onWindowResize);
        }
        function onWindowResize() {
            if (!camera || !renderer) return;
            const viewport = byId('visualization-area');
            const width = Math.max(1, viewport.clientWidth);
            const height = Math.max(1, viewport.clientHeight);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            requestRender();
        }

        // Two panels (inputs / tabs): the divider resizes them, the swap button exchanges their sides
        // and the reset button restores the default layout.
        const LAYOUT = { width: 400, min: 280, max: 640, minMain: 320, step: 16 };
        function setupLayout() {
            const container = byId('app-container');
            const panel = byId('input-panel');
            const handle = byId('drag-handle');
            const swapBtn = byId('swap-btn');
            const direction = () => (container.classList.contains('swapped') ? -1 : 1);
            const saveLayout = () => storage.set('ps-layout', JSON.stringify({ width: Math.round(panel.getBoundingClientRect().width), swapped: container.classList.contains('swapped') }));
            const setWidth = (width, persist = true) => {
                const room = container.clientWidth - handle.offsetWidth - LAYOUT.minMain;
                const w = Math.max(LAYOUT.min, Math.min(LAYOUT.max, room, width));
                panel.style.width = `${w}px`;
                handle.setAttribute('aria-valuenow', String(Math.round(w)));
                if (persist) saveLayout();
            };
            const setSwapped = swapped => {
                container.classList.toggle('swapped', swapped);
                swapBtn.setAttribute('aria-pressed', String(swapped));
            };
            handle.setAttribute('aria-valuemin', String(LAYOUT.min));
            handle.setAttribute('aria-valuemax', String(LAYOUT.max));

            let saved = null;
            try { saved = JSON.parse(storage.get('ps-layout')); } catch (e) { saved = null; }
            setSwapped(Boolean(saved?.swapped));
            setWidth(Number.isFinite(saved?.width) ? saved.width : LAYOUT.width, false);

            let dragging = false, startX = 0, startWidth = 0;
            handle.addEventListener('pointerdown', e => {
                dragging = true;
                startX = e.clientX;
                startWidth = panel.getBoundingClientRect().width;
                handle.setPointerCapture(e.pointerId);
                handle.classList.add('dragging');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });
            handle.addEventListener('pointermove', e => {
                if (dragging) setWidth(startWidth + (e.clientX - startX) * direction(), false); // keep the grab offset so the edge does not jump
            });
            const stop = e => {
                if (!dragging) return;
                dragging = false;
                if (handle.hasPointerCapture(e.pointerId)) handle.releasePointerCapture(e.pointerId);
                handle.classList.remove('dragging');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                saveLayout();
            };
            handle.addEventListener('pointerup', stop);
            handle.addEventListener('pointercancel', stop);
            handle.addEventListener('dblclick', () => setWidth(LAYOUT.width));
            handle.addEventListener('keydown', e => {
                const step = e.shiftKey ? LAYOUT.step * 4 : LAYOUT.step;
                const delta = { ArrowRight: step, ArrowLeft: -step }[e.key];
                if (delta === undefined) return;
                e.preventDefault();
                setWidth(panel.getBoundingClientRect().width + delta * direction());
            });
            swapBtn.addEventListener('click', () => { setSwapped(!container.classList.contains('swapped')); saveLayout(); });
            byId('reset-layout-btn').addEventListener('click', () => { setSwapped(false); setWidth(LAYOUT.width); });
            if ('ResizeObserver' in window) new ResizeObserver(() => setWidth(panel.getBoundingClientRect().width, false)).observe(container);
        }

        // Draw only when something changed and the 3D tab is showing.
        function animate() {
            requestAnimationFrame(animate);
            if (!renderer || !renderDirty || view.active !== '3d') return;
            renderDirty = false;
            renderer.render(scene, camera);
        }
        if (typeof document.getElementById === 'function') init();
    </script>
