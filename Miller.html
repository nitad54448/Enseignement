<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystallography Visualizer (Planes & Directions)</title>
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <style>
        :root {
            --panel-bg: #111827;
            --main-bg: #ffffff;
            --border-light: #e5e7eb;
            --border-dark: #374151;
            --text-light: #d1d5db;
            --text-dark: #111827;
            --accent-blue: #3b82f6;
            --accent-red: #dc2626;
        }

        /* --- CORE PAGE LAYOUT --- */
        body {
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            background-color: #f0f0f0;
            color: var(--text-light);
            height: 100vh;
            height: 100dvh;
            overflow: hidden; /* Prevents body scroll */
        }
        #app-container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative; 
        }
        footer {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            box-sizing: border-box;
            height: 30px; 
            background-color: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            color: #555;
            padding: 0 20px;
            font-size: 0.75em;
            z-index: 100;
            display: flex;
            align-items: center;
        }

        /* --- CONTROLS PANEL (LEFT) --- */
        #controls-panel {
            width: 400px;
            min-width: 350px;
            max-width: 600px;
            flex-shrink: 0;
            padding: 24px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-dark);
            overflow-y: auto;
            color: var(--text-light);
            height: calc(100% - 30px); 
            box-sizing: border-box;
            transition: transform 0.3s ease-in-out;
            font-size: 1.05rem; /* Increase base font size */
        }
        #drag-handle {
            width: 6px;
            cursor: col-resize;
            background-color: var(--border-dark);
            flex-shrink: 0;
            transition: background-color 0.2s;
        }
        #drag-handle:hover {
            background-color: var(--accent-blue);
        }

        /* --- VISUALIZATION AREA (RIGHT) --- */
        #visualization-area {
            flex-grow: 1;
            position: relative;
            background-color: var(--main-bg);
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: var(--text-dark);
            height: calc(100% - 30px); /* Respect the footer */
            box-sizing: border-box;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- UI COMPONENTS --- */
        #menu-toggle-btn {
            display: none; /* Hidden by default */
        }
        #panel-info {
            margin-top: 2rem;
            padding: 1rem;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-dark);
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
            color: var(--text-light);
            font-size: 0.9em;
        }

        /* --- FORM STYLES --- */
        .control-group {
            margin-bottom: 1.5rem;
        }
        .control-group label {
            display: block; margin-bottom: 8px; font-weight: 500;
            color: #9ca3af;
        }
        .control-group select, .control-group input[type="number"] {
            width: 100%; padding: 10px; border-radius: 5px;
            border: 1px solid #4b5563; background-color: #374151;
            color: var(--text-light); font-family: 'Inter', system-ui, sans-serif;
            box-sizing: border-box;
            font-size: inherit; /* Ensure inputs use the panel's font size */
        }
        .control-group select:focus, .control-group input[type="number"]:focus {
            outline: none; border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
        }
        .indices-group, .param-group { display: flex; gap: 10px; }
        .indices-group input { text-align: center; }
       
        /* --- RESPONSIVE STYLES (< 768px) --- */
        @media (max-width: 768px) {
            #menu-toggle-btn {
                display: block;
                position: absolute;
                top: 1rem;
                left: 1rem;
                font-size: 1.5rem;
                background: #f3f4f6;
                border: 1px solid #d1d5db;
                color: var(--text-dark);
                width: 40px;
                height: 40px;
                border-radius: 0.375rem;
                cursor: pointer;
                z-index: 101;
            }
            #controls-panel {
                position: absolute;
                top: 0; left: 0;
                width: 85% !important; max-width: 350px;
                min-width: unset;
                height: 100%;
                padding-top: 70px;
                z-index: 100;
                border-right: 2px solid var(--border-dark);
                box-shadow: 4px 0 15px rgba(0,0,0,0.2);
            }
            #controls-panel.collapsed {
                transform: translateX(-101%);
            }
            #drag-handle {
                display: none;
            }
            footer {
                font-size: 0.7em;
                padding: 0 10px;
            }
        }
        .param-group > div { flex: 1; min-width: 0; }
        .param-group label { font-size: 0.85em; margin-bottom: 4px; }
        .indices-group input { min-width: 0; }
        #threejs-container { overflow: hidden; }
        #threejs-container canvas { touch-action: none; }
        #drag-handle { touch-action: none; height: calc(100% - 30px); }
        #fit-view-btn { position: absolute; top: 1rem; right: 1rem; cursor: pointer;
            padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 5px; background: #fff; }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="controls-panel" class="">
            <div class="control-group">
                <label for="crystalSystem">Crystal System</label>
                <select id="crystalSystem">
                    <option value="cubic" selected>Cubic</option>
                    <option value="tetragonal">Tetragonal</option>
                    <option value="orthorhombic">Orthorhombic</option>
                    <option value="hexagonal">Hexagonal</option>
                    <option value="trigonal">Trigonal</option>
                    <option value="monoclinic">Monoclinic</option>
                    <option value="triclinic">Triclinic</option>
                </select>
            </div>
            <div class="control-group" id="params-controls">
                <label>Lattice Parameters (Å & °)</label>
                <div class="param-group">
                    <div title="Lattice parameter a"><label for="a">a (Å)</label><input type="number" id="a" value="4" step="0.1" min="1.5" max="50"></div>
                    <div title="Lattice parameter b"><label for="b">b (Å)</label><input type="number" id="b" value="4" step="0.1" min="1.5" max="50"></div>
                    <div title="Lattice parameter c"><label for="c">c (Å)</label><input type="number" id="c" value="4" step="0.1" min="1.5" max="50"></div>
                </div>
                <div class="param-group" style="margin-top:10px">
                    <div title="Lattice angle alpha"><label for="alpha">α (°)</label><input type="number" id="alpha" value="90" step="1" min="30" max="150"></div>
                    <div title="Lattice angle beta"><label for="beta">β (°)</label><input type="number" id="beta" value="90" step="1" min="30" max="150"></div>
                    <div title="Lattice angle gamma"><label for="gamma">γ (°)</label><input type="number" id="gamma" value="90" step="1" min="30" max="150"></div>
                </div>
            </div>
            <div class="control-group">
                <label>Plane Indices (h k l)</label>
                <div class="indices-group">
                     <input type="number" id="h" aria-label="Index h" value="1" step="1">
                     <input type="number" id="k" aria-label="Index k" value="1" step="1">
                     <input type="number" id="l" aria-label="Index l" value="1" step="1">
                </div>
                <label style="margin-top: 1rem;">Direction Indices [u v w]</label>
                <div class="indices-group">
                    <input type="number" id="u" aria-label="Index u" value="1" step="1">
                    <input type="number" id="v" aria-label="Index v" value="1" step="1">
                    <input type="number" id="w" aria-label="Index w" value="1" step="1">
                </div>
            </div>
            <div id="panel-info" role="status" aria-live="polite">Select parameters to see details.</div>
        </div>
        <div id="drag-handle" role="separator" aria-label="Resize controls" aria-orientation="vertical"></div>
        <div id="visualization-area">
            <button id="menu-toggle-btn" aria-label="Toggle controls" aria-controls="controls-panel" aria-expanded="true">☰</button>
            <button id="fit-view-btn">Fit view</button>
            <div id="threejs-container" style="width:100%; height:100%; background-color: #ffffff;"></div>
        </div>
    </div>

    <footer>
        <div>NitaD, Univ Paris-Saclay, 26 juillet 2025.</div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls, selectedPlane = null;
        let sceneBounds = null, resizeObserver;
        let unitCellLines, latticeNodes, hklPlanes, directionVector, axisLabels;

        const dom = {
            info: document.getElementById('panel-info'),
            system: document.getElementById('crystalSystem'),
            menuToggleBtn: document.getElementById('menu-toggle-btn'),
            controlsPanel: document.getElementById('controls-panel'),
            params: { a: document.getElementById('a'), b: document.getElementById('b'), c: document.getElementById('c'), alpha: document.getElementById('alpha'), beta: document.getElementById('beta'), gamma: document.getElementById('gamma') },
            hkl: { h: document.getElementById('h'), k: document.getElementById('k'), l: document.getElementById('l') },
            uvw: { u: document.getElementById('u'), v: document.getElementById('v'), w: document.getElementById('w') }
        };

        function init() {
            if (!window.THREE || !THREE.OrbitControls) {
                dom.info.textContent = 'Unable to load the 3D libraries. Check your internet connection and reload.';
                return;
            }
            unitCellLines = new THREE.Group(); latticeNodes = new THREE.Group();
            hklPlanes = new THREE.Group(); directionVector = new THREE.Group(); axisLabels = new THREE.Group();
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            scene.add(unitCellLines, latticeNodes, hklPlanes, directionVector, axisLabels);
            camera = new THREE.OrthographicCamera(-5, 5, 5, -5, 0.01, 1000);
            camera.up.set(0, 0, 1);
            camera.position.set(8, 10, 6);
            try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
            catch (error) { dom.info.textContent = 'WebGL is unavailable in this browser.'; return; }
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            const container = document.getElementById('threejs-container');
            container.appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1));
            setupEventListeners();
            setupResizer();
            if (window.innerWidth <= 768) dom.controlsPanel.classList.add('collapsed');
            dom.menuToggleBtn.setAttribute('aria-expanded', String(!dom.controlsPanel.classList.contains('collapsed')));
            window.addEventListener('resize', onWindowResize);
            resizeObserver = new ResizeObserver(onWindowResize);
            resizeObserver.observe(container);
            updateParameterFields();
            onWindowResize();
            updateScene();
            animate();
        }
        
        function setupEventListeners() {
            dom.system.addEventListener('change', () => { updateParameterFields(); updateScene(); });
            Object.values(dom.params).forEach(input => input.addEventListener('change', () => {
                syncLinkedParameters(); updateScene();
            }));
            [...Object.values(dom.hkl), ...Object.values(dom.uvw)].forEach(input =>
                input.addEventListener('change', updateScene));
            dom.menuToggleBtn.addEventListener('click', () => {
                dom.controlsPanel.classList.toggle('collapsed');
                dom.menuToggleBtn.setAttribute('aria-expanded', String(!dom.controlsPanel.classList.contains('collapsed')));
            });
            document.getElementById('fit-view-btn').addEventListener('click', fitCameraToScene);
            const pointers = new Set();
            let press = null;
            renderer.domElement.addEventListener('pointerdown', e => {
                pointers.add(e.pointerId);
                if (pointers.size > 1) { press = null; return; }
                if (e.button === 0) press = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false };
            });
            renderer.domElement.addEventListener('pointermove', e => {
                if (press && press.id === e.pointerId && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 5)
                    press.moved = true;
            });
            renderer.domElement.addEventListener('pointerup', e => {
                if (press && press.id === e.pointerId && !press.moved &&
                    Math.hypot(e.clientX - press.x, e.clientY - press.y) <= 5) onObjectClick(e);
                press = null; pointers.delete(e.pointerId);
            });
            renderer.domElement.addEventListener('pointercancel', e => { press = null; pointers.delete(e.pointerId); });
        }
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            axisLabels.children.forEach(label => {
                label.quaternion.copy(camera.quaternion);
            });
            renderer.render(scene, camera);
        }

        function clearScene() {
            const geometries = new Set(), materials = new Set(), textures = new Set();
            [unitCellLines, latticeNodes, hklPlanes, directionVector, axisLabels].forEach(group => {
                group.traverse(object => {
                    if (object.geometry) geometries.add(object.geometry);
                    if (object.material) {
                        const list = Array.isArray(object.material) ? object.material : [object.material];
                        list.forEach(material => { materials.add(material); if (material.map) textures.add(material.map); });
                    }
                });
                group.clear();
            });
            textures.forEach(texture => texture.dispose());
            materials.forEach(material => material.dispose());
            geometries.forEach(geometry => geometry.dispose());
            selectedPlane = null;
            sceneBounds = null;
        }
        
        function updateScene() {
            clearScene();
            const fields = [...Object.values(dom.params), ...Object.values(dom.hkl), ...Object.values(dom.uvw)];
            const invalid = fields.find(input => !input.value.trim() || !Number.isFinite(Number(input.value)) ||
                (!input.disabled && !input.checkValidity()));
            const indices = [...Object.values(dom.hkl), ...Object.values(dom.uvw)];
            if (invalid || indices.some(input => !Number.isSafeInteger(Number(input.value)))) {
                dom.info.textContent = 'Enter valid lattice parameters within the displayed limits and whole-number indices.';
                return;
            }
            const p = {}; Object.keys(dom.params).forEach(k => p[k] = Number(dom.params[k].value));
            const { v_a, v_b, v_c } = getDirectVectors(p.a, p.b, p.c, p.alpha, p.beta, p.gamma);
            if (!v_a) {
                dom.info.textContent = 'Invalid lattice geometry: these angles do not form a non-degenerate 3D unit cell.';
                return;
            }

            drawUnitCell(v_a, v_b, v_c);
            drawAxisLabels(v_a, v_b, v_c);
            drawLatticeNodes(v_a, v_b, v_c);
            
            const hkl = {}; Object.keys(dom.hkl).forEach(k => hkl[k] = Number(dom.hkl[k].value));
            if (hkl.h !== 0 || hkl.k !== 0 || hkl.l !== 0) {
                drawHklPlanes(v_a, v_b, v_c, p, hkl.h, hkl.k, hkl.l);
            }

            const uvw = {}; Object.keys(dom.uvw).forEach(k => uvw[k] = Number(dom.uvw[k].value));
            if (uvw.u !== 0 || uvw.v !== 0 || uvw.w !== 0) {
                drawDirectionVector(v_a, v_b, v_c, uvw.u, uvw.v, uvw.w);
            }
            updateInfo();
            scene.updateMatrixWorld(true);
            sceneBounds = new THREE.Box3().setFromObject(scene);
            fitCameraToScene();
        }

        function getDirectVectors(a, b, c, alpha, beta, gamma) {
            if (![a,b,c,alpha,beta,gamma].every(Number.isFinite) || Math.min(a,b,c) <= 0 ||
                [alpha,beta,gamma].some(angle => angle <= 0 || angle >= 180)) return {};
            const r = Math.PI / 180;
            const ca = Math.cos(alpha*r), cb = Math.cos(beta*r), cg = Math.cos(gamma*r), sg = Math.sin(gamma*r);
            const determinant = 1 + 2*ca*cb*cg - ca*ca - cb*cb - cg*cg;
            // Reject invalid and numerically singular metrics; never flatten them silently.
            if (determinant <= 1e-10 || Math.abs(sg) < 1e-9) return {};
            return {
                v_a: new THREE.Vector3(a, 0, 0),
                v_b: new THREE.Vector3(b*cg, b*sg, 0),
                v_c: new THREE.Vector3(c*cb, c*(ca-cb*cg)/sg, c*Math.sqrt(determinant)/sg)
            };
        }
        
        function getReciprocalVectors(a, b, c, alpha, beta, gamma) {
            const { v_a, v_b, v_c } = getDirectVectors(a, b, c, alpha, beta, gamma);
            if (!v_a) return {};
            const V = v_a.clone().dot(v_b.clone().cross(v_c));
            if (Math.abs(V) < 1e-9) return {};
            const f = 2 * Math.PI / V;
            return {
                b1: v_b.clone().cross(v_c).multiplyScalar(f),
                b2: v_c.clone().cross(v_a).multiplyScalar(f),
                b3: v_a.clone().cross(v_b).multiplyScalar(f),
            };
        }

        function drawUnitCell(v_a, v_b, v_c) {
            const mat = new THREE.LineBasicMaterial({ color: 0x6b7280, transparent: true, opacity: 0.8 });
            const pts = [new THREE.Vector3(), v_a, v_b, v_c, v_a.clone().add(v_b), v_a.clone().add(v_c), v_b.clone().add(v_c), v_a.clone().add(v_b).add(v_c)];
            const edges = [0,1,0,2,0,3,1,4,1,5,2,4,2,6,3,5,3,6,4,7,5,7,6,7];
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            geom.setIndex(edges);
            unitCellLines.add(new THREE.LineSegments(geom, mat));
        }

        function drawAxisLabels(v_a, v_b, v_c) {
            const size = Math.max(v_a.length(), v_b.length(), v_c.length()) * 0.12;
            [['a', v_a], ['b', v_b], ['c', v_c]].forEach(([text, vector]) => {
                const canvas = document.createElement('canvas');
                canvas.width = canvas.height = 128;
                const context = canvas.getContext('2d');
                context.font = '80px sans-serif'; context.fillStyle = '#1f2937';
                context.textAlign = 'center'; context.textBaseline = 'middle';
                context.fillText(text, 64, 64);
                const texture = new THREE.CanvasTexture(canvas);
                const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, depthTest: false }));
                label.position.copy(vector).multiplyScalar(1.12);
                label.scale.set(size, size, 1);
                axisLabels.add(label);
            });
        }
        
        function drawLatticeNodes(v_a, v_b, v_c) {
            const radius = 0.1; // Fixed node size
            const mat = new THREE.MeshStandardMaterial({ color: 0x4338ca, roughness: 0.5 });
            let coords = [new THREE.Vector3(0,0,0), new THREE.Vector3(1,0,0), new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,1), new THREE.Vector3(1,1,0), new THREE.Vector3(1,0,1), new THREE.Vector3(0,1,1), new THREE.Vector3(1,1,1)];
            
            coords.forEach(fr => {
                 const pos = new THREE.Vector3().addScaledVector(v_a,fr.x).addScaledVector(v_b,fr.y).addScaledVector(v_c,fr.z);
                 const s = new THREE.Mesh(new THREE.SphereGeometry(radius,20,20),mat); 
                 s.position.copy(pos); 
                 latticeNodes.add(s);
            });
        }

        function drawDirectionVector(v_a, v_b, v_c, u, v, w) {
            const dir = new THREE.Vector3().addScaledVector(v_a,u).addScaledVector(v_b,v).addScaledVector(v_c,w);
            const len = dir.length();
            if (len < 1e-9) return;
            directionVector.add(new THREE.ArrowHelper(dir.normalize(), new THREE.Vector3(), len, 0xd90429, len * 0.1, len * 0.06));
        }

        function drawHklPlanes(v_a, v_b, v_c, p, h, k, l) {
            const { b1, b2, b3 } = getReciprocalVectors(p.a, p.b, p.c, p.alpha, p.beta, p.gamma);
            if (!b1) return;
            const g = new THREE.Vector3().addScaledVector(b1, h).addScaledVector(b2, k).addScaledVector(b3, l);
            if (g.length() < 1e-9) return;
            const d = 2 * Math.PI / g.length();
            const dv = g.clone().normalize().multiplyScalar(d);
            let V = [];
            if (h !== 0) V.push(v_a.clone().divideScalar(h));
            if (k !== 0) V.push(v_b.clone().divideScalar(k));
            if (l !== 0) V.push(v_c.clone().divideScalar(l));

            if (V.length < 3) {
                const o=new THREE.Vector3(0,0,0);
                let p1,p2,p3,p4;
                if(h===0&&k===0){p1=o;p2=v_a.clone();p3=v_a.clone().add(v_b);p4=v_b.clone();if(l!==0)[p1,p2,p3,p4].forEach(pt=>pt.add(v_c.clone().divideScalar(l)))}
                else if(h===0&&l===0){p1=o;p2=v_a.clone();p3=v_a.clone().add(v_c);p4=v_c.clone();if(k!==0)[p1,p2,p3,p4].forEach(pt=>pt.add(v_b.clone().divideScalar(k)))}
                else if(k===0&&l===0){p1=o;p2=v_b.clone();p3=v_b.clone().add(v_c);p4=v_c.clone();if(h!==0)[p1,p2,p3,p4].forEach(pt=>pt.add(v_a.clone().divideScalar(h)))}
                else if(h===0){p1=v_b.clone().divideScalar(k);p2=v_c.clone().divideScalar(l);p3=p2.clone().add(v_a);p4=p1.clone().add(v_a)}
                else if(k===0){p1=v_a.clone().divideScalar(h);p2=v_c.clone().divideScalar(l);p3=p2.clone().add(v_b);p4=p1.clone().add(v_b)}
                else{p1=v_a.clone().divideScalar(h);p2=v_b.clone().divideScalar(k);p3=p2.clone().add(v_c);p4=p1.clone().add(v_c)}
                V=[p1,p2,p3,p4];
            }
            if (V.length < 3) return;

            const createPlane = (verts, mat) => {
                const geom = new THREE.BufferGeometry().setFromPoints(verts);
                geom.setIndex([0, 1, 2, ...(verts.length === 4 ? [0, 2, 3] : [])]);
                geom.computeVertexNormals();
                return new THREE.Mesh(geom, mat);
            };
            const mainMat = new THREE.MeshPhongMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.7, depthWrite: false, side: THREE.DoubleSide });
            const neighborMat = new THREE.MeshPhongMaterial({ color: 0x93c5fd, transparent: true, opacity: 0.35, depthWrite: false, side: THREE.DoubleSide });
            
            const mainPlane = createPlane(V, mainMat);
            mainPlane.userData = { h, k, l, params: p, isClickable: true };
            hklPlanes.add(mainPlane);
            hklPlanes.add(createPlane(V.map(v => v.clone().sub(dv)), neighborMat));
            hklPlanes.add(createPlane(V.map(v => v.clone().add(dv)), neighborMat));
        }
        
        function getEventCoords(e) {
            // Return coordinates for both mouse and touch events
            if (e.changedTouches && e.changedTouches.length > 0) {
                return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function onObjectClick(e) {
            if (!sceneBounds) return;
            e.preventDefault();
            const coords = getEventCoords(e);
            const c = renderer.domElement;
            const rect = c.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            const m = new THREE.Vector2(((coords.x - rect.left) / rect.width) * 2 - 1,
                -((coords.y - rect.top) / rect.height) * 2 + 1);
            scene.updateMatrixWorld(true); camera.updateMatrixWorld(true);
            const r = new THREE.Raycaster();
            r.setFromCamera(m, camera);
            const i = r.intersectObjects(hklPlanes.children.filter(c => c.userData.isClickable));

            if (selectedPlane && selectedPlane.material) selectedPlane.material.color.setHex(0x3b82f6);
            selectedPlane = (i.length > 0) ? i[0].object : null;
            if (selectedPlane) selectedPlane.material.color.setHex(0xf59e0b);
            updateInfo();
        }

        function updateInfo() {
            const h = Number(dom.hkl.h.value);
            const k = Number(dom.hkl.k.value);
            const l = Number(dom.hkl.l.value);
            const p = {};
            Object.keys(dom.params).forEach(key => p[key] = parseFloat(dom.params[key].value));
            const d = calculateDSpacing(h, k, l, p);
            const d_text = Number.isNaN(d) ? 'Invalid cell' :
                !Number.isFinite(d) ? 'Undefined: (000) is not a plane' :
                `${d < 0.0001 ? d.toExponential(4) : d.toFixed(4)} Å`;
            const planeText = `<b>Plane: (${h} ${k} ${l})</b> | d_hkl: ${d_text}`;

            const { u, v, w } = dom.uvw;
            const zero = [u,v,w].every(input => Number(input.value) === 0);
            const directionText = `<b>Direction: [${Number(u.value)} ${Number(v.value)} ${Number(w.value)}]</b>${zero ? ' — undefined zero direction' : ''}`;
            
            dom.info.innerHTML = planeText + '<br>' + directionText;
        }

        function calculateDSpacing(h, k, l, p) {
            const { b1, b2, b3 } = getReciprocalVectors(p.a, p.b, p.c, p.alpha, p.beta, p.gamma);
            if (!b1) return NaN;
            const g = new THREE.Vector3().addScaledVector(b1, h).addScaledVector(b2, k).addScaledVector(b3, l);
            const gl = g.length();
            return (gl < 1e-9) ? Infinity : 2 * Math.PI / gl;
        }

        function updateParameterFields() {
            const system = dom.system.value;
            Object.values(dom.params).forEach(input => { input.parentElement.style.display = 'flex'; input.disabled = false; });
            const hide = keys => keys.forEach(key => dom.params[key].parentElement.style.display = 'none');
            
            switch (system) {
                case 'cubic': hide(['b', 'c', 'alpha', 'beta', 'gamma']); break;
                case 'tetragonal': hide(['b', 'alpha', 'beta', 'gamma']); break;
                case 'orthorhombic': hide(['alpha', 'beta', 'gamma']); break;
                case 'hexagonal': hide(['b', 'alpha', 'beta', 'gamma']); break;
                case 'trigonal': hide(['b', 'c', 'beta', 'gamma']); break;
                case 'monoclinic': hide(['alpha', 'gamma']); break;
                case 'triclinic': break;
            }
            syncLinkedParameters();
        }

        function syncLinkedParameters() {
            const system = dom.system.value;
            const { a, b, c, alpha, beta, gamma } = dom.params;
            const set = (p, val, disable=true) => { p.value = val; p.disabled = disable; };

            switch (system) {
                case 'cubic': set(b, a.value); set(c, a.value); set(alpha, 90); set(beta, 90); set(gamma, 90); break;
                case 'tetragonal': set(b, a.value); set(alpha, 90); set(beta, 90); set(gamma, 90); break;
                case 'orthorhombic': set(alpha, 90); set(beta, 90); set(gamma, 90); break;
                case 'hexagonal': set(b, a.value); set(alpha, 90); set(beta, 90); set(gamma, 120, true); break;
                case 'trigonal': set(b, a.value); set(c, a.value); set(beta, alpha.value); set(gamma, alpha.value); break;
                case 'monoclinic': set(alpha, 90); set(gamma, 90); break;
            }
        }

        function onWindowResize() {
            if (!renderer || !camera) return;
            const container = document.getElementById('threejs-container');
            const w = container.clientWidth, h = container.clientHeight;
            if (!w || !h) return;
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(w, h);
            fitCameraToScene();
        }

        function fitCameraToScene() {
            if (!sceneBounds || sceneBounds.isEmpty()) return;
            const container = document.getElementById('threejs-container');
            if (!container.clientWidth || !container.clientHeight) return;
            const aspect = container.clientWidth / container.clientHeight;
            const center = sceneBounds.getCenter(new THREE.Vector3());
            // A bounding sphere stays in frame when the user rotates the model.
            const radius = Math.max(sceneBounds.getSize(new THREE.Vector3()).length() / 2, 0.1);
            const view = camera.position.clone().sub(controls.target).normalize();
            if (view.lengthSq() === 0) view.set(8,10,6).normalize();
            controls.target.copy(center);
            camera.position.copy(center).addScaledVector(view, radius * 3);
            const halfHeight = radius * 1.2 / Math.min(aspect, 1);
            camera.left = -halfHeight * aspect; camera.right = halfHeight * aspect;
            camera.top = halfHeight; camera.bottom = -halfHeight;
            camera.near = Math.max(radius / 10000, 0.0001); camera.far = radius * 10;
            camera.zoom = 1;
            camera.updateProjectionMatrix();
            controls.update();
        }
        
        function setupResizer() {
            const handle = document.getElementById('drag-handle'), panel = dom.controlsPanel;
            let pointer = null;
            handle.addEventListener('pointerdown', e => {
                if (e.button !== 0 || window.innerWidth <= 768) return;
                e.preventDefault(); pointer = e.pointerId; handle.setPointerCapture(pointer);
                document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';
            });
            handle.addEventListener('pointermove', e => {
                if (pointer !== e.pointerId) return;
                const x = e.clientX - document.getElementById('app-container').getBoundingClientRect().left;
                panel.style.width = `${Math.max(350, Math.min(600, x))}px`;
            });
            const stop = () => { pointer = null; document.body.style.cursor = ''; document.body.style.userSelect = ''; };
            handle.addEventListener('pointerup', stop);
            handle.addEventListener('pointercancel', stop);
            handle.addEventListener('lostpointercapture', stop);
        }
        
        init();
    </script>
</body>
</html>
