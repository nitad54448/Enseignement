<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Radon</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        /* --- Reset (box-sizing, margins, form font inheritance, media display) --- */
        *, ::before, ::after { box-sizing: border-box; border-width: 0; border-style: solid; border-color: #e5e7eb; }
        html { line-height: 1.5; -webkit-text-size-adjust: 100%; tab-size: 4; }
        body { margin: 0; line-height: inherit; }
        h1, h2, h3, p { margin: 0; }
        h1, h2, h3 { font-size: inherit; font-weight: inherit; }
        button, input, select { font-family: inherit; font-size: 100%; font-weight: inherit; line-height: inherit; color: inherit; margin: 0; padding: 0; }
        button, select { text-transform: none; }
        button { background-color: transparent; background-image: none; cursor: pointer; -webkit-appearance: button; appearance: button; }
        select { -webkit-appearance: menulist; }
        canvas, video { display: block; vertical-align: middle; }
        video { max-width: 100%; height: auto; }
        [hidden] { display: none; }
        .hidden { display: none; }

        /* --- Layout --- */
        body { display: flex; flex-direction: column; height: 100vh; background-color: #f3f4f6; overflow: hidden; }
        .app-header { background-color: #fff; padding: 0.75rem; width: 100%; z-index: 10;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
        .header-inner { width: 100%; margin-left: auto; margin-right: auto; display: flex; align-items: center;
            justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
        @media (min-width: 640px) { .header-inner { max-width: 640px; } }
        @media (min-width: 768px) { .header-inner { max-width: 768px; } }
        @media (min-width: 1024px) { .header-inner { max-width: 1024px; } }
        @media (min-width: 1280px) { .header-inner { max-width: 1280px; } }
        @media (min-width: 1536px) { .header-inner { max-width: 1536px; } }
        .header-group { display: flex; align-items: center; gap: 2rem; }
        .app-title { display: none; font-size: 1.25rem; line-height: 1.75rem; font-weight: 700; color: #1f2937; }
        @media (min-width: 640px) { .app-title { display: block; } }
        .toolbar { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .field { display: flex; align-items: center; gap: 0.5rem; }
        .status { width: 100%; margin-top: 0.5rem; font-size: 0.875rem; line-height: 1.25rem; text-align: center; color: #4b5563; }
        @media (min-width: 640px) { .status { width: auto; margin-top: 0; } }
        .app-main { flex-grow: 1; display: grid; align-items: start; justify-items: center; overflow: auto; grid-template-columns: repeat(1, minmax(0, 1fr)); padding:1rem;gap:1.5rem;} @media (min-width:768px){.app-main{padding:1.5rem;}} @media (min-width:1024px){.app-main{grid-template-columns:repeat(2,minmax(0,1fr));}} 
        .panel { width: 100%; display: flex; flex-direction: column; align-items: center; }
        .app-footer { width: 100%; padding: 0.5rem; background-color: #fff; border-top-width: 1px; }
        .app-footer-plain { background-color: #f3f4f6; border-top-width: 0; }
        .footer-text { text-align: left; font-size: 0.75rem; line-height: 1rem; color: #6b7280; }
        .section-title { font-size: 1.25rem; line-height: 1.75rem; font-weight: 600; text-align: center; margin-bottom: 0.75rem; color: #374151; }
        .panel-title { font-size: 1.125rem; line-height: 1.75rem; font-weight: 600; text-align: center; margin-bottom: 0.75rem; color: #374151; }
        .panel-title-sm { margin-bottom: 0.5rem; }

        /* --- Controls --- */
        .label { font-size: 0.875rem; line-height: 1.25rem; font-weight: 500; color: #374151; }
        .btn { --ring-color: #3b82f6; color: #fff; padding: 0.5rem 1rem; border-radius: 0.5rem;
            outline: 2px solid transparent; outline-offset: 2px; transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-blue { background-color: #3b82f6; --ring-color: #3b82f6; }
        .btn-blue:hover { background-color: #2563eb; }
        .btn-green { background-color: #22c55e; --ring-color: #22c55e; }
        .btn-green:hover { background-color: #16a34a; }
        .select { background-color: #f9fafb; border: 1px solid #d1d5db; color: #111827; font-size: 0.875rem; line-height: 1.25rem;
            border-radius: 0.5rem; padding: 0.5rem; }
        .select:focus { border-color: #3b82f6; }
        .checkbox { height: 1rem; width: 1rem; border-radius: 0.25rem; border-color: #d1d5db; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
        .threshold-value { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.875rem; line-height: 1.25rem; color: #374151; width: 2rem; }

        .stack { width: 100%; display: grid; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 1.5rem; justify-items: center; }
        .thumb-grid { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; justify-items: center; }
        body { font-family: 'Inter', sans-serif; }
        .canvas-wrapper {
            background-image: url('data:image/svg+xml;utf8,<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M0 0h10v10H0z" fill="%23f0f0f0"/><path d="M10 10h10v10H10z" fill="%23f0f0f0"/><path d="M10 0h10v10H10z" fill="white"/><path d="M0 10h10v10H0z" fill="white"/></svg>');
            background-size: 20px 20px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 0.75rem; overflow: hidden;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.05);
            width: 100%; aspect-ratio: 1 / 1;
        }
        .sinogram-canvas-wrapper {
             background-image: none;
             background-color: #e5e7eb;
        }
        .small-canvas-wrapper { max-width: 250px; }
        .full-width-wrapper { max-width: 512px; }
        canvas, video { width: 100%; height: 100%; object-fit: contain; }
        button:disabled, #filter-checkbox:disabled { cursor: not-allowed; opacity: 0.5; }
        .active-btn {
            box-shadow: 0 0 0 2px #fff, 0 0 0 5px var(--ring-color);
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-inner">
            <h1 class="app-title">Color Radon Explorer</h1>
            <div class="toolbar">
                <button id="use-upload-btn" class="btn btn-blue">Upload</button>
                <button id="use-webcam-btn" class="btn btn-green">Webcam</button>
                <div class="field">
                    <label for="function-presets" class="label">or Preset:</label>
                    <select id="function-presets" class="select">
                        <!-- MODIFICATION: "Off-Center Point" is now the first (default) option -->
                        <option value="custom" id="custom-option" disabled hidden>Upload / Webcam</option>
                        <option value="single-point" selected>Off-Center Point</option>
                        <option value="venn-diagram">Venn Diagram (Color)</option>
                        <option value="two-circles">Two Circles (Color)</option>
                        <option value="embedded-squares">Embedded Squares (Color)</option>
                        <option value="shepp-logan">Shepp-Logan Phantom</option>
                        <option value="center-point">Center Point</option>
                        <option value="concentric-circles">Concentric Circles</option>
                        <option value="circle">Circle</option>
                        <option value="square">Square</option>
                    </select>
                </div>
                 <div class="field">
                    <input type="checkbox" id="filter-checkbox" class="checkbox" checked>
                    <label for="filter-checkbox" class="label">Use Filtered Back-Projection</label>
                </div>
                 <input type="file" id="image-upload" class="hidden" accept="image/png, image/jpeg">
            </div>
            <div id="status" class="status">Select a source to begin.</div>
        </div>
    </header>

    <main class="app-main">
        <div class="stack">
            <div class="panel">
                <h2 class="section-title">Source</h2>
                <div class="canvas-wrapper full-width-wrapper">
                    <video id="webcam-video" class="hidden" autoplay playsinline></video>
                    <canvas id="sourceCanvas"></canvas>
                </div>
            </div>
             <div class="panel">
                <h2 class="section-title">Reconstruction</h2>
                <div class="canvas-wrapper full-width-wrapper">
                    <canvas id="reconstructedCanvasFinal"></canvas>
                </div>
            </div>
        </div>
        <div class="thumb-grid">
             <div class="panel">
                <h3 class="panel-title panel-title-sm">Red Sinogram</h3>
                <div class="canvas-wrapper sinogram-canvas-wrapper small-canvas-wrapper"><canvas id="radonCanvasR"></canvas></div>
            </div>
             <div class="panel">
                <h3 class="panel-title panel-title-sm">Green Sinogram</h3>
                <div class="canvas-wrapper sinogram-canvas-wrapper small-canvas-wrapper"><canvas id="radonCanvasG"></canvas></div>
            </div>
             <div class="panel">
                <h3 class="panel-title panel-title-sm">Blue Sinogram</h3>
                <div class="canvas-wrapper sinogram-canvas-wrapper small-canvas-wrapper"><canvas id="radonCanvasB"></canvas></div>
            </div>
             <div class="panel">
                <h3 class="panel-title panel-title-sm">Grayscale Sinogram</h3>
                <div class="canvas-wrapper sinogram-canvas-wrapper small-canvas-wrapper"><canvas id="radonCanvasGray"></canvas></div>
            </div>
             <div class="panel">
                <h3 class="panel-title panel-title-sm">R Recon</h3>
                <div class="canvas-wrapper small-canvas-wrapper"><canvas id="reconstructedCanvasR"></canvas></div>
            </div>
            <div class="panel">
                <h3 class="panel-title panel-title-sm">G Recon</h3>
                <div class="canvas-wrapper small-canvas-wrapper"><canvas id="reconstructedCanvasG"></canvas></div>
            </div>
             <div class="panel">
                <h3 class="panel-title panel-title-sm">B Recon</h3>
                <div class="canvas-wrapper small-canvas-wrapper"><canvas id="reconstructedCanvasB"></canvas></div>
            </div>
        </div>
    </main>

    <footer class="app-footer">
        <p class="footer-text">NitaD, Univ. Paris-Saclay, 23 August 2025.</p>
    </footer>

    <script>
        // --- DOM Elements ---
        const $ = id => document.getElementById(id);
        const useUploadBtn = $('use-upload-btn'),
            useWebcamBtn = $('use-webcam-btn'),
            imageUpload = $('image-upload'),
            statusEl = $('status'),
            webcamVideo = $('webcam-video'),
            sourceCanvas = $('sourceCanvas'),
            sourceCtx = sourceCanvas.getContext('2d'),
            radonCtxR = $('radonCanvasR').getContext('2d'),
            radonCtxG = $('radonCanvasG').getContext('2d'),
            radonCtxB = $('radonCanvasB').getContext('2d'),
            radonCtxGray = $('radonCanvasGray').getContext('2d'),
            functionPresets = $('function-presets'),
            filterCheckbox = $('filter-checkbox'),
            reconstructedCtxR = $('reconstructedCanvasR').getContext('2d'),
            reconstructedCtxG = $('reconstructedCanvasG').getContext('2d'),
            reconstructedCtxB = $('reconstructedCanvasB').getContext('2d'),
            reconstructedCtxFinal = $('reconstructedCanvasFinal').getContext('2d');

        // --- Constants & State ---
        const IMG_SIZE = 256;
        const NUM_ANGLES = IMG_SIZE;
        const NUM_RHO = 2 * Math.ceil(Math.hypot(IMG_SIZE, IMG_SIZE) / 2) + 2;   // +2 margin for interpolation
        const TRANSPARENT_PRESETS = ['venn-diagram', 'two-circles'];

        let currentMode = null;
        let webcamStream = null, animationFrameId = null;
        let sourceImage = null, currentObjectURL = null;
        let pointPreset = null;          // generated once per selection, not per run
        let sourceVersion = 0;           // bumps whenever the source changes
        let busy = false, wantRun = false, jobId = 0;
        const jobs = new Map();

        // One reusable offscreen canvas for sampling images/video/presets
        const sampleCtx = Object.assign(document.createElement('canvas'), { width: IMG_SIZE, height: IMG_SIZE })
            .getContext('2d', { willReadFrequently: true });

        [sourceCanvas, reconstructedCtxFinal.canvas, reconstructedCtxR.canvas, reconstructedCtxG.canvas, reconstructedCtxB.canvas]
            .forEach(c => { c.width = c.height = IMG_SIZE; });

        // =====================================================================
        // Core math — self-contained functions (also shipped to the Worker).
        // Coordinates: pixel centers, y axis up, origin at image center.
        // Sinograms are flat Float32Arrays indexed [angle * numRho + rhoBin].
        // =====================================================================
        function radonTransform(ch, size, numAngles, numRho) {
            const out = new Float32Array(numAngles * numRho);
            const off = numRho / 2, c = size / 2;
            for (let t = 0; t < numAngles; t++) {
                const a = t * Math.PI / numAngles, cosA = Math.cos(a), sinA = Math.sin(a);
                const base = t * numRho;
                for (let y = 0; y < size; y++) {
                    const yTerm = (c - (y + 0.5)) * sinA + off;
                    const rowOff = y * size;
                    for (let x = 0; x < size; x++) {
                        const v = ch[rowOff + x];
                        if (v <= 0) continue;
                        const f = (x + 0.5 - c) * cosA + yTerm;
                        const i0 = Math.floor(f), w = f - i0;
                        if (i0 >= 0 && i0 + 1 < numRho) {
                            out[base + i0] += v * (1 - w);
                            out[base + i0 + 1] += v * w;
                        }
                    }
                }
            }
            return out;
        }

        // Ram-Lak (spatial, scaled x4): h[0]=1, h[odd n]=-4/(pi^2 n^2), h[even n]=0
        function filterSinogram(sino, numAngles, numRho) {
            const out = new Float32Array(sino.length);
            const k = new Float64Array(numRho);
            for (let n = 1; n < numRho; n += 2) k[n] = -4 / (Math.PI * Math.PI * n * n);
            for (let t = 0; t < numAngles; t++) {
                const base = t * numRho;
                for (let i = 0; i < numRho; i++) {
                    let sum = sino[base + i];
                    for (let n = 1; n < numRho; n += 2) {
                        const lo = i - n, hi = i + n;
                        if (lo >= 0) sum += sino[base + lo] * k[n];
                        if (hi < numRho) sum += sino[base + hi] * k[n];
                        else if (lo < 0) break;
                    }
                    out[base + i] = sum;
                }
            }
            return out;
        }

        function inverseRadonTransform(sino, size, numAngles, numRho) {
            const out = new Float32Array(size * size);
            const off = numRho / 2, c = size / 2;
            for (let t = 0; t < numAngles; t++) {
                const a = t * Math.PI / numAngles, cosA = Math.cos(a), sinA = Math.sin(a);
                const base = t * numRho;
                for (let y = 0; y < size; y++) {
                    const yTerm = (c - (y + 0.5)) * sinA + off;
                    const rowOff = y * size;
                    for (let x = 0; x < size; x++) {
                        const f = (x + 0.5 - c) * cosA + yTerm;
                        const i0 = Math.floor(f), w = f - i0;
                        if (i0 >= 0 && i0 + 1 < numRho) {
                            out[rowOff + x] += sino[base + i0] * (1 - w) + sino[base + i0 + 1] * w;
                        }
                    }
                }
            }
            return out;
        }

        function computeAll(job) {
            const t0 = performance.now();
            const { size, numAngles, numRho, useFilter, channels } = job;
            const sinos = channels.map(ch => radonTransform(ch, size, numAngles, numRho));
            const recons = sinos.map(s =>
                inverseRadonTransform(useFilter ? filterSinogram(s, numAngles, numRho) : s, size, numAngles, numRho));
            return { id: job.id, sinos, recons, ms: performance.now() - t0 };
        }

        // --- Worker (keeps the UI responsive); falls back to main thread if unavailable ---
        let worker = null;
        try {
            const workerSrc = [radonTransform, filterSinogram, inverseRadonTransform, computeAll].map(String).join('\n') +
                '\nself.onmessage = e => { const r = computeAll(e.data);' +
                ' self.postMessage(r, [...r.sinos, ...r.recons].map(a => a.buffer)); };';
            const workerURL = URL.createObjectURL(new Blob([workerSrc], { type: 'text/javascript' }));
            worker = new Worker(workerURL);
            worker.onmessage = e => handleResult(e.data);
            worker.onerror = err => {
                console.error('Worker error, falling back to main thread:', err);
                worker = null;
                busy = false; wantRun = true; pump();
            };
        } catch (err) {
            console.warn('Web Worker unavailable, computing on main thread.', err);
            worker = null;
        }

        // --- Job scheduling: at most one job at a time; newer requests coalesce ---
        function requestProcess() { wantRun = true; pump(); }

        function pump() {
            if (busy || !wantRun) return;
            wantRun = false;

            const src = getChannels();
            if (!src) return;   // nothing to process yet (e.g. video not ready)
            drawSourceToCanvas(src);

            const id = ++jobId;
            jobs.set(id, { version: sourceVersion, isTransparent: src.isTransparent });
            busy = true;
            if (currentMode !== 'webcam') statusEl.textContent = 'Processing...';

            const job = { id, size: IMG_SIZE, numAngles: NUM_ANGLES, numRho: NUM_RHO,
                          useFilter: filterCheckbox.checked, channels: [src.r, src.g, src.b] };
            if (worker) {
                worker.postMessage(job, job.channels.map(a => a.buffer));
            } else {
                setTimeout(() => handleResult(computeAll(job)), 0);   // yield so status renders
            }
        }

        function handleResult(res) {
            busy = false;
            const job = jobs.get(res.id);
            jobs.delete(res.id);

            if (job && job.version === sourceVersion) {
                const [sR, sG, sB] = res.sinos, [rR, rG, rB] = res.recons;
                drawSingleChannelSinogram(radonCtxR, sR, 0);
                drawSingleChannelSinogram(radonCtxG, sG, 1);
                drawSingleChannelSinogram(radonCtxB, sB, 2);
                drawGrayscaleSinogram(sR, sG, sB);
                drawReconstructedChannel(reconstructedCtxR, rR, 0, job.isTransparent);
                drawReconstructedChannel(reconstructedCtxG, rG, 1, job.isTransparent);
                drawReconstructedChannel(reconstructedCtxB, rB, 2, job.isTransparent);
                drawFinalReconstructed(reconstructedCtxFinal, rR, rG, rB, job.isTransparent);
                statusEl.textContent = currentMode === 'webcam'
                    ? `Live transform (${Math.round(res.ms)} ms/frame).`
                    : `Transform complete (${Math.round(res.ms)} ms).`;
            }
            pump();
        }

        // --- Event wiring ---
        useUploadBtn.addEventListener('click', () => imageUpload.click());   // mode changes only on successful load
        useWebcamBtn.addEventListener('click', () => { if (!(currentMode === 'webcam' && webcamStream)) setupMode('webcam'); });
        imageUpload.addEventListener('change', handleImageUpload);
        functionPresets.addEventListener('change', () => {
            if (functionPresets.value === 'single-point') pointPreset = makePointPreset();
            setupMode('function');
        });
        filterCheckbox.addEventListener('change', () => requestProcess());
        window.addEventListener('pagehide', stopWebcam);

        pointPreset = makePointPreset();
        setupMode('function');

        // --- Mode & Source Handling ---
        function setupMode(mode) {
            stopWebcam();
            currentMode = mode;
            sourceVersion++;
            useUploadBtn.classList.toggle('active-btn', mode === 'upload');
            useWebcamBtn.classList.toggle('active-btn', mode === 'webcam');
            webcamVideo.classList.add('hidden');
            sourceCanvas.classList.remove('hidden');
            if (mode !== 'function') functionPresets.value = 'custom';   // any later preset pick fires 'change'

            if (mode === 'webcam') startWebcam();
            else requestProcess();
        }

        async function startWebcam() {
            const version = sourceVersion;
            statusEl.textContent = 'Requesting webcam access...';
            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
            } catch (err) {
                console.error('Webcam error:', err);
                if (version === sourceVersion) {
                    statusEl.textContent = 'Could not access webcam.';
                    functionPresets.value = 'single-point';
                    setupMode('function');
                }
                return;
            }
            // User switched away while the permission prompt was open
            if (version !== sourceVersion || currentMode !== 'webcam') {
                stream.getTracks().forEach(t => t.stop());
                return;
            }
            webcamStream = stream;
            webcamVideo.srcObject = stream;
            if (webcamVideo.readyState < 1) {
                await new Promise(r => webcamVideo.addEventListener('loadedmetadata', r, { once: true }));
            }
            try { await webcamVideo.play(); } catch (e) { /* autoplay attribute covers most cases */ }
            if (version !== sourceVersion || webcamStream !== stream) return;

            webcamVideo.classList.remove('hidden');
            sourceCanvas.classList.add('hidden');
            statusEl.textContent = 'Live transform running...';
            webcamLoop();
        }

        function stopWebcam() {
            if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
            if (webcamStream) {
                webcamStream.getTracks().forEach(t => t.stop());
                webcamStream = null;
                webcamVideo.srcObject = null;
            }
        }

        // Only submits a new frame when the previous one has finished (drops frames instead of queuing)
        function webcamLoop() {
            if (!webcamStream) return;
            if (!busy && webcamVideo.videoWidth > 0) requestProcess();
            animationFrameId = requestAnimationFrame(webcamLoop);
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            imageUpload.value = '';   // allow re-uploading the same file
            if (!file) return;
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                if (currentObjectURL) URL.revokeObjectURL(currentObjectURL);
                currentObjectURL = url;
                sourceImage = img;
                setupMode('upload');
            };
            img.onerror = () => {
                URL.revokeObjectURL(url);
                statusEl.textContent = 'Could not load that image.';
            };
            img.src = url;
        }

        // --- Data Generation ---
        function getChannels() {
            const n = IMG_SIZE * IMG_SIZE;
            const r = new Float32Array(n), g = new Float32Array(n), b = new Float32Array(n);
            let isTransparent = false;

            if (currentMode === 'function') {
                const type = functionPresets.value;
                isTransparent = TRANSPARENT_PRESETS.includes(type);
                generatePresetChannels(type, r, g, b);
            } else {
                let source = null, sw = 0, sh = 0;
                if (currentMode === 'webcam' && webcamStream && webcamVideo.videoWidth > 0) {
                    source = webcamVideo; sw = webcamVideo.videoWidth; sh = webcamVideo.videoHeight;
                } else if (currentMode === 'upload' && sourceImage && sourceImage.naturalWidth > 0) {
                    source = sourceImage; sw = sourceImage.naturalWidth; sh = sourceImage.naturalHeight;
                }
                if (!source) return null;

                const ratio = Math.min(IMG_SIZE / sw, IMG_SIZE / sh);
                sampleCtx.globalCompositeOperation = 'source-over';
                sampleCtx.fillStyle = 'black';
                sampleCtx.fillRect(0, 0, IMG_SIZE, IMG_SIZE);
                sampleCtx.drawImage(source, 0, 0, sw, sh,
                    (IMG_SIZE - sw * ratio) / 2, (IMG_SIZE - sh * ratio) / 2, sw * ratio, sh * ratio);
                const d = sampleCtx.getImageData(0, 0, IMG_SIZE, IMG_SIZE).data;
                for (let i = 0; i < n; i++) {
                    r[i] = d[i * 4]; g[i] = d[i * 4 + 1]; b[i] = d[i * 4 + 2];
                }
            }
            return { r, g, b, isTransparent };
        }

        function makePointPreset() {
            const size = 4, minDist = IMG_SIZE * 0.15;
            let x, y;
            do {   // guarantee the point is actually off-center
                x = Math.floor(Math.random() * (IMG_SIZE - size));
                y = Math.floor(Math.random() * (IMG_SIZE - size));
            } while (Math.hypot(x + size / 2 - IMG_SIZE / 2, y + size / 2 - IMG_SIZE / 2) < minDist);

            const rgb = [0, 0, 0];
            const exclude = Math.floor(Math.random() * 3);
            for (let i = 0; i < 3; i++) if (i !== exclude) rgb[i] = 128 + Math.floor(Math.random() * 128);
            return { x, y, size, rgb };
        }

        function generatePresetChannels(type, rCh, gCh, bCh) {
            const S = IMG_SIZE;
            const drawShapeAndApply = (channel, drawFn) => {
                sampleCtx.save();
                sampleCtx.globalCompositeOperation = 'source-over';
                sampleCtx.clearRect(0, 0, S, S);
                drawFn(sampleCtx);
                sampleCtx.restore();
                const d = sampleCtx.getImageData(0, 0, S, S).data;
                for (let i = 0; i < channel.length; i++) channel[i] = Math.max(channel[i], d[i * 4]);
            };
            const disc = (cx, cy, rad) => ctx => { ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 2 * Math.PI); ctx.fill(); };

            if (type === 'venn-diagram') {
                const rad = S * 0.28, off = S * 0.15;
                drawShapeAndApply(rCh, disc(S / 2, S / 2 - off * 0.8, rad));
                drawShapeAndApply(gCh, disc(S / 2 - off, S / 2 + off * 0.8, rad));
                drawShapeAndApply(bCh, disc(S / 2 + off, S / 2 + off * 0.8, rad));
            } else if (type === 'two-circles') {
                drawShapeAndApply(rCh, disc(S * 0.3, S * 0.4, S * 0.25));
                drawShapeAndApply(bCh, disc(S * 0.7, S * 0.6, S * 0.25));
            } else if (type === 'embedded-squares') {
                drawShapeAndApply(rCh, ctx => { ctx.fillStyle = 'white'; ctx.fillRect(S * 0.1, S * 0.1, S * 0.8, S * 0.8); });
                drawShapeAndApply(gCh, ctx => { ctx.fillStyle = 'white'; ctx.fillRect(S * 0.3, S * 0.3, S * 0.4, S * 0.4); });
            } else if (type === 'single-point') {
                const { x, y, size, rgb } = pointPreset;
                for (let row = 0; row < size; row++) {
                    for (let col = 0; col < size; col++) {
                        const idx = (y + row) * S + (x + col);
                        rCh[idx] = rgb[0]; gCh[idx] = rgb[1]; bCh[idx] = rgb[2];
                    }
                }
            } else if (type === 'shepp-logan') {
                rCh.set(createSheppLoganData(S));
                gCh.set(rCh); bCh.set(rCh);
            } else {
                drawShapeAndApply(rCh, ctx => drawGrayscalePreset(type, ctx));
                gCh.set(rCh); bCh.set(rCh);
            }
        }

        function drawGrayscalePreset(type, ctx) {
            const S = IMG_SIZE;
            ctx.fillStyle = 'white';
            ctx.translate(S / 2, S / 2);
            if (type === 'circle') {
                ctx.beginPath(); ctx.arc(0, 0, S * 0.4, 0, 2 * Math.PI); ctx.fill();
            } else if (type === 'square') {
                ctx.fillRect(-S * 0.3, -S * 0.3, S * 0.6, S * 0.6);
            } else if (type === 'concentric-circles') {
                ctx.beginPath(); ctx.arc(0, 0, S * 0.45, 0, 2 * Math.PI); ctx.fill();
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath(); ctx.arc(0, 0, S * 0.25, 0, 2 * Math.PI); ctx.fill();
            } else if (type === 'center-point') {
                ctx.fillRect(-2, -2, 4, 4);
            }
        }

        // Modified (Toft) Shepp-Logan phantom, standard geometry.
        // [x0, y0, a (semi-axis along x), b (along y), angle (deg, CCW), gray]
        function createSheppLoganData(size) {
            const data = new Float32Array(size * size);
            const ellipses = [
                [ 0,     0,      0.69,   0.92,    0,   1.0],
                [ 0,    -0.0184, 0.6624, 0.874,   0,  -0.8],
                [ 0.22,  0,      0.11,   0.31,  -18,  -0.2],
                [-0.22,  0,      0.16,   0.41,   18,  -0.2],
                [ 0,     0.35,   0.21,   0.25,    0,   0.1],
                [ 0,     0.1,    0.046,  0.046,   0,   0.1],
                [ 0,    -0.1,    0.046,  0.046,   0,   0.1],
                [-0.08, -0.605,  0.046,  0.023,   0,   0.1],
                [ 0,    -0.606,  0.023,  0.023,   0,   0.1],
                [ 0.06, -0.605,  0.023,  0.046,   0,   0.1]
            ].map(([x0, y0, a, b, angle, gray]) => {
                const rad = angle * Math.PI / 180;
                return { x0, y0, a, b, cosA: Math.cos(rad), sinA: Math.sin(rad), gray };
            });
            const half = size / 2;
            for (let j = 0; j < size; j++) {
                const y = (half - (j + 0.5)) / half;   // y axis points up
                for (let i = 0; i < size; i++) {
                    const x = ((i + 0.5) - half) / half;
                    let sum = 0;
                    for (const e of ellipses) {
                        const dx = x - e.x0, dy = y - e.y0;
                        const u = ( dx * e.cosA + dy * e.sinA) / e.a;
                        const v = (-dx * e.sinA + dy * e.cosA) / e.b;
                        if (u * u + v * v <= 1) sum += e.gray;
                    }
                    data[j * size + i] = Math.max(0, Math.min(255, sum * 255));
                }
            }
            return data;
        }

        // --- Visualization ---
        function minMax(...arrays) {
            let min = Infinity, max = -Infinity;
            for (const a of arrays) for (let i = 0; i < a.length; i++) {
                const v = a[i];
                if (v < min) min = v;
                if (v > max) max = v;
            }
            return { min, range: max - min };
        }

        function fillBlack(ctx) {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        }

        function drawSourceToCanvas({ r, g, b, isTransparent }) {
            const img = sourceCtx.createImageData(IMG_SIZE, IMG_SIZE);
            for (let i = 0; i < r.length; i++) {
                const idx = i * 4;
                img.data[idx] = r[i]; img.data[idx + 1] = g[i]; img.data[idx + 2] = b[i];
                img.data[idx + 3] = (!isTransparent || r[i] > 0 || g[i] > 0 || b[i] > 0) ? 255 : 0;
            }
            sourceCtx.putImageData(img, 0, 0);
        }

        // Sinogram image: column = angle, row 0 = +rho max (rho axis points up)
        function sinogramToImage(ctx, sino, writePixel) {
            ctx.canvas.width = NUM_ANGLES;
            ctx.canvas.height = NUM_RHO;
            const img = ctx.createImageData(NUM_ANGLES, NUM_RHO);
            for (let t = 0; t < NUM_ANGLES; t++) {
                for (let r = 0; r < NUM_RHO; r++) {
                    const idx = ((NUM_RHO - 1 - r) * NUM_ANGLES + t) * 4;
                    writePixel(img.data, idx, t * NUM_RHO + r);
                    img.data[idx + 3] = 255;
                }
            }
            ctx.putImageData(img, 0, 0);
        }

        function drawSingleChannelSinogram(ctx, sino, channelIndex) {
            const { min, range } = minMax(sino);
            if (!(range > 1e-9)) { ctx.canvas.width = NUM_ANGLES; ctx.canvas.height = NUM_RHO; fillBlack(ctx); return; }
            const scale = 255 / range;
            sinogramToImage(ctx, sino, (d, idx, k) => { d[idx + channelIndex] = (sino[k] - min) * scale; });
        }

        function drawGrayscaleSinogram(sR, sG, sB) {
            const gray = new Float32Array(sR.length);
            for (let i = 0; i < gray.length; i++) gray[i] = (sR[i] + sG[i] + sB[i]) / 3;
            const { min, range } = minMax(gray);
            const ctx = radonCtxGray;
            if (!(range > 1e-9)) { ctx.canvas.width = NUM_ANGLES; ctx.canvas.height = NUM_RHO; fillBlack(ctx); return; }
            const scale = 255 / range;
            sinogramToImage(ctx, gray, (d, idx, k) => { d[idx] = d[idx + 1] = d[idx + 2] = (gray[k] - min) * scale; });
        }

        function drawReconstructedChannel(ctx, data, channelIndex, isTransparent) {
            const { width, height } = ctx.canvas;
            ctx.clearRect(0, 0, width, height);   // never leave a stale image behind
            const { min, range } = minMax(data);
            if (!(range > 1e-9)) { if (!isTransparent) fillBlack(ctx); return; }

            const threshold = min + range * 0.05, scale = 255 / range;
            const img = ctx.createImageData(width, height);
            for (let i = 0; i < data.length; i++) {
                const idx = i * 4;
                img.data[idx + channelIndex] = (data[i] - min) * scale;
                img.data[idx + 3] = (!isTransparent || data[i] > threshold) ? 255 : 0;
            }
            ctx.putImageData(img, 0, 0);
        }

        function drawFinalReconstructed(ctx, rData, gData, bData, isTransparent) {
            const { width, height } = ctx.canvas;
            ctx.clearRect(0, 0, width, height);
            const { min, range } = minMax(rData, gData, bData);   // joint scale keeps color balance
            if (!(range > 1e-9)) { if (!isTransparent) fillBlack(ctx); return; }

            const threshold = min + range * 0.05, scale = 255 / range;
            const img = ctx.createImageData(width, height);
            for (let i = 0; i < rData.length; i++) {
                const idx = i * 4;
                img.data[idx]     = (rData[i] - min) * scale;
                img.data[idx + 1] = (gData[i] - min) * scale;
                img.data[idx + 2] = (bData[i] - min) * scale;
                const background = rData[i] < threshold && gData[i] < threshold && bData[i] < threshold;
                img.data[idx + 3] = (isTransparent && background) ? 0 : 255;
            }
            ctx.putImageData(img, 0, 0);
        }
    </script>
