<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Hough Explorer</title>
    <link href="./dist/output.css" rel="stylesheet" onerror="(function(){var s=document.createElement('script');s.src='https://cdn.tailwindcss.com';document.head.appendChild(s);})()">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .canvas-wrapper {
            background-color: #e5e7eb; /* gray-200 */
            display: grid;
            place-items: center;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 512px;
            aspect-ratio: 1 / 1;
        }
        .canvas-wrapper > canvas {
            grid-area: 1 / 1 / 2 / 2;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
         .projection-wrapper {
            background-color: #e5e7eb; /* gray-200 */
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 512px;
            height: 80px;
        }
        .overlay-canvas {
            pointer-events: none;
        }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .active-btn {
            --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);
            --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(3px + var(--tw-ring-offset-width)) var(--tw-ring-color);
            box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            background: #d1d5db; /* gray-300 */
            height: 0.5rem;
            border-radius: 0.25rem;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 1rem;
            width: 1rem;
            border-radius: 9999px;
            background: #3b82f6; /* blue-500 */
            cursor: pointer;
            margin-top: -0.25rem;
        }
    </style>
</head>
<body class="flex flex-col h-screen bg-gray-100 overflow-hidden">

    <header class="bg-white p-3 shadow-md w-full z-10">
        <div class="container mx-auto flex items-center justify-between flex-wrap gap-4">
            <h1 class="text-xl font-bold text-gray-800 hidden sm:block">2D Hough Explorer</h1>
            <div class="flex items-center gap-4 flex-wrap">
                <button id="use-upload-btn" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 focus:outline-none ring-blue-500 ring-offset-2 transition-all duration-200">
                    Upload Image
                </button>
                <div class="flex items-center gap-2">
                    <label for="function-presets" class="text-sm font-medium text-gray-700">or select a Preset:</label>
                    <select id="function-presets" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2">
                        <option value="custom" disabled hidden>Uploaded image</option>
                        <option value="simple-line" selected>Simple Line</option>
                        <option value="intersecting-lines">Intersecting Lines</option>
                        <option value="parallel-lines">Parallel Lines</option>
                        <option value="triangle">Triangle</option>
                        <option value="square">Square</option>
                        <option value="circle">Circle</option>
                        <option value="ellipse">Ellipse</option>
                        <option value="star">Star</option>
                        <option value="building">Building Facade</option>
                        <option value="sudoku">Sudoku Grid</option>
                    </select>
                </div>
                 <div class="flex items-center gap-2">
                    <label for="threshold-slider" class="text-sm font-medium text-gray-700">Detection Threshold:</label>
                    <input type="range" id="threshold-slider" min="0" max="100" value="60">
                    <span id="threshold-value" class="text-sm font-mono text-gray-700 w-8">60</span>
                </div>
                 <input type="file" id="image-upload" class="hidden" accept="image/png, image/jpeg">
            </div>
            <div id="status" class="w-full sm:w-auto text-sm text-center text-gray-600 mt-2 sm:mt-0">Select a source to begin.</div>
        </div>
    </header>

    <main class="flex-grow p-4 md:p-8 grid grid-cols-1 md:grid-cols-3 gap-8 items-start justify-items-center overflow-auto">
        <div class="w-full flex flex-col items-center">
            <h3 class="text-lg font-semibold text-center mb-3 text-gray-700">Source</h3>
            <div class="relative w-full max-w-[512px] flex flex-col items-center">
                <div id="source-wrapper" class="canvas-wrapper">
                    <canvas id="sourceCanvas"></canvas>
                    <canvas id="sourceOverlayCanvas" class="overlay-canvas"></canvas>
                </div>
            </div>
             <div class="w-full max-w-[512px]">
                <div id="sweep-container" class="w-full mt-4">
                    <input type="range" id="sweep-slider" min="0" value="0">
                    <label for="sweep-slider" class="block text-center text-sm font-medium text-gray-700 mt-1">Sweep Angle (θ): <span id="sweep-value" class="font-mono">0</span>°</label>
                </div>
            </div>
        </div>
        <div class="w-full flex flex-col items-center">
            <h3 class="text-lg font-semibold text-center mb-3 text-gray-700">Hough Space</h3>
             <div class="relative w-full max-w-[512px]">
                <p class="absolute -left-8 top-1/2 -translate-y-1/2 -rotate-90 text-sm text-gray-600 bg-gray-100 px-2">Position (ρ)</p>
                <div id="hough-wrapper" class="canvas-wrapper relative">
                    <canvas id="houghCanvas"></canvas>
                    <canvas id="houghOverlayCanvas" class="overlay-canvas"></canvas>
                </div>
                <p id="rho-max-label" class="absolute left-0 top-0 -translate-x-full pr-1 text-xs text-gray-500"></p>
                <p id="rho-min-label" class="absolute left-0 bottom-0 -translate-x-full pr-1 text-xs text-gray-500"></p>
                <p class="absolute -bottom-5 left-0 text-xs text-gray-500">0°</p>
                <p class="absolute -bottom-5 right-0 text-xs text-gray-500">180°</p>
             </div>
            <div class="w-full max-w-[512px] mt-8">
                 <p class="text-sm text-center text-gray-600 mt-1 mb-2">Projection Profile at θ = <span id="sweep-value-2" class="font-mono">0</span>°</p>
                 <div class="projection-wrapper">
                    <canvas id="projectionCanvas"></canvas>
                 </div>
            </div>
        </div>
        <div class="w-full flex flex-col items-center">
            <h3 class="text-lg font-semibold text-center mb-3 text-gray-700">Detected Lines</h3>
             <div class="relative w-full max-w-[512px] flex flex-col items-center">
                <div id="recon-wrapper" class="canvas-wrapper">
                    <canvas id="detectionCanvas"></canvas>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full p-2 bg-gray-100">
        <p class="text-left text-xs text-gray-500">
            NitaD, Univ. Paris-Saclay, 24 July 2025
        </p>
    </footer>

    <script>
        // --- DOM Elements ---
        const $ = id => document.getElementById(id);
        const useUploadBtn = $('use-upload-btn'),
            imageUpload = $('image-upload'),
            statusEl = $('status'),
            sourceCanvas = $('sourceCanvas'),
            sourceCtx = sourceCanvas.getContext('2d', { willReadFrequently: true }),
            houghCanvas = $('houghCanvas'),
            houghCtx = houghCanvas.getContext('2d'),
            projectionCanvas = $('projectionCanvas'),
            projectionCtx = projectionCanvas.getContext('2d'),
            detectionCanvas = $('detectionCanvas'),
            detectionCtx = detectionCanvas.getContext('2d'),
            functionPresets = $('function-presets'),
            thresholdSlider = $('threshold-slider'),
            thresholdValueEl = $('threshold-value'),
            rhoMaxLabel = $('rho-max-label'),
            rhoMinLabel = $('rho-min-label'),
            sourceOverlayCanvas = $('sourceOverlayCanvas'),
            sourceOverlayCtx = sourceOverlayCanvas.getContext('2d'),
            houghOverlayCanvas = $('houghOverlayCanvas'),
            houghOverlayCtx = houghOverlayCanvas.getContext('2d'),
            sweepSlider = $('sweep-slider'),
            sweepValue = $('sweep-value'),
            sweepValue2 = $('sweep-value-2');

        // --- Constants & State ---
        const IMG_SIZE = 256;
        const NUM_ANGLES = 180;
        const RHO_MAX = Math.hypot(IMG_SIZE, IMG_SIZE) / 2;
        const RHO_OFFSET = Math.ceil(RHO_MAX);      // bin index of ρ = 0
        const NUM_RHO = 2 * RHO_OFFSET + 1;         // symmetric: bins for ρ = −RHO_OFFSET … +RHO_OFFSET

        const MIN_VOTES = 10;          // never report a "line" with fewer edge pixels than this
        const MAX_LINES = 60;          // cap on drawn lines
        const NMS_RADIUS = 1;          // local-maximum window in the accumulator (±bins); nearby maxima are merged below
        const MERGE_THETA = 3;         // peaks closer than this (θ bins) …
        const MERGE_RHO = 4;           // … and this (ρ bins) are the same line (e.g. both sides of a stroke)

        let currentMode = 'function';
        let sourceImage = null, currentObjectURL = null;
        let accumulator = [], maxAccumulatorValue = 0, edgeCount = 0;
        let currentLines = [];   // declared before the first performTransform() call
        const cosAngles = new Float64Array(NUM_ANGLES), sinAngles = new Float64Array(NUM_ANGLES);

        // --- Initial Setup ---
        [sourceCanvas, detectionCanvas, sourceOverlayCanvas].forEach(c => c.width = c.height = IMG_SIZE);
        projectionCanvas.width = NUM_RHO;
        projectionCanvas.height = 80;
        for (let i = 0; i < NUM_ANGLES; i++) {
            const a = i * Math.PI / NUM_ANGLES;
            cosAngles[i] = Math.cos(a);
            sinAngles[i] = Math.sin(a);
        }
        sweepSlider.max = NUM_ANGLES - 1;
        rhoMaxLabel.textContent = `+${RHO_OFFSET}`;
        rhoMinLabel.textContent = `-${RHO_OFFSET}`;

        useUploadBtn.addEventListener('click', () => imageUpload.click());   // mode changes only once an image loads
        imageUpload.addEventListener('change', handleImageUpload);
        functionPresets.addEventListener('change', () => { setupMode('function'); performTransform(); });
        sweepSlider.addEventListener('input', e => handleSliderChange(parseInt(e.target.value, 10)));
        thresholdSlider.addEventListener('input', e => {
            thresholdValueEl.textContent = e.target.value;
            drawDetectedLines();
        });

        setupMode('function');
        performTransform();

        // --- Mode Setup ---
        function setupMode(mode) {
            currentMode = mode;
            useUploadBtn.classList.toggle('active-btn', mode === 'upload');
            if (mode === 'upload') functionPresets.value = 'custom';   // any later preset pick fires 'change'
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            imageUpload.value = '';   // allow re-uploading the same file
            if (!file) return;
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                if (currentObjectURL) URL.revokeObjectURL(currentObjectURL);
                currentObjectURL = url;
                sourceImage = img;
                setupMode('upload');
                performTransform();
            };
            img.onerror = () => {
                URL.revokeObjectURL(url);
                statusEl.textContent = 'Could not load that image.';
            };
            img.src = url;
        }

        // --- Main Execution ---
        function performTransform() {
            const startTime = performance.now();

            if (currentMode === 'function') generateFromFunction();
            else if (currentMode === 'upload' && sourceImage) drawSourceToCanvas(sourceImage);

            const edges = detectEdges(sourceCtx.getImageData(0, 0, IMG_SIZE, IMG_SIZE));
            const result = houghTransform(edges);
            accumulator = result.accumulator;
            maxAccumulatorValue = result.maxVotes;
            edgeCount = result.edgeCount;

            drawAccumulator();
            sweepSlider.value = 0;
            const n = drawDetectedLines();

            statusEl.textContent = `Transform complete (${Math.round(performance.now() - startTime)} ms) · ${edgeCount} edge px · ${n} line${n === 1 ? '' : 's'}.`;
        }

        // --- Edge detection: Sobel + non-maximum suppression (thin, 1-px edges) ---
        function detectEdges(imageData) {
            const W = imageData.width, H = imageData.height, src = imageData.data;
            const gray = new Float32Array(W * H);
            for (let i = 0; i < W * H; i++) {
                gray[i] = src[i * 4] * 0.299 + src[i * 4 + 1] * 0.587 + src[i * 4 + 2] * 0.114;
            }

            const mag = new Float32Array(W * H), gxA = new Float32Array(W * H), gyA = new Float32Array(W * H);
            let maxMag = 0;
            for (let y = 1; y < H - 1; y++) {
                for (let x = 1; x < W - 1; x++) {
                    const i = y * W + x;
                    const tl = gray[i - W - 1], t = gray[i - W], tr = gray[i - W + 1];
                    const l = gray[i - 1], r = gray[i + 1];
                    const bl = gray[i + W - 1], b = gray[i + W], br = gray[i + W + 1];
                    const gx = (tr + 2 * r + br) - (tl + 2 * l + bl);
                    const gy = (bl + 2 * b + br) - (tl + 2 * t + tr);
                    gxA[i] = gx; gyA[i] = gy;
                    const m = Math.hypot(gx, gy);
                    mag[i] = m;
                    if (m > maxMag) maxMag = m;
                }
            }

            // Threshold adapts to image contrast (a fixed value fails on dim or noisy photos)
            const threshold = Math.max(40, 0.2 * maxMag);
            const edges = new Uint8Array(W * H);
            for (let y = 1; y < H - 1; y++) {
                for (let x = 1; x < W - 1; x++) {
                    const i = y * W + x, m = mag[i];
                    if (m < threshold) continue;
                    // Compare with the two neighbours along the gradient direction (quantized to 4 directions)
                    const ang = Math.atan2(gyA[i], gxA[i]);
                    const d = ((Math.round(ang / (Math.PI / 4)) % 4) + 4) % 4;
                    let n1, n2;
                    if (d === 0)      { n1 = mag[i - 1];     n2 = mag[i + 1]; }
                    else if (d === 1) { n1 = mag[i - W - 1]; n2 = mag[i + W + 1]; }
                    else if (d === 2) { n1 = mag[i - W];     n2 = mag[i + W]; }
                    else              { n1 = mag[i - W + 1]; n2 = mag[i + W - 1]; }
                    if (m >= n1 && m > n2) edges[i] = 1;   // asymmetric test keeps exactly one pixel on plateaus
                }
            }
            return { edges, width: W, height: H };
        }

        // --- Hough transform (pixel centers, y axis up) ---
        function houghTransform({ edges, width, height }) {
            const acc = Array.from({ length: NUM_ANGLES }, () => new Uint32Array(NUM_RHO));
            const cx = width / 2, cy = height / 2;
            let maxVotes = 0, count = 0;
            for (let y = 0; y < height; y++) {
                const ym = cy - (y + 0.5);
                for (let x = 0; x < width; x++) {
                    if (!edges[y * width + x]) continue;
                    count++;
                    const xm = x + 0.5 - cx;
                    for (let t = 0; t < NUM_ANGLES; t++) {
                        const r = Math.round(xm * cosAngles[t] + ym * sinAngles[t]) + RHO_OFFSET;
                        if (r >= 0 && r < NUM_RHO) {
                            const v = ++acc[t][r];
                            if (v > maxVotes) maxVotes = v;
                        }
                    }
                }
            }
            return { accumulator: acc, maxVotes, edgeCount: count };
        }

        // Neighbour cell (t + dt, r + dr) with correct wrap-around: (θ ± π, ρ) ≡ (θ, −ρ)
        function neighbour(t, r, dt, dr) {
            let nt = t + dt, nr = r + dr;
            if (nt < 0 || nt >= NUM_ANGLES) {
                nt = (nt + NUM_ANGLES) % NUM_ANGLES;
                nr = 2 * RHO_OFFSET - nr;   // mirror ρ
            }
            return nr >= 0 && nr < NUM_RHO ? [nt, nr] : null;
        }

        function findAccumulatorPeaks() {
            if (accumulator.length === 0 || maxAccumulatorValue === 0) return [];
            const threshold = Math.max(MIN_VOTES, (thresholdSlider.value / 100) * maxAccumulatorValue);

            // 1. Strict local maxima with deterministic tie-breaking (plateaus yield one cell)
            const candidates = [];
            for (let t = 0; t < NUM_ANGLES; t++) {
                const row = accumulator[t];
                for (let r = 0; r < NUM_RHO; r++) {
                    const votes = row[r];
                    if (votes === 0 || votes < threshold) continue;
                    const selfKey = t * NUM_RHO + r;
                    let isPeak = true;
                    for (let dt = -NMS_RADIUS; dt <= NMS_RADIUS && isPeak; dt++) {
                        for (let dr = -NMS_RADIUS; dr <= NMS_RADIUS; dr++) {
                            if (dt === 0 && dr === 0) continue;
                            const nb = neighbour(t, r, dt, dr);
                            if (!nb) continue;
                            const nv = accumulator[nb[0]][nb[1]];
                            if (nv > votes || (nv === votes && nb[0] * NUM_RHO + nb[1] < selfKey)) { isPeak = false; break; }
                        }
                    }
                    if (isPeak) candidates.push({ t, r, votes });
                }
            }
            candidates.sort((a, b) => b.votes - a.votes);

            // 2. Merge nearby peaks into one line (both edges of a stroke, quantization splits),
            //    using a vote-weighted mean position.
            const lines = [];
            for (const c of candidates) {
                let merged = false;
                for (const L of lines) {
                    // Express c in L's frame, handling the θ wrap
                    let dt = c.t - L.t0, rho = c.r - RHO_OFFSET;
                    if (dt > NUM_ANGLES / 2) { dt -= NUM_ANGLES; rho = -rho; }
                    else if (dt < -NUM_ANGLES / 2) { dt += NUM_ANGLES; rho = -rho; }
                    const lTheta = L.tSum / L.w, lRho = L.rSum / L.w;
                    if (Math.abs(L.t0 + dt - lTheta) <= MERGE_THETA && Math.abs(rho - lRho) <= MERGE_RHO) {
                        L.tSum += (L.t0 + dt) * c.votes;
                        L.rSum += rho * c.votes;
                        L.w += c.votes;
                        L.votes = Math.max(L.votes, c.votes);
                        merged = true;
                        break;
                    }
                }
                if (!merged) {
                    if (lines.length >= MAX_LINES) continue;
                    lines.push({ t0: c.t, tSum: c.t * c.votes, rSum: (c.r - RHO_OFFSET) * c.votes, w: c.votes, votes: c.votes });
                }
            }
            return lines.map(L => ({
                theta: (L.tSum / L.w) * Math.PI / NUM_ANGLES,   // may slightly exceed [0, π) — still a valid line
                rho: L.rSum / L.w,
                votes: L.votes
            }));
        }

        // --- Visualization ---
        function drawAccumulator() {
            houghCanvas.width = houghOverlayCanvas.width = NUM_ANGLES;
            houghCanvas.height = houghOverlayCanvas.height = NUM_RHO;
            const img = houghCtx.createImageData(NUM_ANGLES, NUM_RHO);
            for (let i = 3; i < img.data.length; i += 4) img.data[i] = 255;   // opaque black default
            if (maxAccumulatorValue > 0) {
                for (let t = 0; t < NUM_ANGLES; t++) {
                    for (let r = 0; r < NUM_RHO; r++) {
                        const val = Math.sqrt(accumulator[t][r] / maxAccumulatorValue) * 255;
                        const idx = ((NUM_RHO - 1 - r) * NUM_ANGLES + t) * 4;   // +ρ at top
                        img.data[idx] = img.data[idx + 1] = img.data[idx + 2] = val;
                    }
                }
            }
            houghCtx.putImageData(img, 0, 0);
        }

        function drawDetectedLines() {
            currentLines = findAccumulatorPeaks();

            detectionCtx.fillStyle = 'black';
            detectionCtx.fillRect(0, 0, IMG_SIZE, IMG_SIZE);
            detectionCtx.save();
            // Math coords (y up, origin at image center) → canvas; pixel centers land on integer + 0.5
            detectionCtx.translate(IMG_SIZE / 2, IMG_SIZE / 2);
            detectionCtx.strokeStyle = 'white';
            detectionCtx.lineWidth = 1;
            const L = IMG_SIZE * 2;
            for (const { theta, rho } of currentLines) {
                const c = Math.cos(theta), s = Math.sin(theta);
                const x0 = rho * c, y0 = rho * s;
                detectionCtx.beginPath();
                detectionCtx.moveTo(x0 - L * s, -(y0 + L * c));
                detectionCtx.lineTo(x0 + L * s, -(y0 - L * c));
                detectionCtx.stroke();
            }
            detectionCtx.restore();

            handleSliderChange(parseInt(sweepSlider.value, 10));
            return currentLines.length;
        }

        // --- Preset Generation ---
        function generateFromFunction() {
            const type = functionPresets.value;
            sourceCtx.fillStyle = 'black';
            sourceCtx.fillRect(0, 0, IMG_SIZE, IMG_SIZE);
            sourceCtx.save();
            sourceCtx.translate(IMG_SIZE / 2, IMG_SIZE / 2);
            sourceCtx.strokeStyle = 'white';
            sourceCtx.lineWidth = 2;

            const drawLine = (x1, y1, x2, y2) => {
                sourceCtx.beginPath(); sourceCtx.moveTo(x1, y1); sourceCtx.lineTo(x2, y2); sourceCtx.stroke();
            };

            switch (type) {
                case 'simple-line':
                    drawLine(-90, 60, 90, -50);
                    break;
                case 'triangle': {
                    const p1 = [-80, -70], p2 = [90, -50], p3 = [10, 80];
                    drawLine(p1[0], -p1[1], p2[0], -p2[1]);
                    drawLine(p2[0], -p2[1], p3[0], -p3[1]);
                    drawLine(p3[0], -p3[1], p1[0], -p1[1]);
                    break;
                }
                case 'square': {
                    const size = 150;
                    sourceCtx.strokeRect(-size / 2, -size / 2, size, size);
                    break;
                }
                case 'parallel-lines':
                    for (let i = -4; i <= 4; i++) {
                        const offset = i * 20;
                        drawLine(-120, -100 + offset, 120, 80 + offset);
                    }
                    break;
                case 'intersecting-lines':
                    drawLine(-100, -80, 100, 60);
                    drawLine(-100, 80, 100, -60);
                    break;
                case 'circle':
                    sourceCtx.beginPath();
                    sourceCtx.arc(0, 0, 80, 0, 2 * Math.PI);
                    sourceCtx.stroke();
                    break;
                case 'ellipse':
                    sourceCtx.beginPath();
                    sourceCtx.ellipse(0, 0, 90, 60, 0, 0, 2 * Math.PI);
                    sourceCtx.stroke();
                    break;
                case 'star': {
                    const spikes = 5, outerRadius = 100, innerRadius = 40;
                    let rot = Math.PI / 2 * 3;
                    sourceCtx.beginPath();
                    for (let i = 0; i < spikes; i++) {
                        sourceCtx.lineTo(Math.cos(rot) * outerRadius, Math.sin(rot) * outerRadius);
                        rot += Math.PI / spikes;
                        sourceCtx.lineTo(Math.cos(rot) * innerRadius, Math.sin(rot) * innerRadius);
                        rot += Math.PI / spikes;
                    }
                    sourceCtx.closePath();
                    sourceCtx.stroke();
                    break;
                }
                case 'building': {
                    sourceCtx.lineWidth = 3;
                    const w = 40, h = 30, gap = 15;
                    for (let r = -2; r < 2; r++) {
                        for (let c = -2; c < 2; c++) {
                            const x = (c + 0.5) * (w + gap), y = (r + 0.5) * (h + gap);
                            sourceCtx.strokeRect(x - w / 2, y - h / 2, w, h);
                        }
                    }
                    break;
                }
                case 'sudoku': {
                    const gridSize = 198, cellSize = gridSize / 9;
                    for (let i = 0; i <= 9; i++) {
                        const pos = -gridSize / 2 + i * cellSize;
                        sourceCtx.lineWidth = (i % 3 === 0) ? 2.5 : 1;   // stroked per line so widths apply
                        drawLine(pos, -gridSize / 2, pos, gridSize / 2);
                        drawLine(-gridSize / 2, pos, gridSize / 2, pos);
                    }
                    break;
                }
            }
            sourceCtx.restore();
        }

        function drawSourceToCanvas(source) {
            sourceCtx.fillStyle = 'black';
            sourceCtx.fillRect(0, 0, IMG_SIZE, IMG_SIZE);
            const sw = source.naturalWidth, sh = source.naturalHeight;
            const ratio = Math.min(IMG_SIZE / sw, IMG_SIZE / sh);
            sourceCtx.drawImage(source, 0, 0, sw, sh,
                (IMG_SIZE - sw * ratio) / 2, (IMG_SIZE - sh * ratio) / 2, sw * ratio, sh * ratio);
        }

        function drawProjectionProfile(t) {
            const w = projectionCanvas.width, h = projectionCanvas.height;
            projectionCtx.clearRect(0, 0, w, h);
            if (!accumulator.length) return;
            const col = accumulator[t];
            let maxVal = 0;
            for (let i = 0; i < col.length; i++) if (col[i] > maxVal) maxVal = col[i];
            if (maxVal === 0) return;

            const scaleY = (h - 2) / maxVal, scaleX = w / col.length;
            projectionCtx.beginPath();
            projectionCtx.moveTo(0, h);
            for (let i = 0; i < col.length; i++) projectionCtx.lineTo((i + 0.5) * scaleX, h - col[i] * scaleY);
            projectionCtx.lineTo(w, h);
            projectionCtx.closePath();
            projectionCtx.fillStyle = 'rgba(59, 130, 246, 0.5)';
            projectionCtx.strokeStyle = 'rgba(59, 130, 246, 1)';
            projectionCtx.lineWidth = 2;
            projectionCtx.fill();
            projectionCtx.stroke();
        }

        // --- Interactive Guides ---
        function handleSliderChange(t) {
            const angleDeg = Math.round(t * 180 / NUM_ANGLES);
            sweepValue.textContent = angleDeg;
            sweepValue2.textContent = angleDeg;
            drawProjectionProfile(t);

            const W = sourceOverlayCanvas.width, H = sourceOverlayCanvas.height;
            const cx = W / 2, cy = H / 2, theta = t * Math.PI / NUM_ANGLES;
            const cos_t = cosAngles[t], sin_t = sinAngles[t], len = Math.max(W, H);

            sourceOverlayCtx.clearRect(0, 0, W, H);
            sourceOverlayCtx.strokeStyle = 'rgba(255, 0, 0, 0.7)';
            sourceOverlayCtx.lineWidth = 1;
            sourceOverlayCtx.setLineDash([5, 5]);
            sourceOverlayCtx.beginPath();
            sourceOverlayCtx.moveTo(cx - len * cos_t, cy + len * sin_t);
            sourceOverlayCtx.lineTo(cx + len * cos_t, cy - len * sin_t);
            sourceOverlayCtx.stroke();
            sourceOverlayCtx.setLineDash([]);

            // Angle arc (canvas angles are clockwise, so −θ draws the math angle)
            sourceOverlayCtx.strokeStyle = 'rgba(255, 165, 0, 0.9)';
            sourceOverlayCtx.lineWidth = 2;
            sourceOverlayCtx.beginPath();
            sourceOverlayCtx.arc(cx, cy, 25, 0, -theta, true);
            sourceOverlayCtx.stroke();

            // Hough space: sweep line + detected peak markers
            houghOverlayCtx.clearRect(0, 0, houghOverlayCanvas.width, houghOverlayCanvas.height);
            houghOverlayCtx.strokeStyle = 'rgba(255, 165, 0, 0.9)';
            houghOverlayCtx.lineWidth = 2;
            houghOverlayCtx.beginPath();
            houghOverlayCtx.moveTo(t + 0.5, 0);
            houghOverlayCtx.lineTo(t + 0.5, houghOverlayCanvas.height);
            houghOverlayCtx.stroke();

            houghOverlayCtx.strokeStyle = 'rgba(239, 68, 68, 0.95)';
            houghOverlayCtx.lineWidth = 1.5;
            for (const { theta: th, rho } of currentLines) {
                let tb = th * NUM_ANGLES / Math.PI, rb = rho;
                if (tb < 0) { tb += NUM_ANGLES; rb = -rb; }
                else if (tb >= NUM_ANGLES) { tb -= NUM_ANGLES; rb = -rb; }
                const px = tb + 0.5, py = NUM_RHO - 0.5 - (rb + RHO_OFFSET);
                houghOverlayCtx.beginPath();
                houghOverlayCtx.arc(px, py, 4, 0, 2 * Math.PI);
                houghOverlayCtx.stroke();
            }
        }
    </script>
