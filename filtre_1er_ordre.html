<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtres Électroniques RC (1er Ordre)</title>
    
    <!-- Plotly.js for charting -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    
    <style>
        /* Reset (replaces Tailwind preflight) */
        *, ::before, ::after { box-sizing: border-box; border-width: 0; border-style: solid; border-color: #e5e7eb; }
        html { line-height: 1.5; -webkit-text-size-adjust: 100%; font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; }
        body, h1, p, hr, div { margin: 0; }
        hr { height: 0; color: inherit; border-top-width: 1px; }
        h1 { font-size: inherit; font-weight: inherit; }
        button, input, select, textarea { font-family: inherit; font-size: 100%; font-weight: inherit; line-height: inherit; color: inherit; margin: 0; padding: 0; }
        button, select { text-transform: none; }
        svg, img, canvas { display: block; vertical-align: middle; }

        /* Layout */
        .app-body { color: #1e293b; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .sidebar { width: 100%; background: #fff; border-right-width: 1px; border-color: #e2e8f0; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); display: flex; flex-direction: column; height: 40vh; z-index: 10; flex-shrink: 0; }
        .sidebar-header { padding: 1rem; border-bottom-width: 1px; border-color: #e2e8f0; background: #f8fafc; }
        .sidebar-title { font-size: 1.25rem; line-height: 1.75rem; font-weight: 700; color: #1e293b; line-height: 1.25; }
        .sidebar-subtitle { font-size: 0.875rem; line-height: 1.25rem; font-weight: 400; color: #64748b; }
        .sidebar-body { padding: 1.25rem; flex: 1 1 0%; overflow-y: auto; }
        .sidebar-body > :not([hidden]) ~ :not([hidden]) { margin-top: 1.5rem; }
        .field-label { font-size: 0.875rem; line-height: 1.25rem; font-weight: 600; }
        .field-label-block { display: block; margin-bottom: 0.25rem; }
        .field-label-green { color: #047857; }
        .field-head { display: flex; justify-content: space-between; margin-bottom: 0.25rem; }
        .unit-label { font-size: 0.75rem; line-height: 1rem; color: #64748b; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
        .field-row { display: flex; align-items: center; }
        .field-row > :not([hidden]) ~ :not([hidden]) { margin-left: 0.5rem; }
        .divider { border-color: #e2e8f0; }
        .select-field { width: 100%; border-width: 1px; border-color: #cbd5e1; border-radius: 0.375rem; padding: 0.5rem; background-color: #f8fafc; outline: 2px solid transparent; outline-offset: 2px; }
        .select-field:focus { box-shadow: 0 0 0 2px #3b82f6; }
        .range-input { width: 66.666667%; }
        .range-blue { accent-color: #2563eb; }
        .range-green { accent-color: #059669; }
        .num-input { width: 33.333333%; border-width: 1px; border-color: #cbd5e1; border-radius: 0.25rem; padding: 0.25rem; font-size: 0.875rem; line-height: 1.25rem; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; text-align: right; }
        .num-input:focus { outline: 2px solid transparent; outline-offset: 2px; }
        .num-blue:focus { box-shadow: 0 0 0 2px #3b82f6; }
        .num-green:focus { box-shadow: 0 0 0 2px #10b981; }
        .readout { padding: 1rem; background: #1e293b; color: #fff; box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.05); }
        .readout-label { font-size: 0.875rem; line-height: 1.25rem; color: #cbd5e1; margin-bottom: 0.25rem; }
        .readout-value { font-size: 1.5rem; line-height: 2rem; font-weight: 700; color: #60a5fa; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
        .main-area { flex: 1 1 0%; background: #f1f5f9; overflow-y: auto; height: 60vh; padding: 0.5rem; }
        .plot-grid { display: grid; grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 1rem; height: 100%; }
        .plot-card { background: #fff; border-radius: 0.5rem; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); border-width: 1px; border-color: #e2e8f0; padding: 0.5rem; position: relative; display: flex; flex-direction: column; }
        .plot-fill { flex: 1 1 0%; }
        @media (min-width: 768px) {
            .app-body { flex-direction: row; }
            .sidebar { width: 20rem; height: 100vh; }
            .main-area { height: 100vh; padding: 1rem; }
        }
        @media (min-width: 1280px) {
            .plot-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar for control panel */
        .sidebar-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
        /* Responsive plot container */
        .plot-container {
            width: 100%;
            height: 100%;
            min-height: 300px;
        }
    </style>
</head>
<body class="app-body">

    <!-- Control Panel -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1 class="sidebar-title">Filtres RC <br/><span class="sidebar-subtitle">1er Ordre - Simulateur</span></h1>
        </div>
        
        <div class="sidebar-body sidebar-scroll">
            
            <!-- Type de filtre -->
            <div>
                <label for="filterType" class="field-label field-label-block">Type de filtre</label>
                <select id="filterType" class="select-field">
                    <option value="lowpass">Passe-bas (Low Pass)</option>
                    <option value="highpass">Passe-haut (High Pass)</option>
                </select>
            </div>

            <!-- Résistance -->
            <div>
                <div class="field-head">
                    <label for="resInput" class="field-label">Résistance (R)</label>
                    <span class="unit-label">Ω</span>
                </div>
                <div class="field-row">
                    <input type="range" id="resSlider" min="100" max="100000" step="100" value="22000" class="range-input range-blue">
                    <input type="number" id="resInput" min="100" max="100000" step="100" value="22000" class="num-input num-blue">
                </div>
            </div>

            <!-- Capacité -->
            <div>
                <div class="field-head">
                    <label for="capInput" class="field-label">Capacité (C)</label>
                    <span class="unit-label">F</span>
                </div>
                <!-- Using nF internally for slider to avoid floating point slider issues, but displaying scientific/farads in input -->
                <div class="field-row">
                    <input type="range" id="capSlider" min="1" max="1000" step="1" value="100" class="range-input range-blue" title="1 nF to 1000 nF">
                    <input type="number" id="capInput" value="100e-9" step="1e-9" class="num-input num-blue">
                </div>
            </div>

            <!-- Gain K -->
            <div>
                <div class="field-head">
                    <label for="gainInput" class="field-label">Gain statique (K)</label>
                    <span class="unit-label">Linéaire</span>
                </div>
                <div class="field-row">
                    <input type="range" id="gainSlider" min="0.1" max="10" step="0.1" value="1" class="range-input range-blue">
                    <input type="number" id="gainInput" min="0.1" max="10" step="0.1" value="1" class="num-input num-blue">
                </div>
            </div>

            <hr class="divider">

            <!-- Freq Entrée -->
            <div>
                <div class="field-head">
                    <label for="freqInput" class="field-label field-label-green">Fréquence du signal</label>
                    <span class="unit-label">Hz</span>
                </div>
                <div class="field-row">
                    <input type="range" id="freqSlider" min="1" max="5000" step="1" value="70" class="range-input range-green">
                    <input type="number" id="freqInput" min="1" max="100000" step="1" value="70" class="num-input num-green">
                </div>
            </div>

            <!-- Amplitude Entrée -->
            <div>
                <div class="field-head">
                    <label for="ampInput" class="field-label field-label-green">Amplitude d'entrée</label>
                    <span class="unit-label">V</span>
                </div>
                <div class="field-row">
                    <input type="range" id="ampSlider" min="0.1" max="10" step="0.1" value="1" class="range-input range-green">
                    <input type="number" id="ampInput" min="0.1" max="10" step="0.1" value="1" class="num-input num-green">
                </div>
            </div>

        </div>
        
        <!-- Display computed parameters -->
        <div class="readout">
            <div class="readout-label">Fréquence de coupure (fc)</div>
            <div class="readout-value" id="fcDisplay">72.34 Hz</div>
        </div>
    </aside>

    <!-- Main Content - Plots -->
    <main class="main-area">
        <div class="plot-grid">
            <div class="plot-card">
                <div id="plotBodeGain" class="plot-container plot-fill"></div>
            </div>
            <div class="plot-card">
                <div id="plotBodePhase" class="plot-container plot-fill"></div>
            </div>
            <div class="plot-card">
                <div id="plotNyquist" class="plot-container plot-fill"></div>
            </div>
            <div class="plot-card">
                <div id="plotTime" class="plot-container plot-fill"></div>
            </div>
        </div>
    </main>

    <script>
        // Global variables for plots
        const pltBodeGain = document.getElementById('plotBodeGain');
        const pltBodePhase = document.getElementById('plotBodePhase');
        const pltNyquist = document.getElementById('plotNyquist');
        const pltTime = document.getElementById('plotTime');

        // UI Elements
        const filterType = document.getElementById('filterType');
        
        const resSlider = document.getElementById('resSlider');
        const resInput = document.getElementById('resInput');
        
        const capSlider = document.getElementById('capSlider');
        const capInput = document.getElementById('capInput');
        
        const gainSlider = document.getElementById('gainSlider');
        const gainInput = document.getElementById('gainInput');
        
        const freqSlider = document.getElementById('freqSlider');
        const freqInput = document.getElementById('freqInput');
        
        const ampSlider = document.getElementById('ampSlider');
        const ampInput = document.getElementById('ampInput');

        const fcDisplay = document.getElementById('fcDisplay');

        // Layout Configuration for Plotly
        const baseLayout = {
            margin: { t: 40, r: 20, b: 40, l: 50 },
            font: { family: 'Inter, sans-serif' },
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)',
            showlegend: false
        };

        
        // Sync sliders and inputs
        function syncInputs(slider, input, scale = 1) {
            slider.addEventListener('input', (e) => {
                input.value = Number(e.target.value) * scale;
                updateAll();
            });
            input.addEventListener('input', (e) => {
                let val = Number(e.target.value);
                slider.value = val / scale;
                updateAll();
            });
        }

        syncInputs(resSlider, resInput);
        syncInputs(gainSlider, gainInput);
        syncInputs(freqSlider, freqInput);
        syncInputs(ampSlider, ampInput);
        
        // Custom sync for Capacitor (Slider is nF, Input is F)
        capSlider.addEventListener('input', (e) => {
            capInput.value = (Number(e.target.value) * 1e-9).toExponential(2);
            updateAll();
        });
        capInput.addEventListener('input', (e) => {
            capSlider.value = Number(e.target.value) * 1e9;
            updateAll();
        });

        filterType.addEventListener('change', updateAll);

        // Resize observer to make plots truly responsive
        window.addEventListener('resize', () => {
            Plotly.Plots.resize(pltBodeGain);
            Plotly.Plots.resize(pltBodePhase);
            Plotly.Plots.resize(pltNyquist);
            Plotly.Plots.resize(pltTime);
        });

        // Initialize empty plots
        function initPlots() {
            Plotly.newPlot(pltBodeGain, [], {}, {responsive: true});
            Plotly.newPlot(pltBodePhase, [], {}, {responsive: true});
            Plotly.newPlot(pltNyquist, [], {}, {responsive: true});
            Plotly.newPlot(pltTime, [], {}, {responsive: true});
        }

        
        // Generate logarithmic array
        function logspace(start, stop, num) {
            const arr = [];
            const step = (stop - start) / (num - 1);
            for (let i = 0; i < num; i++) {
                arr.push(Math.pow(10, start + step * i));
            }
            return arr;
        }

        // Generate linear array
        function linspace(start, stop, num) {
            const arr = [];
            const step = (stop - start) / (num - 1);
            for (let i = 0; i < num; i++) {
                arr.push(start + step * i);
            }
            return arr;
        }

        // Main Update function
        function updateAll() {
            // Get current values
            const type = filterType.value; // 'lowpass' or 'highpass'
            const R = Number(resInput.value);
            const C = Number(capInput.value);
            const K = Number(gainInput.value);
            const f_in = Number(freqInput.value);
            const A_in = Number(ampInput.value);

            // An empty or non-positive field (e.g. while typing) would give NaN or infinite
            // plots: keep the previous figures until the values are valid again.
            if (![R, C, K, f_in, A_in].every(v => Number.isFinite(v) && v > 0)) return;

            // Compute Cutoff Frequency
            const fc = 1 / (2 * Math.PI * R * C);
            fcDisplay.innerHTML = `${fc.toFixed(2)} Hz`;

            // Prepare Frequency Range for Bode/Nyquist (0.1 Hz to 100,000 Hz)
            // Using log10(0.1) = -1, log10(100000) = 5
            const freqs = logspace(-1, 5, 300);
            
            const gdb = [];
            const phi = [];
            const real = [];
            const imag = [];

            // Calculate Transfer Function
            for (let i = 0; i < freqs.length; i++) {
                const f = freqs[i];
                const x = f / fc;
                let re, im;

                if (type === 'lowpass') {
                    re = K / (1 + x * x);
                    im = -K * x / (1 + x * x);
                } else {
                    re = K * x * x / (1 + x * x);
                    im = K * x / (1 + x * x);
                }

                real.push(re);
                imag.push(im);

                const magnitude = Math.sqrt(re * re + im * im);
                gdb.push(20 * Math.log10(magnitude));
                
                // Phase in degrees
                phi.push(Math.atan2(im, re) * (180 / Math.PI));
            }

            // Transfer function H(j f/fc) = re + j im, (also used for the Nyquist plot)
            const transferAt = x => type === 'lowpass'
                ? { re: K / (1 + x * x),     im: -K * x / (1 + x * x) }
                : { re: K * x * x / (1 + x * x), im: K * x / (1 + x * x) };
            const Hin = transferAt(f_in / fc);   // point for the chosen signal frequency
            const Hfc = transferAt(1);           // point at the cutoff frequency (|H| = K/√2)

            const gain_in_db = 20 * Math.log10(Math.hypot(Hin.re, Hin.im));
            const phase_in_deg = Math.atan2(Hin.im, Hin.re) * 180 / Math.PI;
            const freqLabel = f_in >= 1000 ? (f_in / 1000).toPrecision(3) + ' kHz' : f_in.toPrecision(3) + ' Hz';
            // Red marker for the chosen signal frequency (same colour on every plot)
            const bodeMarker = (y, text, pos, hover) => ({
                x: [f_in], y: [y], type: 'scatter', mode: 'markers+text',
                marker: {color: '#ef4444', size: 12, line: {color: '#ffffff', width: 2}},
                text: [text], textposition: pos, textfont: {color: '#ef4444'},
                hovertemplate: hover + '<extra></extra>', name: 'f in'
            });

            // --- 1. Bode Gain Plot ---
            const K_db = 20 * Math.log10(K);
            const cutoff_db = K_db - 3.0103; // -3dB point

            const traceBodeGain = {
                x: freqs,
                y: gdb,
                type: 'scatter',
                mode: 'lines',
                line: {color: '#2563eb', width: 3},
                name: 'Gain (dB)'
            };
            const layoutBodeGain = {
                ...baseLayout,
                title: 'Bode en Gain',
                xaxis: { title: 'Fréquence (Hz)', type: 'log', gridcolor: '#e2e8f0' },
                yaxis: { title: 'Gain (dB)', gridcolor: '#e2e8f0' },
                shapes: [
                    { type: 'line', x0: fc, x1: fc, y0: Math.min(...gdb), y1: K_db + 5, line: { color: '#ef4444', width: 2, dash: 'dash' } },
                    { type: 'line', x0: 0.1, x1: 100000, y0: cutoff_db, y1: cutoff_db, line: { color: '#ef4444', width: 2, dash: 'dash' } }
                ],
                annotations: [
                    { x: Math.log10(fc), y: cutoff_db, xref: 'x', yref: 'y', text: 'fc, -3 dB', showarrow: true, arrowhead: 2, ax: 40, ay: 20 }
                ]
            };
            Plotly.react(pltBodeGain, [traceBodeGain, bodeMarker(gain_in_db, freqLabel, type === 'lowpass' ? 'top right' : 'bottom right', `f = ${f_in} Hz<br>G = ${gain_in_db.toFixed(2)} dB`)], layoutBodeGain);

            // --- 2. Bode Phase Plot ---
            const traceBodePhase = {
                x: freqs,
                y: phi,
                type: 'scatter',
                mode: 'lines',
                line: {color: '#8b5cf6', width: 3},
                name: 'Phase (°)'
            };
            
            const phase_cutoff = type === 'lowpass' ? -45 : 45;

            const layoutBodePhase = {
                ...baseLayout,
                title: 'Bode en Phase',
                xaxis: { title: 'Fréquence (Hz)', type: 'log', gridcolor: '#e2e8f0' },
                yaxis: { title: 'Phase (degré)', gridcolor: '#e2e8f0' },
                shapes: [
                    { type: 'line', x0: fc, x1: fc, y0: Math.min(...phi)-10, y1: Math.max(...phi)+10, line: { color: '#ef4444', width: 2, dash: 'dash' } },
                    { type: 'line', x0: 0.1, x1: 100000, y0: phase_cutoff, y1: phase_cutoff, line: { color: '#ef4444', width: 2, dash: 'dash' } }
                ],
                annotations: [
                    { x: Math.log10(fc), y: phase_cutoff, xref: 'x', yref: 'y', text: `fc, ${phase_cutoff}°`, showarrow: true, arrowhead: 2, ax: 40, ay: (type==='lowpass'?-20:20) }
                ]
            };
            Plotly.react(pltBodePhase, [traceBodePhase, bodeMarker(phase_in_deg, freqLabel, type === 'lowpass' ? 'top right' : 'bottom right', `f = ${f_in} Hz<br>φ = ${phase_in_deg.toFixed(1)}°`)], layoutBodePhase);

            // --- 3. Nyquist Plot ---
            const traceNyquist = {
                x: real,
                y: imag,
                customdata: freqs,
                type: 'scatter',
                mode: 'lines',
                line: {color: '#f59e0b', width: 3},
                hovertemplate: 'f = %{customdata:.3g} Hz<br>Re = %{x:.3f} V<br>Im = %{y:.3f} V<extra></extra>',
                name: 'Nyquist'
            };
            // Vector from the origin to the operating point: its length is |H|, its angle is the phase
            const traceNyquistVector = {
                x: [0, Hin.re],
                y: [0, Hin.im],
                type: 'scatter',
                mode: 'lines',
                line: {color: '#ef4444', width: 1.5, dash: 'dot'},
                hoverinfo: 'skip',
                name: 'H(f)'
            };
            const traceNyquistFc = {
                x: [Hfc.re],
                y: [Hfc.im],
                type: 'scatter',
                mode: 'markers+text',
                marker: {color: '#ffffff', size: 9, symbol: 'diamond', line: {color: '#64748b', width: 2}},
                text: ['fc'],
                textposition: type === 'lowpass' ? 'bottom left' : 'top left',
                textfont: {color: '#64748b'},
                hovertemplate: 'fc = ' + fc.toFixed(2) + ' Hz<extra></extra>',
                name: 'fc'
            };
            // Marker that moves along the curve when the signal frequency changes
            const traceNyquistMarker = {
                x: [Hin.re],
                y: [Hin.im],
                type: 'scatter',
                mode: 'markers+text',
                marker: {color: '#ef4444', size: 12, line: {color: '#ffffff', width: 2}},
                text: [`f = ${freqLabel}`],
                textposition: type === 'lowpass' ? 'bottom right' : 'top right',
                textfont: {color: '#ef4444'},
                hovertemplate: `f = ${f_in} Hz<br>|H| = ${Math.hypot(Hin.re, Hin.im).toFixed(3)}<br>φ = ${(Math.atan2(Hin.im, Hin.re) * 180 / Math.PI).toFixed(1)}°<extra></extra>`,
                name: 'f in'
            };

            const maxVal = Math.max(...real.map(Math.abs), ...imag.map(Math.abs), K) * 1.1;

            const layoutNyquist = {
                ...baseLayout,
                title: 'Diagramme de Nyquist',
                xaxis: { title: 'Partie réelle (V)', gridcolor: '#e2e8f0', zerolinecolor: '#94a3b8', range: [type === 'lowpass' ? -maxVal*0.1 : -maxVal*0.1, maxVal] },
                yaxis: { title: 'Partie imaginaire (V)', scaleanchor: "x", scaleratio: 1, gridcolor: '#e2e8f0', zerolinecolor: '#94a3b8' }
            };
            Plotly.react(pltNyquist, [traceNyquist, traceNyquistVector, traceNyquistFc, traceNyquistMarker], layoutNyquist);

            // --- 4. Time Response Plot ---
            // Calculate specific response for the chosen f_in
            const x_in = f_in / fc;
            let re_in, im_in;
            if (type === 'lowpass') {
                re_in = K / (1 + x_in * x_in);
                im_in = -K * x_in / (1 + x_in * x_in);
            } else {
                re_in = K * x_in * x_in / (1 + x_in * x_in);
                im_in = K * x_in / (1 + x_in * x_in);
            }
            
            const mag_in = Math.sqrt(re_in * re_in + im_in * im_in);
            const phase_in = Math.atan2(im_in, re_in); // in radians

            // 4 periods of the input frequency
            const T = 1 / f_in;
            const t_max = 4 * T; 
            const time_arr = linspace(0, t_max, 300);

            const v_in = [];
            const v_out = [];
            const time_ms = [];

            for (let i = 0; i < time_arr.length; i++) {
                const t = time_arr[i];
                time_ms.push(t * 1000); // ms for display
                
                v_in.push(A_in * Math.sin(2 * Math.PI * f_in * t));
                v_out.push(A_in * mag_in * Math.sin(2 * Math.PI * f_in * t + phase_in));
            }

            const traceVin = {
                x: time_ms,
                y: v_in,
                type: 'scatter',
                mode: 'lines',
                line: {color: '#94a3b8', width: 2, dash: 'dot'},
                name: 'V in'
            };
            const traceVout = {
                x: time_ms,
                y: v_out,
                type: 'scatter',
                mode: 'lines',
                line: {color: '#10b981', width: 3},
                name: 'V out'
            };

            const layoutTime = {
                ...baseLayout,
                title: 'Réponse temporelle',
                xaxis: { title: 'Temps (ms)', gridcolor: '#e2e8f0' },
                yaxis: { title: 'Tension (V)', gridcolor: '#e2e8f0' },
                showlegend: true,
                legend: { x: 0.8, y: 1 }
            };
            Plotly.react(pltTime, [traceVin, traceVout], layoutTime);
        }

        // Initialize and trigger first calculation
        initPlots();
        updateAll();

    </script>
